      scene.add(r);
      fx.push(r);
    }
    function puff(at, n) {
      for (let i = 0; i < n; i++) {
        const m = new THREE.Mesh(new THREE.SphereGeometry(.12, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .8 }));
        m.position.set(at.x + (Math.random() - .5) * .4, at.y + .08, at.z + (Math.random() - .5) * .4);
        m.userData = { v: new THREE.Vector3((Math.random() - .5) * 1.2, .8, (Math.random() - .5) * 1.2), life: .5, puff: true };
        scene.add(m); fx.push(m);
      }
    }
    function openEmoteMenu() { const m = $("emoteMenu"); m.classList.toggle("hidden"); }
    function closeEmoteMenu() { $("emoteMenu").classList.add("hidden"); }

    function updateCamera(dt) {
      if (P.moving && !isPointerDragging) {
        const desiredYaw = P.face + Math.PI;
        let diff = desiredYaw - camYaw;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        camYaw += diff * Math.min(1, dt * 2.8);
      }
      const tgt = new THREE.Vector3(P.pos.x, P.pos.y + 1.1, P.pos.z);
      const want = new THREE.Vector3(
        tgt.x + Math.sin(camYaw) * Math.cos(camPitch) * camDist,
        tgt.y + Math.sin(camPitch) * camDist,
        tgt.z + Math.cos(camYaw) * Math.cos(camPitch) * camDist);
      camera.position.lerp(want, Math.min(1, dt * 8));
      camera.lookAt(tgt);
      if (sky) sky.position.copy(camera.position);
      if (starsGroup && starsGroup.visible) starsGroup.position.copy(camera.position);

      const cfg = STAGES[G.stage] || STAGES[1];
      sun.position.set(P.pos.x + cfg.sunPos[0] * 0.7, cfg.sunPos[1], P.pos.z + cfg.sunPos[2] * 0.7);
      sun.target.position.set(P.pos.x, 0, P.pos.z);
    }

    function updateCards(dt, t) {
      let near = null, nd = 1e9;
      G.cards.forEach((c, i) => {
        const m = c.mesh;
        if (c.done) {
          if (c.flying !== undefined && m.visible) { c.flying += dt; m.position.y += dt * 6; m.scale.setScalar(Math.max(.01, 1 - c.flying * 1.6)); if (c.flying > .6) m.visible = false; }
          return;
        }
        m.userData.face.rotation.y += dt * 1.6;
        m.userData.face.position.y = 1.3 + Math.sin(t * 2.4 + i) * .15;
        m.userData.ring.scale.setScalar(1 + Math.sin(t * 3 + i) * .12);
        const dx = m.position.x - P.pos.x, dz = m.position.z - P.pos.z, d = Math.hypot(dx, dz);
        if (d < nd) { nd = d; near = c; }
        if (G.playing && !G.paused && d < 1.5 && Math.abs(P.pos.y - m.position.y) < 1.6 && performance.now() > c.cool) openQuiz(c);
      });
      // 가장 가까운 카드 쪽 화살표
      arrow.visible = false;
      // 바닥 길안내: 내 발밑에서 가장 가까운 카드까지 흘러가는 점선
      const showGuide = near && nd > 2.2 && G.playing;
      const STEP = .9, OFF = (t * 2.2) % STEP;
      const dx = near ? near.mesh.position.x - P.pos.x : 0, dz = near ? near.mesh.position.z - P.pos.z : 0;
      guideDots.forEach((d, i) => {
        const along = .9 + i * STEP + OFF;
        if (!showGuide || along > nd - .9) { d.visible = false; return; }
        const u = along / nd;
        d.visible = true;
        d.position.set(P.pos.x + dx * u, .06, P.pos.z + dz * u);
        d.material.opacity = Math.min(1, (nd - .9 - along) / 1.5, along / 1.6) * .9;
        d.material.color.copy(near.gold ? GUIDE_GOLD : GUIDE_COL);
      });
    }

    function updateFx(dt) {
      for (let i = fx.length - 1; i >= 0; i--) {
        const m = fx[i]; m.userData.life -= dt;
        if (m.userData.ripple) { m.scale.addScalar(dt * 3.5); m.material.opacity = Math.max(0, (m.userData.life / m.userData.maxLife) * 0.85); } else if (m.userData.puff) {

        } else {
          m.userData.v.y -= 12 * dt; m.position.addScaledVector(m.userData.v, dt); m.rotation.x += dt * 8;
          m.scale.setScalar(Math.max(.01, m.userData.life));

        if (m.userData.life <= 0) { scene.remove(m); fx.splice(i, 1); }
      }
    }

    let radarTick = 0;

      show("resultModal");
    }
    function renderRanks(myId) {
      const ranks = (load().ranks || {})[G.mode] || [];
      $("rankList").innerHTML = ranks.length ? ranks.map((r, i) => `<li class="${r.id === myId ? "me" : ""}"><span class="rk">${i + 1}</span><span class="art">${art(r.hero)}</span><span>${esc(r.name)}</span><span class="sc">${r.score}</span></li>`).join("")
        : `<li style="grid-template-columns:1fr;text-align:center;color:var(--ink-soft)">${G.mode === "timed" ? "3분 도전" : "천천히 탐험"} 순위가 아직 없어요</li>`;
    }
    $("rankForm").addEventListener("submit", e => {
      e.preventDefault();
      if (G.saved) return;
      const name = $("rankName").value.trim() || getHeroFullName();
      const s = load(), ranks = s.ranks || {}, list = ranks[G.mode] || [];
      const me = { id: Date.now(), name, score: G.score, hero: G.hero };
      list.push(me); list.sort((a, b) => b.score - a.score);
      ranks[G.mode] = list.slice(0, 5);
      save({ ranks, lastName: name });
      G.saved = true; $("rankForm").classList.add("hidden");
      renderRanks(me.id);
      toast(ranks[G.mode].some(r => r.id === me.id) ? "순위표에 올랐어요!" : "아쉽게 5등 안에 못 들었어요");
    });

    function openBook() {
      const book = load().book || {};
      const groups = [["forest", SCIENCE], ["village", LIFE], ["plaza", MALMOI]];
      let n = 0;
      $("bookScroll").innerHTML = groups.map(([zk, words]) => `
        <div class="book-zone"><h3><i style="background:${ZONES[zk].color}"></i>${ZONES[zk].name}</h3><div class="book-grid">
        ${words.map(w => { const has = book[w.word]; if (has) n++; return has
          ? `<div class="bcard"><span>${ZONES[zk].malmoi ? w.pic + " " : ""}${esc(w.word)}</span><button type="button" data-say="${esc(w.word + ". " + (w.meaning || ("북한말 " + w.nk)))}" aria-label="${esc(w.word)} 듣기">${ART.speaker}</button></div>`
          : `<div class="bcard locked">?</div>`; }).join("")}</div></div>`).join("");
      $("bookTotal").textContent = `${n} / ${SCIENCE.length + LIFE.length + MALMOI.length}`;
      $("bookScroll").querySelectorAll("[data-say]").forEach(b => b.onclick = () => say(b.dataset.say));
      show("bookModal");
    }
    function closeBook() { hide("bookModal"); }

        document.addEventListener("visibilitychange", () => { if (document.hidden && G.playing && !G.paused) openPause(); });
    document.addEventListener("pointerdown", () => {
      if (G.soundOn && !isBgmPlaying) {
        initBgmEngine();
        playTrack(-1);
      }
    });

    function refreshZoneSigns() {
      zoneSignBoards.forEach(({ board, z }) => {
        if (board && board.material) {
          board.material.map = textTexture(z.name, z.color, "#fff");
          board.material.needsUpdate = true;
        }
      });
    }

    /* ───────────── 시작 ───────────── */
    async function boot() {
      try {
        await Promise.all([
          document.fonts.load("80px 'BMJUA'", "과학 숲 생활 마을 문제풀이 광장 점프 놀이터"),
          document.fonts.load("80px 'Jua'", "과학 숲 생활 마을 문제풀이 광장 점프 놀이터"),
          document.fonts.ready
        ]);
      } catch (e) {}
      try {
        initThree();
        document.fonts.ready.then(() => refreshZoneSigns());
        syncSound();
        loadSoundfontInstruments();
        showTitle();
        loop();
        setTimeout(() => $("loadingScreen").remove(), 200);
      } catch (err) {
        console.error(err);
        $("loadingScreen").innerHTML = "3D 화면을 열지 못했어요.<br><span class='small' style='font-size:16px'>인터넷 연결을 확인하고 새로고침해 주세요.</span>";
      }
    }
    boot();
  </script>

</body>
</html>
