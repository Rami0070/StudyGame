<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8ED8FF">
  <title>낱말 탐험섬</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
    @font-face {
      font-family: 'BMJUA';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/BMJUA.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }
    /* 햇살 놀이터: 하늘 배경 + 흰 둥근 판 + 눌리는 젤리 버튼. 글씨는 크게, 그림은 더 크게. */
    :root {
      --sky1: #8ED8FF; --sky2: #D9F3FF; --grass: #7BD36B; --grass2: #5CBF55;
      --sun: #FFC531; --sun-d: #E0A100; --tomato: #FF6F59; --tomato-d: #D9483A;
      --leaf: #46C06A; --leaf-d: #2E9A4F; --sea: #3FA9F5; --sea-d: #1F84CF;
      --grape: #8E6CEF; --grape-d: #6B47D1; --cream: #FFFBF2; --ink: #3B3355; --ink-soft: #7A7394;
      --line: #EDE6D6;
    }
    * { font-family: 'BMJUA', 'Jua', 'BM JUA', 'BaeDalMinJoK JUA', sans-serif; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'BMJUA', 'Jua', 'BM JUA', 'BaeDalMinJoK JUA', sans-serif; color: var(--ink); background: var(--sky2); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; overflow: hidden; }
    button { font-family: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
    button:focus-visible { outline: 4px solid var(--sea); outline-offset: 3px; }
    .hidden { display: none !important; }
    .small { font-family: inherit; font-weight: 400; }

    #app { position: relative; width: 100%; height: 100dvh; overflow: hidden; background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 70%); }
    #gameViewport { position: absolute; inset: 0; }
    #gameViewport > canvas { display: block; touch-action: none; }

    /* 젤리 버튼 */
    .jelly { position: relative; border-radius: 26px; color: #fff; font-size: 26px; padding: 14px 28px; min-height: 64px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: var(--c, var(--sun)); box-shadow: 0 7px 0 var(--d, var(--sun-d)), 0 12px 22px rgba(59, 51, 85, .18); transition: transform .08s, box-shadow .08s; text-shadow: 0 2px 0 rgba(0,0,0,.12); }
    .jelly:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--d, var(--sun-d)), 0 5px 10px rgba(59, 51, 85, .18); }
    .jelly.sun { --c: var(--sun); --d: var(--sun-d); color: #5A3B00; text-shadow: none; }
    .jelly.tomato { --c: var(--tomato); --d: var(--tomato-d); }
    .jelly.leaf { --c: var(--leaf); --d: var(--leaf-d); }
    .jelly.sea { --c: var(--sea); --d: var(--sea-d); }
    .jelly.grape { --c: var(--grape); --d: var(--grape-d); }
    .jelly.white { --c: #fff; --d: #DCD3C0; color: var(--ink); text-shadow: none; }
    .round { width: 64px; height: 64px; padding: 0; border-radius: 50%; font-size: 30px; }
    .jelly svg { width: 34px; height: 34px; flex: none; }
    .round svg { width: 30px; height: 30px; }

    .panel { background: var(--cream); border-radius: 36px; box-shadow: 0 10px 0 #E9DFC8, 0 24px 50px rgba(59, 51, 85, .22); }
    .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
    .overlay.dim { background: rgba(43, 36, 70, .45); }
    .art img, .art svg { width: 100%; height: 100%; display: block; object-fit: contain; }

    /* 하늘 장식 (시작 화면) */
    .cloud { position: absolute; background: #fff; border-radius: 999px; opacity: .9; }
    .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
    .cloud::before { width: 55%; height: 160%; left: 15%; top: -70%; }
    .cloud::after { width: 40%; height: 120%; right: 12%; top: -45%; }
    .hills { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; }

    /* 시작 화면 */
    #charSelectModal { background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 75%); flex-direction: column; justify-content: flex-start; gap: 18px; }
    .logo { display: flex; align-items: center; gap: 14px; margin-top: 6px; z-index: 1; }
    .logo h1 { margin: 0; font-size: clamp(40px, 7vw, 64px); color: #fff; letter-spacing: 2px; -webkit-text-stroke: 3px var(--sea-d); paint-order: stroke fill; text-shadow: 0 6px 0 var(--sea-d); font-weight: 400; }
    .step-title { font-size: 26px; color: var(--ink); display: flex; align-items: center; gap: 10px; }
    .step-title b { width: 40px; height: 40px; border-radius: 50%; background: var(--tomato); color: #fff; display: grid; place-items: center; font-weight: 400; font-size: 22px; }
    .start-card { width: min(980px, 100%); padding: 22px 24px 26px; display: grid; gap: 18px; z-index: 1; }
    .scn-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
    .scn { border-radius: 26px; background: #fff; padding: 10px 6px 12px; display: grid; justify-items: center; gap: 4px; box-shadow: 0 6px 0 #E3DAC6; border: 4px solid transparent; transition: transform .12s; }
    .scn .art { width: 100%; aspect-ratio: 1; max-width: 108px; }
    .scn span { font-size: 21px; }
    .scn[aria-pressed="true"] { border-color: var(--sun); background: #FFF4CF; transform: translateY(-4px) rotate(-1.5deg); box-shadow: 0 10px 0 var(--sun-d); }
    .hero-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .hero-card { border-radius: 30px; background: #fff; padding: 12px 8px 14px; display: grid; justify-items: center; gap: 4px; box-shadow: 0 6px 0 #E3DAC6; border: 5px solid transparent; position: relative; transition: transform .12s; }
    .hero-card .art { width: min(150px, 100%); aspect-ratio: 1; }
    .hero-card span { font-size: clamp(17px, 2.1vw, 24px); color: #232338; font-weight: 700; white-space: nowrap; }
    .hero-card.on { border-color: var(--leaf); background: #EAFBE6; transform: translateY(-5px); box-shadow: 0 11px 0 var(--leaf-d); }
    .hero-name-row { display: flex; align-items: center; justify-content: center; gap: 14px; background: #fff; border-radius: 24px; padding: 10px 20px; box-shadow: 0 5px 0 #E3DAC6; margin-top: -4px; flex-wrap: wrap; }
    .hero-name-row .name-label { display: flex; align-items: center; gap: 8px; font-size: 22px; color: var(--ink); font-weight: 700; }
    .name-input-box { display: flex; align-items: center; gap: 8px; background: #F7F4EC; border: 3px solid var(--line); border-radius: 18px; padding: 6px 14px; transition: border-color .15s, background .15s; }
    .name-input-box:focus-within { border-color: var(--sea); background: #fff; box-shadow: 0 0 0 3px rgba(63,169,245,.2); }
    .role-prefix { font-size: 24px; color: var(--sea-d); font-weight: 700; white-space: nowrap; }
    #heroCustomName { font-family: 'Jua', sans-serif; font-size: 24px; border: none; background: transparent; color: var(--ink); width: 150px; outline: none; }
    #heroCustomName::placeholder { color: #BDB7CA; font-size: 20px; }
    .hero-card.on::after { content: "✔"; position: absolute; top: -12px; right: -10px; width: 44px; height: 44px; border-radius: 50%; background: var(--leaf); color: #fff; display: grid; place-items: center; font-size: 24px; box-shadow: 0 4px 0 var(--leaf-d); }
    .start-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .scn-intro { display: flex; align-items: center; gap: 12px; font-size: 20px; color: var(--ink-soft); min-width: 0; flex: 1 1 300px; }
    .best { font-size: 30px; letter-spacing: 2px; }
    #startBtn { font-size: 34px; padding: 16px 44px; min-height: 80px; }

    /* 문제 난이도 태그 배지 */
    .diff-tag { display: inline-flex; align-items: center; justify-content: center; padding: 4px 14px; border-radius: 999px; font-size: 19px; font-weight: 700; color: #fff; line-height: 1.2; box-shadow: 0 4px 0 rgba(0,0,0,0.12); margin-left: 8px; }
    .diff-tag.high { background: #FF253A; border: 2px solid #D61123; }
    .diff-tag.mid { background: #00C853; border: 2px solid #009624; }
    .diff-tag.low { background: #FFD600; color: #4A3000; border: 2px solid #D4A500; }

    /* 게임 중 HUD */
    .hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); z-index: 25; pointer-events: none; }
    .hud > * { pointer-events: auto; }
    .doors { display: flex; gap: 6px; background: rgba(255,255,255,.92); padding: 10px 14px; border-radius: 999px; box-shadow: 0 5px 0 rgba(0,0,0,.08); }
    .doors i { width: 22px; height: 22px; border-radius: 7px; background: #E6E0F2; display: block; }
    .doors i.on { background: var(--leaf); box-shadow: inset 0 -4px 0 var(--leaf-d); }
    .doors i.next { background: var(--sun); box-shadow: inset 0 -4px 0 var(--sun-d); animation: blink 1s ease-in-out infinite; }
    @keyframes blink { 50% { transform: scale(1.18); } }
    .pill { background: #fff; border-radius: 999px; padding: 6px 18px 6px 8px; display: flex; align-items: center; gap: 8px; font-size: 30px; box-shadow: 0 5px 0 rgba(0,0,0,.08); }
    .pill svg { width: 40px; height: 40px; }
    .hud-right { display: flex; gap: 12px; align-items: center; }
    .notice { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(22px, env(safe-area-inset-bottom, 0px)); z-index: 10; background: rgba(255,255,255,.95); border-radius: 999px; padding: 10px 22px; font-size: 22px; box-shadow: 0 5px 0 rgba(0,0,0,.08); pointer-events: none; max-width: calc(100% - 440px); text-align: center; }
    @media (max-width: 900px) { .notice { bottom: auto; top: calc(max(14px, env(safe-area-inset-top, 0px)) + 78px); max-width: calc(100% - 32px); font-size: 18px; } }
    #minimapWrap { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 10; background: #fff; padding: 8px; border-radius: 22px; box-shadow: 0 6px 0 rgba(0,0,0,.1); }
    #minimap { display: block; width: 168px; height: 136px; border-radius: 14px; }
    #dpad { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 20; display: none; grid-template-columns: repeat(3, 76px); grid-template-rows: repeat(3, 76px); gap: 6px; }
    @media (pointer: coarse) { #dpad { display: grid; } #minimap { width: 126px; height: 102px; } }
    #dpad button { border-radius: 24px; font-size: 32px; touch-action: none; padding: 0; min-height: 0; }
    #dpad .act { font-size: 22px; }

    /* 이야기 말풍선 */
    .story { width: min(820px, 100%); display: flex; align-items: flex-end; gap: 16px; margin-top: auto; }
    .story .who { width: 150px; flex: none; text-align: center; }
    .story .who .art { width: 150px; height: 150px; background: #fff; border-radius: 50%; padding: 12px; box-shadow: 0 8px 0 #E3DAC6; box-sizing: border-box; display: grid; place-items: center; font-size: 84px; }
    .story .who span { display: inline-block; margin-top: 8px; background: var(--grape); color: #fff; border-radius: 999px; padding: 4px 14px; font-size: 18px; }
    .bubble { flex: 1; position: relative; padding: 22px 26px 20px; display: grid; gap: 14px; min-width: 0; }
    .bubble::before { content: ""; position: absolute; left: -22px; bottom: 48px; border: 14px solid transparent; border-right: 22px solid var(--cream); border-left: 0; }
    .bubble p { margin: 0; font-size: 25px; line-height: 1.5; word-break: keep-all; }
    .bubble .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .tag { background: #FFF0C7; color: #8A5A00; border-radius: 999px; padding: 4px 14px; font-size: 18px; }

    /* Quiz Modal (Prevent size distortion and scrollbar) */
    #quizModal {
      overflow: hidden !important;
    }
    .quiz {
      width: min(860px, 94vw);
      max-height: 92vh;
      overflow: hidden;
      padding: 22px 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-sizing: border-box;
      margin: auto;
      transform: none !important;
    }
    .quiz-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; flex: none; }
    .quiz-card-badge { display: flex; align-items: center; gap: 8px; }
    .badge-gold {
      display: inline-flex; align-items: center; gap: 6px;
      background: linear-gradient(135deg, #F59E0B, #FBBF24);
      color: #78350F; font-size: 20px; font-weight: 700;
      padding: 5px 16px; border-radius: 999px;
      border: 2px solid #FEF08A; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
    }
    .badge-normal {
      display: inline-flex; align-items: center; gap: 6px;
      background: #F1F5F9; color: #475569; font-size: 19px; font-weight: 600;
      padding: 5px 14px; border-radius: 999px; border: 1.5px solid #CBD5E1;
    }
    .doorbadge { display: none; }
    #quizHintTag { display: none; }
    #quizPrompt { margin: 0; font-size: clamp(28px, 3.8vw, 40px); line-height: 1.35; word-break: keep-all; text-align: center; font-weight: 400; flex: none; }
    #quizPrompt strong, #quizPrompt b { color: var(--tomato-d); font-weight: 700; }
    #quizPrompt .quote { display: block; margin-top: 10px; background: #fff; border-radius: 20px; padding: 14px 20px; font-size: clamp(22px, 3vw, 32px); line-height: 1.45; color: var(--ink); box-shadow: inset 0 0 0 3px var(--line); word-break: keep-all; }
    #quizOptions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: none; }
    #quizOptions.one { grid-template-columns: 1fr; }
    .opt { min-height: 84px; font-size: 30px; border-radius: 24px; padding: 12px 18px; }
    .opt.long { font-size: 23px; min-height: 76px; justify-content: flex-start; text-align: left; line-height: 1.35; font-family: inherit; font-weight: 400; }
    .opt .n { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.35); display: grid; place-items: center; font-size: 22px; flex: none; }
    .opt.ox { min-height: 130px; font-size: 84px; line-height: 1; }
    .opt[disabled] { cursor: default; }
    .opt-wrong { filter: grayscale(1); opacity: .45; transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.15) !important; }
    .opt-right { outline: 5px solid #fff; box-shadow: 0 0 0 8px var(--leaf), 0 5px 0 var(--d) !important; transform: none !important; }
    .quiz-bottom { display: flex; justify-content: space-between; align-items: center; gap: 14px; min-height: 58px; flex: none; }
    #quizHintBox { background: #FFF0C7; border-radius: 20px; padding: 10px 18px; font-size: 24px; text-align: center; flex: none; }
    #quizHintBox b { color: var(--tomato-d); font-weight: 700; letter-spacing: 4px; font-size: 30px; }
    #quizFeedback {
      text-align: center;
      font-size: clamp(23px, 3.2vw, 29px);
      padding: 10px 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid var(--line);
      box-shadow: 0 3px 0 #E3DAC6;
      line-height: 1.3;
      min-height: 58px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: none;
    }
    #quizFeedback .mean { display: block; font-size: clamp(18px, 2.2vw, 21px); color: var(--ink-soft); margin-top: 3px; font-family: inherit; font-weight: 400; }
    .shake { animation: shake .4s ease-in-out; }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
    /* Result Modal (Wide 2-column layout) */
    .result {
      width: min(940px, 94vw);
      max-height: 92vh;
      overflow-y: auto;
      padding: 22px 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
      box-sizing: border-box;
      margin: auto;
    }
    .result .art[data-art="trophy"] {
      width: 96px;
      height: 96px;
      flex: none;
      margin: 0 auto 2px;
    }
    .result h2 {
      margin: 0;
      font-size: clamp(28px, 3.8vw, 38px);
      font-weight: 400;
      color: var(--tomato-d);
      line-height: 1.2;
    }
    .result-body-grid {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 18px;
      width: 100%;
      align-items: stretch;
      margin-top: 4px;
    }
    @media (max-width: 720px) {
      .result-body-grid { grid-template-columns: 1fr; gap: 14px; }
      .result .art[data-art="trophy"] { width: 76px; height: 76px; }
    }
    .result-left-col {
      background: #FFFFFF;
      border-radius: 26px;
      padding: 16px 18px;
      box-shadow: 0 4px 0 #E3DAC6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .result-right-col {
      background: #FFFFFF;
      border-radius: 26px;
      padding: 16px 18px;
      box-shadow: 0 4px 0 #E3DAC6;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }
    .result-right-header {
      font-size: 22px;
      color: var(--ink);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px dashed var(--line);
      padding-bottom: 6px;
    }
    #resultStars { font-size: 70px; letter-spacing: 8px; line-height: 1; }
    #resultStars span { display: inline-block; animation: starin .5s cubic-bezier(.2, 1.8, .4, 1) both; }
    #resultStars span:nth-child(2) { animation-delay: .25s; } #resultStars span:nth-child(3) { animation-delay: .5s; }
    @keyframes starin { from { transform: scale(0) rotate(-40deg); } to { transform: none; } }
    .star-on { color: var(--sun); text-shadow: 0 5px 0 var(--sun-d); } .star-off { color: #E4DDCE; }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .stat { background: #F8F5EE;
      border-radius: 20px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 23px;
      box-shadow: 0 3px 0 #E3DAC6;
    }
    .stat svg { width: 30px; height: 30px; }
    #reviewWordList {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-height: 230px;
      overflow-y: auto;
      padding: 4px;
    }
    .wordchip { background: #F8F5EE; border-radius: 16px; padding: 6px 14px; font-size: 21px; box-shadow: 0 3px 0 #E3DAC6; display: flex; align-items: center; gap: 8px; }
    .wordchip.miss { background: #FFE8E3; box-shadow: 0 3px 0 #F6B9AC; }
    .wordchip button { width: 30px; height: 30px; border-radius: 50%; background: var(--sea); color: #fff; display: grid; place-items: center; }
    .wordchip button svg { width: 16px; height: 16px; }
    #resultSummary { margin: 0; font-size: 20px; color: var(--ink-soft); }
    .btnrow { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; width: 100%; }
    /* 일시정지 */
    .pause { width: min(520px, 100%); padding: 26px; display: grid; gap: 14px; }
    .pause h2 { margin: 0 0 4px; text-align: center; font-weight: 400; font-size: 38px; }
    .pause .jelly { width: 100%; justify-content: flex-start; padding-left: 24px; }
    .teacher { border-top: 3px dashed var(--line); padding-top: 12px; font-family: inherit; font-size: 16px; color: var(--ink-soft); }
    .teacher summary { cursor: pointer; font-family: 'Jua'; font-size: 18px; color: var(--ink-soft); }
    .teacher .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .teacher .mini { font-family: 'Jua'; font-size: 16px; padding: 10px 14px; border-radius: 14px; background: #fff; box-shadow: 0 4px 0 #E3DAC6; cursor: pointer; }

    #loadingScreen { position: absolute; inset: 0; z-index: 90; background: linear-gradient(180deg, var(--sky1), var(--sky2)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-size: 30px; }
    #loadingScreen .art { width: 160px; height: 160px; animation: bob 1s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-14px); } }

    .toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 100; max-width: calc(100% - 32px); background: #fff; color: var(--ink); font-size: 22px; padding: 12px 24px; border-radius: 999px; box-shadow: 0 6px 0 rgba(0,0,0,.12); }
    .toast.warn { background: #FFE8E3; }

    @media (max-width: 760px) {
      .scn-row { grid-template-columns: repeat(3, 1fr); }
      .hero-card .art { width: 100px; }
      .story { flex-direction: column; align-items: stretch; }
      .story .who { display: flex; align-items: center; gap: 12px; width: auto; }
      .story .who .art { width: 90px; height: 90px; font-size: 50px; }
      .bubble::before { display: none; }
      .opt { font-size: 26px; min-height: 76px; }
      .opt.ox { min-height: 110px; font-size: 70px; }
      .notice { font-size: 17px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

    /* ── 열린 세상 전용 ── */
    .hud-center { display: flex; gap: 10px; align-items: center; }
    .stage-pill { font-size: 22px; padding: 8px 18px; font-weight: bold; background: var(--sea); color: #fff; letter-spacing: 0.5px; }
    .stage-banner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; pointer-events: none; display: flex; align-items: center; justify-content: center; animation: bannerPop 2.4s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards; }
    .stage-banner-box { background: rgba(255, 255, 255, 0.95); border: 6px solid var(--sun); box-shadow: 0 14px 44px rgba(0, 0, 0, 0.32), 0 0 50px rgba(255, 197, 49, 0.45); border-radius: 40px; padding: 24px 64px 28px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; backdrop-filter: blur(8px); }
    .stage-banner-sub { font-size: 24px; color: var(--ink-soft); letter-spacing: 1px; }
    .stage-banner-title { margin: 0; font-size: clamp(48px, 9vw, 84px); color: #FF5722; -webkit-text-stroke: 3px #fff; paint-order: stroke fill; text-shadow: 0 6px 0 rgba(0, 0, 0, 0.15); white-space: nowrap; }
    @keyframes bannerPop { 0% { opacity: 0; transform: translate(-50%, -40%) scale(0.5); } 14% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 24% { transform: translate(-50%, -50%) scale(1); } 78% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -65%) scale(0.85); } }
    .pill.big { font-size: 34px; padding: 6px 22px 6px 10px; }
    #comboBadge { position: absolute; top: calc(max(14px, env(safe-area-inset-top, 0px)) + 74px); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 11; background: var(--tomato); color: #fff; font-size: 26px; padding: 6px 18px; border-radius: 999px; box-shadow: 0 5px 0 var(--tomato-d); transform-origin: right center; }
    #comboBadge.bump { animation: pop .4s cubic-bezier(.2, 1.8, .4, 1); }
    #radarWrap { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 10; background: #fff; padding: 8px; border-radius: 50%; box-shadow: 0 6px 0 rgba(0,0,0,.1); }
    #radar { display: block; width: 150px; height: 150px; border-radius: 50%; }
    @media (pointer: coarse) { #radarWrap { top: calc(max(14px, env(safe-area-inset-top, 0px)) + 130px); bottom: auto; } #radar { width: 116px; height: 116px; } }
    #joyZone { position: absolute; left: 0; top: 0; width: 68%; height: 100%; z-index: 15; display: none; touch-action: none; user-select: none; -webkit-user-select: none; }
    #joyBase { position: absolute; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.45); border: 4px solid rgba(255,255,255,.9); box-shadow: 0 8px 24px rgba(0,0,0,.15); transform: translate(-50%, 50%); left: 110px; bottom: 100px; top: auto; pointer-events: none; opacity: .65; transition: opacity .2s ease; }
    #joyKnob { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: var(--sea); box-shadow: 0 5px 0 var(--sea-d); pointer-events: none; }
    #jumpBtn { position: absolute; right: max(24px, env(safe-area-inset-right, 0px)); bottom: max(28px, env(safe-area-inset-bottom, 0px)); z-index: 16; width: 108px; height: 108px; font-size: 32px; font-family: 'Jua', sans-serif; display: none; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 8px 0 var(--sun-d), 0 10px 24px rgba(0,0,0,.18); }
    #jumpBtn:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--sun-d); }
    @media (pointer: coarse) { #joyZone { display: block; } #jumpBtn { display: inline-flex; } .notice { bottom: auto; top: calc(max(14px, env(safe-area-inset-top, 0px)) + 78px); } }
    body.touch-device #joyZone { display: block !important; }
    body.touch-device #jumpBtn { display: inline-flex !important; }
    body.touch-device .notice { bottom: auto !important; top: calc(max(14px, env(safe-area-inset-top, 0px)) + 78px) !important; }
    body.touch-device #radarWrap { top: calc(max(14px, env(safe-area-inset-top, 0px)) + 130px) !important; bottom: auto !important; }
    body.touch-device #radar { width: 116px; height: 116px; }

    .mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .mode { flex-direction: column; min-height: 130px; font-size: 32px; border-radius: 30px; gap: 4px; }
    .mode small { font-size: 18px; opacity: .9; font-family: inherit; font-weight: 400; }
    .start-foot { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }

    #resultScore { font-size: 72px; color: var(--sea-d); line-height: 1; }
    .namebox { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .namebox input { font-family: 'Jua'; font-size: 26px; border-radius: 20px; border: 4px solid var(--line); padding: 8px 16px; width: 200px; background: #fff; color: var(--ink); text-align: center; }
    .namebox input:focus { outline: none; border-color: var(--sea); }
    #rankList { width: 100%; max-width: 420px; display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
    #rankList li { display: grid; grid-template-columns: 44px 44px 1fr auto; align-items: center; gap: 8px; background: #fff; border-radius: 16px; padding: 4px 14px 4px 6px; font-size: 22px; box-shadow: 0 3px 0 #E3DAC6; }
    #rankList li.me { background: #FFF4CF; }
    #rankList .rk { width: 36px; height: 36px; border-radius: 50%; background: var(--grape); color: #fff; display: grid; place-items: center; font-size: 18px; }
    #rankList .art { width: 40px; height: 40px; }
    #rankList .sc { color: var(--sea-d); font-variant-numeric: tabular-nums; }

    .book { width: min(900px, 100%); padding: 22px 24px 24px; display: grid; gap: 14px; max-height: 100%; }
    .book h2 { margin: 0; font-weight: 400; font-size: 36px; text-align: center; }
    .book-zone h3 { margin: 4px 0 8px; font-weight: 400; font-size: 24px; display: flex; align-items: center; gap: 8px; }
    .book-zone h3 i { width: 18px; height: 18px; border-radius: 50%; display: inline-block; }
    .book-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .bcard { background: #fff; border-radius: 18px; padding: 8px 10px 8px 16px; font-size: 24px; box-shadow: 0 4px 0 #E3DAC6; display: flex; align-items: center; gap: 8px; }
    .bcard.locked { background: #EFEAF7; color: #B9B0D0; box-shadow: none; }
    .bcard button { width: 36px; height: 36px; border-radius: 50%; background: var(--sea); color: #fff; display: grid; place-items: center; }
    .bcard button svg { width: 18px; height: 18px; }
    #bookScroll { overflow-y: auto; display: grid; gap: 12px; padding-right: 4px; }
    .overlay { z-index: 40; } #startModal, #resultModal { z-index: 50; } #pauseModal, #bookModal { z-index: 60; }
    .toast { bottom: auto !important; top: calc(86px + env(safe-area-inset-top, 0px)); }
    #app:not(.play) .hud, #app:not(.play) #radarWrap, #app:not(.play) #noticeBox, #app:not(.play) #joyZone, #app:not(.play) #jumpBtn, #app:not(.play) #comboBadge { display: none !important; }
    /* 감정표현 */
    #emoteBtn { position: absolute; z-index: 16; right: max(150px, calc(env(safe-area-inset-right, 0px) + 150px)); bottom: max(28px, env(safe-area-inset-bottom, 0px)); width: 84px; height: 84px; font-size: 40px; }
    @media (pointer: fine) { #emoteBtn { right: max(196px, calc(env(safe-area-inset-right, 0px) + 196px)); bottom: max(24px, env(safe-area-inset-bottom, 0px)); } }
    #emoteMenu { position: absolute; z-index: 17; left: 50%; width: max-content; transform: translateX(-50%); bottom: calc(max(28px, env(safe-area-inset-bottom, 0px)) + 104px); display: flex; gap: 10px; background: rgba(255,255,255,.92); padding: 12px; border-radius: 30px; box-shadow: 0 8px 0 rgba(0,0,0,.08); max-width: calc(100% - 32px); flex-wrap: wrap; justify-content: center; }
    #emoteMenu.hidden { display: none !important; }
    .emo { flex-direction: column; width: 88px; min-height: 92px; padding: 6px; font-size: 18px; gap: 0; border-radius: 22px; }
    .emo span { font-size: 40px; line-height: 1.1; }
    #app:not(.play) #emoteBtn, #app:not(.play) #emoteMenu { display: none !important; }
  </style>
</head>
<body>
<div id="app">
  <div id="gameViewport"></div>

  <!-- 게임 중 표시 -->
  <div class="hud" id="hud">
    <button type="button" class="jelly white round" onclick="openPause()" aria-label="멈춤 메뉴">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4.5" height="16" rx="1.5"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.5"/></svg>
    </button>
    <div class="hud-center">
      <div class="pill stage-pill" id="stagePill" aria-label="현재 스테이지"><span id="stagePillText">스테이지 1 / 3</span></div>
      <div class="pill" aria-label="모은 카드"><span class="art" data-art="card" style="width:40px;height:40px"></span><span id="cardText">0 / 10</span></div>
      <div class="pill hidden" id="timerPill" aria-label="남은 시간"><span class="art" data-art="clock" style="width:38px;height:38px"></span><span id="timerText">3:00</span></div>
    </div>
    <div class="hud-right">
      <div class="pill big" aria-label="점수"><span class="art" data-art="star" style="width:42px;height:42px"></span><span id="scoreText">0</span></div>
      <button type="button" class="jelly white round" id="soundBtn" onclick="toggleSound()" aria-label="소리 켜기/끄기"></button>
    </div>
  </div>
  <div id="stageBanner" class="stage-banner hidden" aria-live="polite">
    <div class="stage-banner-box">
      <div class="stage-banner-sub" id="bannerSub">맑은 햇살 아래</div>
      <h1 class="stage-banner-title" id="bannerTitle">게임 스타트</h1>
    </div>
  </div>
  <button type="button" id="emoteBtn" class="jelly grape round" onclick="openEmoteMenu()" aria-label="감정표현">😊</button>
  <div id="emoteMenu" class="hidden" role="menu" aria-label="감정표현 고르기">
    <button type="button" class="jelly white emo" onclick="emote('wave')"><span>👋</span>안녕</button>
    <button type="button" class="jelly white emo" onclick="emote('happy')"><span>😄</span>신나</button>
    <button type="button" class="jelly white emo" onclick="emote('dance')"><span>🎵</span>춤</button>
    <button type="button" class="jelly white emo" onclick="emote('cheer')"><span>🎉</span>만세</button>
    <button type="button" class="jelly white emo" onclick="emote('sad')"><span>😢</span>슬퍼</button>
    <button type="button" class="jelly white emo" onclick="emote('wow')"><span>😮</span>우와</button>
  </div>
  <div id="comboBadge" class="hidden"></div>
  <div class="notice" id="noticeBox"><span id="noticeText">빛나는 카드를 찾아요!</span></div>
  <div id="radarWrap"><canvas id="radar" width="300" height="300" aria-label="지도"></canvas></div>
  <div id="joyZone" aria-label="움직이기"><div id="joyBase"><div id="joyKnob"></div></div></div>
  <button type="button" id="jumpBtn" class="jelly sun round" aria-label="점프">점프</button>

  <!-- 시작 화면 -->
  <div id="startModal" class="overlay" style="display:flex;flex-direction:column;justify-content:flex-start;gap:18px;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 75%)">
    <div class="cloud" style="width:180px;height:56px;left:6%;top:9%"></div>
    <div class="cloud" style="width:130px;height:42px;right:9%;top:16%"></div>
    <svg class="hills" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true"><path d="M0 120 Q200 40 420 110 T820 90 T1200 100 V200 H0Z" fill="#9BE08A"/><path d="M0 160 Q300 90 600 150 T1200 140 V200 H0Z" fill="#7BD36B"/></svg>
    <div class="logo"><span class="art" data-art="compass" style="width:84px;height:84px"></span><h1>낱말 탐험섬</h1></div>
    <div class="panel start-card">
      <div class="step-title"><b>1</b>누구랑 갈까?</div>
      <div class="hero-row" id="heroRow"></div>
      <div class="hero-name-row">
        <label for="heroCustomName" class="name-label">
          <span class="art" data-art="star" style="width:26px;height:26px"></span>
          <span>이름 직접 정하기:</span>
        </label>
        <div class="name-input-box">
          <span id="heroRolePrefix" class="role-prefix">탐험가</span>
          <input type="text" id="heroCustomName" maxlength="8" placeholder="예: 도로" autocomplete="off" aria-label="캐릭터 이름">
        </div>
      </div>
      <div class="step-title"><b>2</b>어떻게 놀까?</div>
      <div class="mode-row">
        <button type="button" class="jelly leaf mode" onclick="startGame('free')">🧭 천천히 탐험<small>스테이지별 10장 모아 통과</small></button>
        <button type="button" class="jelly tomato mode" onclick="startGame('timed')">⏱ 3분 도전<small>3분 동안 많이 모으기</small></button>
      </div>
      <div class="start-foot">
                <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button type="button" class="jelly grape" onclick="openBook()" style="font-size:22px">📖 낱말 도감 <span id="bookCount"></span></button>
          <button type="button" class="jelly white" id="homeSoundBtn" onclick="toggleSound()" style="font-size:20px;min-height:56px;padding:10px 18px" aria-label="효과음 켜기/끄기">🔊 효과음 켜짐</button>
        </div>
        <span class="small" style="color:var(--ink-soft);font-size:14px">키보드: WASD/방향키 이동 · 스페이스 점프 | 태블릿: 화면 터치 밀기 이동 · 점프 버튼</span>
      </div>
    </div>
  </div>

  <!-- 문제 -->
  <div id="quizModal" class="overlay dim hidden">
    <div id="quizCard" class="panel quiz" role="dialog" aria-modal="true" aria-labelledby="quizPrompt">
      <div class="quiz-top">
        <div id="quizCardTypeBadge" class="quiz-card-badge"></div>
        <button type="button" class="jelly sea round" id="quizSay" aria-label="문제 듣기"></button>
      </div>
      <p id="quizPrompt"></p>
      <div id="quizOptions"></div>
      <div id="quizHintBox" class="hidden"></div>
      <div id="quizFeedback" class="hidden" aria-live="polite"></div>
      <div class="quiz-bottom">
        <button type="button" class="jelly white" onclick="closeQuiz(true)" style="font-size:22px;min-height:58px;padding:12px 24px">↩ 나중에</button>
        <button type="button" id="quizHintBtn" class="jelly sun" onclick="showHint()" style="font-size:22px;min-height:58px;padding:12px 24px"><span class="art" data-art="bulb" style="width:32px;height:32px"></span>힌트</button>
      </div>
    </div>
  </div>

  <!-- 멈춤 -->
  <div id="pauseModal" class="overlay dim hidden">
    <div class="panel pause" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
      <h2 id="pauseTitle">잠깐 쉬기</h2>
      <button type="button" class="jelly leaf" onclick="closePause()">▶ 계속하기</button>
      <button type="button" class="jelly sea" onclick="startGame(G.mode)">↻ 처음부터 다시</button>
      <button type="button" class="jelly grape" onclick="toTitle()">⌂ 첫 화면</button>
      <button type="button" class="jelly white" onclick="toggleSound()" id="pauseSoundBtn">🔊 효과음 켜짐</button>
    </div>
  </div>

  <!-- Result Modal -->
  <div id="resultModal" class="overlay dim hidden">
    <div class="panel result">
      <span class="art" data-art="trophy"></span>
      <h2 id="resultTitle">다 모았어요!</h2>
      <div class="result-body-grid">
        <div class="result-left-col">
          <div id="resultScore">0</div>
          <div class="stats">
            <div class="stat"><span class="art" data-art="card" style="width:28px;height:28px"></span><span id="resultCards"></span></div>
            <div class="stat"><span class="art" data-art="clock" style="width:28px;height:28px"></span><span id="resultTime"></span></div>
          </div>
          <form class="namebox" id="rankForm">
            <input id="rankName" maxlength="6" placeholder="내 이름" autocomplete="off" aria-label="순위표에 올릴 이름">
            <button type="submit" class="jelly sun" style="font-size:20px;min-height:50px;padding:10px 18px">🏅 순위 올리기</button>
          </form>
          <ol id="rankList"></ol>
        </div>
        <div class="result-right-col">
          <div class="result-right-header">
            <span>📚 오늘 함께 탐험한 낱말들</span>
            <small style="font-size:16px;color:var(--ink-soft)">소리 버튼을 누르면 발음을 들을 수 있어요</small>
          </div>
          <div id="reviewWordList"></div>
        </div>
      </div>
      <div class="btnrow" style="margin-top:6px">
        <button type="button" class="jelly leaf" onclick="startGame(G.mode)" style="min-height:58px;padding:12px 32px">↻ 한 번 더 탐험하기</button>
        <button type="button" class="jelly sea" onclick="toTitle()" style="min-height:58px;padding:12px 32px">⌂ 첫 화면으로</button>
      </div>
    </div>
  </div>
  <!-- 낱말 도감 -->
  <div id="bookModal" class="overlay dim hidden">
    <div class="panel book">
      <h2>📖 낱말 도감 <span id="bookTotal" style="font-size:24px;color:var(--ink-soft)"></span></h2>
      <div id="bookScroll"></div>
      <div class="btnrow"><button type="button" class="jelly sea" onclick="closeBook()">닫기</button></div>
    </div>
  </div>

  <div id="loadingScreen"><span class="art" data-art="compass"></span>섬을 만드는 중…</div>
</div>

  <script>
    /* ───── 그림: 직접 그린 SVG. assets/<이름>.png 를 넣으면 그 그림으로 바뀜 ───── */
    const ART = {
      star: `<svg viewBox="0 0 64 64"><path d="M32 5l8.3 17 18.7 2.7-13.5 13.2 3.2 18.6L32 47.7 15.3 56.5l3.2-18.6L5 24.7 23.7 22z" fill="#FFC531" stroke="#E0A100" stroke-width="4" stroke-linejoin="round"/><path d="M24 26l5-1" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"/></svg>`,
      bulb: `<svg viewBox="0 0 64 64"><path d="M32 6a19 19 0 0 0-11 34.5V47h22v-6.5A19 19 0 0 0 32 6z" fill="#FFF3B0" stroke="#8A5A00" stroke-width="4"/><rect x="22" y="47" width="20" height="9" rx="4" fill="#8A5A00"/><path d="M26 26a7 7 0 0 1 7-7" stroke="#8A5A00" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`,
      clock: `<svg viewBox="0 0 64 64"><circle cx="32" cy="34" r="24" fill="#fff" stroke="#3FA9F5" stroke-width="6"/><path d="M32 20v15l10 6" stroke="#3B3355" stroke-width="5" stroke-linecap="round" fill="none"/><rect x="26" y="3" width="12" height="8" rx="3" fill="#3FA9F5"/></svg>`,
      speaker: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h4l5 4v-13l-5 4z" fill="currentColor"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/></svg>`,
      mute: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h4l5 4v-13l-5 4z" fill="currentColor"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>`,
      compass: `<svg viewBox="0 0 120 120"><circle cx="60" cy="62" r="50" fill="#FF6F59" stroke="#D9483A" stroke-width="6"/><circle cx="60" cy="62" r="38" fill="#FFFBF2"/><path d="M60 30l10 32-10 32-10-32z" fill="#3FA9F5"/><path d="M60 30l10 32H50z" fill="#FF6F59"/><circle cx="60" cy="62" r="6" fill="#3B3355"/><circle cx="60" cy="10" r="8" fill="#FFC531" stroke="#E0A100" stroke-width="4"/></svg>`,

        [ 0.0,  0.0, 3.75],
        [ 1.9, -1.9, 2.75], [ 3.8, -3.8, 1.75], [ 5.7, -5.7, 0.75],
        [-1.9, -1.9, 2.75], [-3.8, -3.8, 1.75], [-5.7, -5.7, 0.75],
        [ 1.9,  1.9, 2.75], [ 3.8,  3.8, 1.75], [ 5.7,  5.7, 0.75],
        [-1.9,  1.9, 2.75], [-3.8,  3.8, 1.75], [-5.7,  5.7, 0.75]
      ];
      const cols = [
        { s1: 0xFACC15, s2: 0xFFD600, s3: 0x71717A },
        { s1: 0x7C3AED, s2: 0xC4B5FD, s3: 0x6B7280 }, { s1: 0x2563EB, s2: 0x93C5FD, s3: 0x52525B }, { s1: 0xEF4444, s2: 0xFCA5A5, s3: 0x3F3F46 },
        { s1: 0x7C3AED, s2: 0xC4B5FD, s3: 0x6B7280 }, { s1: 0x2563EB, s2: 0x93C5FD, s3: 0x52525B }, { s1: 0xEF4444, s2: 0xFCA5A5, s3: 0x3F3F46 },
        { s1: 0x7C3AED, s2: 0xC4B5FD, s3: 0x6B7280 }, { s1: 0x2563EB, s2: 0x93C5FD, s3: 0x52525B }, { s1: 0xEF4444, s2: 0xFCA5A5, s3: 0x3F3F46 },
        { s1: 0x7C3AED, s2: 0xC4B5FD, s3: 0x6B7280 }, { s1: 0x2563EB, s2: 0x93C5FD, s3: 0x52525B }, { s1: 0xEF4444, s2: 0xFCA5A5, s3: 0x3F3F46 }
      ];
      steps.forEach(([dx, dz, top], i) => addPlatform(K.x + dx, K.z + dz, i === 0 ? 2.8 : 2.2, top, cols[i]));
      }

      // 꽃과 구름
      const flowerCols = [
        { s1: 0xEC4899, s2: 0xF9A8D4, s3: 0x6B7280 },
        { s1: 0xFFFFFF, s2: 0xFFFBEB, s3: 0xE2E8F0 },
        { s1: 0xFACC15, s2: 0xFEF08A, s3: 0x9CA3AF },
        { s1: 0xEF4444, s2: 0xFCA5A5, s3: 0x4B5563 }
      ];
      for (let i = 0; i < 140; i++) {
        const a = Math.random() * Math.PI * 2, r = Math.random() * (ISLAND_R - 2);
        const f = new THREE.Mesh(new THREE.SphereGeometry(.13, 6, 6), stdPalette(flowerCols[i % 4].s1, flowerCols[i % 4].s2, flowerCols[i % 4].s3));
        f.position.set(Math.cos(a) * r, .12, Math.sin(a) * r); scene.add(f);
      }
      // 몽실몽실 입체 뭉게구름 군락 생성 (24개 레이어)
      const cloudPuffs = [
        [0, 0, 0, 2.4], [-1.8, -0.2, 0.4, 1.8], [1.8, -0.1, -0.3, 1.9],
        [-0.6, 0.9, 0.3, 1.7], [0.8, 1.0, -0.2, 1.6], [-2.6, -0.5, 0.1, 1.2],
        [2.7, -0.4, 0.2, 1.3], [0, -0.4, 1.1, 1.5], [0, -0.4, -1.1, 1.5]
      ];
      cloudMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.95, metalness: 0.0 });

      for (let i = 0; i < 24; i++) {
        const cl = new THREE.Group();
        const tier = i % 3; // 0: 근거리(낮음), 1: 중거리, 2: 원거리(높음)
        const scale = tier === 0 ? 0.9 + Math.random() * 0.4 : tier === 1 ? 1.4 + Math.random() * 0.5 : 2.2 + Math.random() * 0.8;
        const rad = tier === 0 ? 50 + (i % 6) * 4 : tier === 1 ? 78 + (i % 6) * 6 : 115 + (i % 6) * 9;
        const h = tier === 0 ? 14 + (i % 4) * 3 : tier === 1 ? 23 + (i % 5) * 4 : 36 + (i % 4) * 5;
        const a = (i / 24) * Math.PI * 2 + (Math.random() - 0.5) * 0.25;

        cloudPuffs.forEach(([px, py, pz, pr]) => {
          const s = new THREE.Mesh(new THREE.SphereGeometry(pr * scale, 10, 8), cloudMat);
          s.position.set(px * scale, py * scale, pz * scale);
          cl.add(s);
        });

        cl.position.set(Math.cos(a) * rad, h, Math.sin(a) * rad);
        cl.userData = { a, r: rad, speed: (0.005 + Math.random() * 0.007) * (tier === 0 ? 1.2 : 0.8) };
        scene.add(cl);
        clouds.push(cl);
      }

      // 먼 바다 수평선을 감싸는 부드러운 산호초/언덕 실루엣
      for (let i = 0; i < 12; i++) {
        const ma = (i / 12) * Math.PI * 2 + 0.15;
        const mrad = 145 + (i % 3) * 12;
        const mH = 10 + (i % 4) * 5;
        const mW = 32 + (i % 3) * 10;
        const mGeo = new THREE.SphereGeometry(mW, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.5);
        mGeo.scale(1, mH / mW, 1);
        const s1Hill = i % 2 === 0 ? 0x60A5FA : 0x4ADE80;
        const s2Hill = i % 2 === 0 ? 0xFDBA74 : 0xFB923C;
        const s3Hill = i % 2 === 0 ? 0x0B1224 : 0x111E38;
        const mMat = stdPalette(s1Hill, s2Hill, s3Hill, { roughness: 0.95 });
        const m = new THREE.Mesh(mGeo, mMat);

        m.position.set(Math.cos(ma) * mrad, -1, Math.sin(ma) * mrad);
        scene.add(m);
      }

      // 나비: 섬 위를 맴돌며 팔랑임
      const wingCols = [
        { s1: 0xEC4899, s2: 0xF9A8D4, s3: 0x94A3B8 },
        { s1: 0xFACC15, s2: 0xFEF08A, s3: 0xE2E8F0 },
        { s1: 0x7C3AED, s2: 0xC4B5FD, s3: 0x64748B },
        { s1: 0xFFFFFF, s2: 0xFFFBEB, s3: 0xCBD5E1 },
        { s1: 0x2563EB, s2: 0x93C5FD, s3: 0x475569 },
        { s1: 0xEF4444, s2: 0xFCA5A5, s3: 0x9CA3AF }
      ];
      for (let i = 0; i < 10; i++) {
        const b = new THREE.Group();
        const wm = basicPalette(wingCols[i % 6].s1, wingCols[i % 6].s2, wingCols[i % 6].s3, { side: THREE.DoubleSide });
        const wg = new THREE.CircleGeometry(.16, 10);
        const l = new THREE.Mesh(wg, wm), r = new THREE.Mesh(wg, wm);
        l.position.x = -.13; r.position.x = .13; b.add(l); b.add(r);
        b.userData = { l, r, cx: (Math.random() - .5) * 60, cz: (Math.random() - .5) * 60, rad: 2 + Math.random() * 4, sp: .5 + Math.random() * .6, ph: Math.random() * 6 };
        scene.add(b); critters.push(b);
      }
    }

    // 매 프레임: 바다 물결, 거품, 나무 흔들림, 나비, 구름
    function updateWorld(t, dt) {
      if (seaGeo) {
        const p = seaGeo.attributes.position, base = seaGeo.userData.base;
        for (let i = 0; i < p.count; i++) {
          const x = base[i * 3], z = base[i * 3 + 2];
          p.array[i * 3 + 1] = Math.sin(x * .12 + t * 1.3) * .14 + Math.cos(z * .1 + t * 1.1) * .12;
        }
        p.needsUpdate = true;
      }
      if (foam) { foam.material.opacity = .4 + Math.sin(t * 1.6) * .18; const s = 1 + Math.sin(t * 1.6) * .012; foam.scale.set(s, s, s); }
      if (villageLakeMesh) { villageLakeMesh.position.y = 0.04 + Math.sin(t * 2.2) * 0.008; }
      trees.forEach((tr, i) => { tr.rotation.z = Math.sin(t * 1.3 + i) * .025; tr.rotation.x = Math.cos(t * 1.1 + i * .7) * .02; });
      critters.forEach(b => {
        const u = b.userData, a = t * u.sp + u.ph;
        b.position.set(u.cx + Math.cos(a) * u.rad, 1 + Math.sin(a * 2.3) * .4, u.cz + Math.sin(a) * u.rad);
        b.rotation.y = -a;
        const f = Math.sin(t * 22 + u.ph) * .9;
        u.l.rotation.y = f; u.r.rotation.y = -f;
      });
      clouds.forEach(cl => { cl.userData.a += dt * (cl.userData.speed || 0.008); cl.position.x = Math.cos(cl.userData.a) * cl.userData.r; cl.position.z = Math.sin(cl.userData.a) * cl.userData.r; });
      if (sun3DGroup && sun3DGroup.visible) {
        if (sun3DGroup.userData.rayGroup) sun3DGroup.userData.rayGroup.rotation.z += dt * 0.35;
        if (sun3DGroup.userData.corona) {
          sun3DGroup.userData.corona.quaternion.copy(camera.quaternion);
          const s = 1.0 + Math.sin(t * 2.8) * 0.06;
          sun3DGroup.userData.corona.scale.set(s, s, 1);
        }
      }
      if (stage3CarouselRotor && stage3Group && stage3Group.visible) {
        stage3CarouselRotor.rotation.y += dt * 0.45;
      }
      if (schoolFlagMesh && stage2Group && stage2Group.visible) {
        schoolFlagMesh.rotation.y = Math.sin(t * 2.6) * 0.15;
      }
      duckBoats.forEach((db, idx) => {
        if (stage3Group && stage3Group.visible) {
          db.position.y = 0.08 + Math.sin(t * 2.2 + idx * 1.6) * 0.035;
          db.rotation.z = Math.sin(t * 1.8 + idx * 1.4) * 0.03;
        }
      });
      if (stage1Group && stage1Group.visible) {
        stage1Animators.forEach(fn => fn(dt, t));
      }
      if (stage2Group && stage2Group.visible) {
        stage2Animators.forEach(fn => fn(dt, t));
        stage2CompanionAnimators.forEach(fn => fn(dt, t));
      }
      if (stage3Group && stage3Group.visible) {
        stage3Animators.forEach(fn => fn(dt, t));
        stage3CompanionAnimators.forEach(fn => fn(dt, t));
      }
      if (moonGroup && moonGroup.visible) {
        moonGroup.position.y = 115 + Math.sin(t * 0.4) * 1.5;
        const halo = moonGroup.children.find(c => c.userData && c.userData.isHalo);
        if (halo) {
          halo.quaternion.copy(camera.quaternion);
          halo.material.opacity = 0.28 + Math.sin(t * 1.5) * 0.08;
        }
      }
      if (starsGroup && starsGroup.visible) {
        starsGroup.material.opacity = 0.8 + Math.sin(t * 2.0) * 0.15;
      }
    }

    // 카메라와 캐릭터 사이를 가리는 나무·집은 반투명하게
    const ray = new THREE.Raycaster();
    function updateOcclusion() {
      fadeables.forEach(f => f.userData.want = 1);
      const head = new THREE.Vector3(P.pos.x, P.pos.y + 1, P.pos.z);
      const dir = head.clone().sub(camera.position), dist = dir.length();
      ray.set(camera.position, dir.normalize()); ray.far = dist - .6;
      const hits = ray.intersectObjects(fadeables.filter(f => f.visible && (!f.parent || f.parent.visible !== false)).map(f => f.userData.meshes).flat(), false);
      hits.forEach(h => { h.object.userData.owner.userData.want = .25; });
      // 캐릭터 바로 옆 나무도 살짝 비침
      fadeables.forEach(f => {
        const o = f.userData;
        o.cur = (o.cur ?? 1) + (o.want - (o.cur ?? 1)) * .25;
        o.meshes.forEach(m => { m.material.transparent = o.cur < .99; m.material.opacity = o.cur; m.material.depthWrite = o.cur > .9; });
      });
    }
    function makeFadeable(group) {
      const meshes = [];
      group.traverse(o => { if (o.isMesh) { meshes.push(o); o.userData.owner = group; } });
      group.userData.meshes = meshes;
      fadeables.push(group);
    }

    function addTree(x, z, s, pine) {
      const t = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.16 * s, .26 * s, 1.3 * s, 8), stdPalette(0x8D5B28, 0xC4A482, 0x8D5B28)); trunk.position.y = .65 * s; trunk.castShadow = true; t.add(trunk);
      if (pine) {
        const col = [{ s1: 0x15803D, s2: 0x6EE7B7, s3: 0x22C55E }, { s1: 0x16A34A, s2: 0xA7F3D0, s3: 0x4ADE80 }][Math.floor(Math.random() * 2)];
        [[1.15, 1.2, 1.5], [.9, 1.0, 2.2], [.6, .8, 2.85]].forEach(([r, h, y]) => {
          const c = new THREE.Mesh(new THREE.ConeGeometry(r * s, h * s, 9), stdPalette(col.s1, col.s2, col.s3, { flatShading: true })); c.position.y = y * s; c.castShadow = true; t.add(c);
        });
      } else {
        const leafCol = [
          { s1: 0x22C55E, s2: 0x86EFAC, s3: 0x4ADE80 },
          { s1: 0x4ADE80, s2: 0xBBF7D0, s3: 0x86EFAC },
          { s1: 0x16A34A, s2: 0x6EE7B7, s3: 0x34D399 },
          { s1: 0x65A30D, s2: 0xBEF264, s3: 0xA3E635 }
        ][Math.floor(Math.random() * 4)];
        const lm = stdPalette(leafCol.s1, leafCol.s2, leafCol.s3, { flatShading: true });
        [[0, 1.9, 0, 1], [.5, 2.3, .2, .7], [-.45, 2.2, -.15, .72], [.05, 2.75, -.05, .6]].forEach(([dx, dy, dz, r]) => {
          const b = new THREE.Mesh(new THREE.IcosahedronGeometry(r * s, 1), lm); b.position.set(dx * s, dy * s, dz * s); b.castShadow = true; t.add(b);
        });
        if (Math.random() < .35) { // 빨간 열매
          for (let k = 0; k < 4; k++) { const f = new THREE.Mesh(new THREE.SphereGeometry(.09 * s, 6, 6), stdPalette(0xEF4444, 0xFCA5A5, 0xEF4444)); const a = k * 1.6; f.position.set(Math.cos(a) * .85 * s, 1.85 * s + (k % 2) * .4, Math.sin(a) * .85 * s); t.add(f); }
        }
      }
      t.position.set(x, 0, z); t.rotation.y = Math.random() * 6; scene.add(t);
      trees.push(t); makeFadeable(t);
      commonColliders.push({ x, z, r: .45 * s });
    }
    function makeFlagTexture() {
      const c = document.createElement("canvas");
      c.width = 256; c.height = 160;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, 256, 160);
      const cx = 128, cy = 80, r = 38;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-Math.atan2(2, 3));
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI, false);
      ctx.arc(r / 2, 0, r / 2, 0, Math.PI, false);
      ctx.arc(-r / 2, 0, r / 2, Math.PI, 0, false);
      ctx.fillStyle = "#CD2E3A";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, 0, r, Math.PI, 0, false);
      ctx.arc(r / 2, 0, r / 2, 0, Math.PI, true);
      ctx.arc(-r / 2, 0, r / 2, Math.PI, 0, true);
      ctx.fillStyle = "#0047A0";
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = "#000000";
      const drawTrigram = (x, y, ang, bars) => {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(ang);
        bars.forEach((broken, i) => {
          const by = (i - 1) * 8;
          if (broken) {
            ctx.fillRect(-18, by - 2.5, 14, 5);
            ctx.fillRect(4, by - 2.5, 14, 5);
          } else {
            ctx.fillRect(-18, by - 2.5, 36, 5);
          }
        });
        ctx.restore();
      };
      drawTrigram(50, 40, Math.atan2(2, 3), [false, false, false]);
      drawTrigram(206, 120, Math.atan2(2, 3), [true, true, true]);
      drawTrigram(206, 40, -Math.atan2(2, 3), [true, false, true]);
      drawTrigram(50, 120, -Math.atan2(2, 3), [false, true, false]);
      return setSRGB(new THREE.CanvasTexture(c));
    }

    /* ───────────── 필드 이동 NPC 시스템 (랜덤 동선 순회, 필드 밖 퇴장 & 리스폰) ───────────── */
    function setupRoamingWalker(stageGroup, stageAnimators, cfg) {
      const mesh = cfg.mesh;
      const speed = cfg.speed || 3.0;
      const baseScale = cfg.scale || 1.0;
      if (baseScale !== 1.0) mesh.scale.set(baseScale, baseScale, baseScale);
      stageGroup.add(mesh);

      let waypoints = [];
      let wpIdx = 0;
      let walkPhase = Math.random() * 20;

      function pickInteriorWaypoint() {
        for (let iter = 0; iter < 30; iter++) {
          const a = Math.random() * Math.PI * 2;
          const r = 10 + Math.random() * 40;
          const x = Math.cos(a) * r;
          const z = Math.sin(a) * r;
          // 호수 중심 회피 (ZONES.village)
          if (Math.hypot(x - ZONES.village.x, z - ZONES.village.z) < 11.5) continue;
          // 광장 분수 회피 (ZONES.plaza)
          if (Math.hypot(x - ZONES.plaza.x, z - ZONES.plaza.z) < 5.5) continue;
          // 과학 숲 회피 (ZONES.forest)
          if (Math.hypot(x - ZONES.forest.x, z - ZONES.forest.z) < 11) continue;
          return new THREE.Vector2(x, z);
        }
        return new THREE.Vector2(0, 0);
      }

      function generateRoute(initialSpawn = false) {
        if (cfg.loopInterior) {
          const curPos = initialSpawn ? pickInteriorWaypoint() : new THREE.Vector2(mesh.position.x, mesh.position.z);
          const wp1 = pickInteriorWaypoint();
          const wp2 = pickInteriorWaypoint();
          const wp3 = pickInteriorWaypoint();
          const wp4 = pickInteriorWaypoint();
          waypoints = [curPos, wp1, wp2, wp3, wp4];
          mesh.position.x = curPos.x;
          mesh.position.z = curPos.y;
          wpIdx = 1;
          const dx = wp1.x - curPos.x, dz = wp1.y - curPos.y;
          mesh.rotation.y = Math.atan2(dx, dz);
          mesh.position.y = cfg.baseY || 0;
          return;
        }

        const enterAngle = Math.random() * Math.PI * 2;
        const enterR = 64 + Math.random() * 3;
        const startPt = new THREE.Vector2(Math.cos(enterAngle) * enterR, Math.sin(enterAngle) * enterR);

        const wp1 = pickInteriorWaypoint();
        const wp2 = pickInteriorWaypoint();
        const wp3 = pickInteriorWaypoint();

        // 반대편 또는 다른 각도로 섬 외곽 퇴장
        const exitAngle = enterAngle + Math.PI + (Math.random() - 0.5) * 1.6;
        const exitR = 67 + Math.random() * 3;
        const exitPt = new THREE.Vector2(Math.cos(exitAngle) * exitR, Math.sin(exitAngle) * exitR);

        waypoints = [startPt, wp1, wp2, wp3, exitPt];

        if (initialSpawn) {
          // 스테이지 시작 시 필드 곳곳에 배치되어 즉시 생동감을 주도록 분산 배치
          const seg = Math.floor(Math.random() * (waypoints.length - 1));
          const frac = Math.random();
          const pA = waypoints[seg], pB = waypoints[seg + 1];
          mesh.position.x = pA.x + (pB.x - pA.x) * frac;
          mesh.position.z = pA.y + (pB.y - pA.y) * frac;
          wpIdx = seg + 1;
          const dx = pB.x - pA.x, dz = pB.y - pA.y;
          mesh.rotation.y = Math.atan2(dx, dz);
        } else {
          mesh.position.x = startPt.x;
          mesh.position.z = startPt.y;
          wpIdx = 1;
          const dx = wp1.x - startPt.x, dz = wp1.y - startPt.y;
          mesh.rotation.y = Math.atan2(dx, dz);
        }
        mesh.position.y = cfg.baseY || 0;
      }

      generateRoute(true);

      const walkerObj = {
        mesh,
        speed,
        get phase() { return walkPhase; }
      };

      let huntCooldown = 2.5 + Math.random() * 3.5;
      let targetCard = null;

      stageAnimators.push((dt, t) => {
        walkPhase += dt * (speed * 1.8);

        // 동료 캐릭터의 문제 카드 탐색 및 획득 AI (스테이지 2, 3 활성 시)
        let isHunting = false;
        let targetX = 0, targetZ = 0;

        if (cfg.cardHunter && G.playing && !G.paused && (G.stage === 2 || G.stage === 3)) {
          huntCooldown -= dt;
          if (targetCard && (targetCard.done || G.activeCard === targetCard || !targetCard.mesh || targetCard.mesh.visible === false)) {
            targetCard = null;
          }
          if (!targetCard && huntCooldown <= 0) {
            const availableCards = G.cards.filter(c => !c.done && c !== G.activeCard && c.mesh && c.mesh.visible !== false);
            if (availableCards.length > 0) {
              let bestC = null, bestD = 1e9;
              availableCards.forEach(c => {
                const cd = Math.hypot(c.mesh.position.x - mesh.position.x, c.mesh.position.z - mesh.position.z);
                if (cd < bestD) { bestD = cd; bestC = c; }
              });
              if (bestC) targetCard = bestC;
            }
          }
          if (targetCard && targetCard.mesh) {
            isHunting = true;
            targetX = targetCard.mesh.position.x;
            targetZ = targetCard.mesh.position.z;
            const cardDist = Math.hypot(targetX - mesh.position.x, targetZ - mesh.position.z);
            if (cardDist < 1.6) {
              const cToPick = targetCard;
              targetCard = null;
              huntCooldown = 8.0 + Math.random() * 6.0; // 카드 획득 후 잠시 다른 곳 순회 후 다음 카드 탐색
              companionCollectCard(cfg.role, mesh, cToPick);
            }
          }
        }

        if (!isHunting) {
          if (wpIdx >= waypoints.length) {
            generateRoute(false);
            return;
          }
          targetX = waypoints[wpIdx].x;
          targetZ = waypoints[wpIdx].y;
        }

        const dx = targetX - mesh.position.x;
        const dz = targetZ - mesh.position.z;
        const dist = Math.hypot(dx, dz);

        if (!isHunting && dist < 1.2) {
          wpIdx++;
          if (wpIdx >= waypoints.length) {
            generateRoute(false);
            return;
          }
        } else if (dist > 0.05) {
          const step = Math.min(dist, speed * dt);
          mesh.position.x += (dx / dist) * step;
          mesh.position.z += (dz / dist) * step;

          const targetAngle = Math.atan2(dx, dz);
          let diff = targetAngle - mesh.rotation.y;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          mesh.rotation.y += diff * Math.min(1.0, dt * 6.0);
        }

        const curR = Math.hypot(mesh.position.x, mesh.position.z);
        if (curR > 68 && wpIdx >= 3) {
          generateRoute(false);
          return;
        }

        if (cfg.animFn) {
          cfg.animFn(dt, t, walkerObj);
        }
      });

      return walkerObj;
    }

    // ──────── 귀여운 치비 마스코트 캐릭터 공통 빌더 (부드러운 곡선, 영웅 캐릭터와 동일한 비율, 다리 없는 앙증맞은 발) ────────
    function buildChibiHuman(opts = {}) {
      const g = new THREE.Group();
      const scale = opts.scale || 1.05;
      g.scale.set(scale, scale, scale);

      const rig = new THREE.Group();
      g.add(rig);

      const skinMat = std(opts.skinColor || 0xFFDFC4, { roughness: 0.98, metalness: 0.0 });
      const clothesMat = std(opts.clothesColor || 0x2563EB, { roughness: 0.6 });
      const shoeMat = std(opts.shoeColor || 0x18181B, { roughness: 0.7 });

      // 1. 통통하고 부드러운 유선형 몸통 (직사각형 각진 절단면 없이 상하단이 둥근 곡면)
      const bodyG = new THREE.Group();
      rig.add(bodyG);

      const torsoMat = opts.torsoMat || clothesMat;
      const bottomMat = opts.bottomMat || torsoMat;

      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.31, 0.44, 20), torsoMat);
      torso.position.y = 0.38;
      torso.castShadow = true;
      bodyG.add(torso);

      const bottomCap = new THREE.Mesh(new THREE.SphereGeometry(0.31, 20, 12), bottomMat);
      bottomCap.scale.set(1, 0.65, 1);
      bottomCap.position.y = 0.20;
      bottomCap.castShadow = true;
      bodyG.add(bottomCap);

      const shoulderCap = new THREE.Mesh(new THREE.SphereGeometry(0.24, 20, 10), torsoMat);
      shoulderCap.scale.set(1, 0.45, 1);
      shoulderCap.position.y = 0.58;
      bodyG.add(shoulderCap);

      // 2. 머리 (플레이어 조작 캐릭터와 동일한 대두 마스코트 비율 0.39 구체)
      const headG = new THREE.Group();
      headG.position.y = 0.88;
      rig.add(headG);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.39, 28, 22), skinMat);
      head.castShadow = true;
      headG.add(head);

      // 반짝이는 눈동자 & 살구빛 홍조 볼
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111827 });
      const shineMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
      const cheekMat = std(0xFCA5A5, { roughness: 0.98, metalness: 0.0 });

      [-0.13, 0.13].forEach(ex => {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 10), eyeMat);
        eye.scale.set(1, 1.25, 0.6);
        eye.position.set(ex, 0.02, 0.36);
        headG.add(eye);

        const shine = new THREE.Mesh(new THREE.SphereGeometry(0.016, 6, 6), shineMat);
        shine.position.set(ex + 0.014, 0.045, 0.38);
        headG.add(shine);

        const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.065, 10, 8), cheekMat);
        cheek.scale.set(1.2, 0.55, 0.4);
        cheek.position.set(ex * 1.35, -0.09, 0.34);
        headG.add(cheek);
      });

      // 앙증맞은 코 (부드러운 매트 재질)
      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.026, 8, 8), std(0xF9A8D4, { roughness: 0.95, metalness: 0.0 }));
      nose.position.set(0, -0.03, 0.39);
      headG.add(nose);

      // 3. 다리 없이 몸통 바로 아래 부착된 둥근 발 (플레이어 영웅과 완벽 일치)
      const feet = [-1, 1].map(s => {
        const f = new THREE.Mesh(new THREE.SphereGeometry(0.095, 12, 10), shoeMat);
        f.position.set(0.13 * s, 0.07, 0.03);
        f.scale.set(1, 0.65, 1.3);
        f.castShadow = true;
        rig.add(f);
        return f;
      });

      // 4. 귀여운 팔
      const sleeveMat = opts.sleeveMat || torsoMat;
      const arms = [-1, 1].map(s => {
        const pivot = new THREE.Group();
        pivot.position.set(0.28 * s, 0.52, 0);
        const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.068, 0.26, 12), sleeveMat);
        sleeve.position.y = -0.13;
        sleeve.castShadow = true;
        pivot.add(sleeve);

        const hand = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), skinMat);
        hand.position.y = -0.28;
        pivot.add(hand);

        pivot.rotation.z = 0.22 * s;
        rig.add(pivot);
        return pivot;
      });

      const parts = { g, rig, bodyG, torso, bottomCap, headG, head, feet, arms, skinMat, clothesMat, shoeMat, torsoMat, bottomMat, sleeveMat };
      if (opts.buildHair) opts.buildHair(headG, parts);
      if (opts.buildFace) opts.buildFace(headG, parts);
      if (opts.buildOutfit) opts.buildOutfit(bodyG, rig, parts);
      if (opts.buildProps) opts.buildProps(arms[0], arms[1], bodyG, parts);

      return {
        mesh: g,
        anim(dt, t, walker) {
          const ph = walker.phase;
          // 마스코트 오뚝이 뒤뚱거림 & 통통 바운스
          rig.rotation.z = Math.sin(ph) * 0.08;
          rig.position.y = Math.abs(Math.sin(ph)) * 0.06;

          // 발 디딤 & 들어올림
          feet[0].position.z = 0.03 + Math.sin(ph) * 0.12;
          feet[0].position.y = 0.07 + Math.max(0, -Math.sin(ph)) * 0.05;
          feet[1].position.z = 0.03 - Math.sin(ph) * 0.12;
          feet[1].position.y = 0.07 + Math.max(0, Math.sin(ph)) * 0.05;

          // 양팔 스윙
          arms[0].rotation.x = -Math.sin(ph) * 0.45;
          arms[1].rotation.x = Math.sin(ph) * 0.45;

          if (opts.customAnim) {
            opts.customAnim(dt, t, walker, parts);
          }
        }
      };
    }

    // (1) 출근하는 남/여 회사원 (네이비/라벤더 정장, 둥근 서류가방 / 볼링 핸드백)
    function createOfficeWorker(isFemale) {
      const skinColor = isFemale ? 0xFFE4D6 : 0xFFDFC4;
      const suitColor = isFemale ? 0xF3E8FF : 0x1E3A8A;
      const bottomColor = isFemale ? 0x1E293B : 0x1E3A8A;
      const shoeColor = isFemale ? 0x881337 : 0x0F172A;

      return buildChibiHuman({
        scale: 1.05,
        skinColor,
        clothesColor: suitColor,
        shoeColor,
        torsoMat: std(suitColor, { roughness: 0.55 }),
        bottomMat: std(bottomColor, { roughness: 0.55 }),
        sleeveMat: std(suitColor, { roughness: 0.55 }),
        buildOutfit(bodyG, rig, parts) {
          if (!isFemale) {
            // 남 회사원: 부드러운 셔츠 깃과 실크 넥타이
            const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 0.12, 12), std(0xFFFFFF));
            collar.position.set(0, 0.60, 0.05);
            bodyG.add(collar);

            const tieKnot = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), std(0xDC2626));
            tieKnot.position.set(0, 0.56, 0.28);
            bodyG.add(tieKnot);

            const tieBody = new THREE.Mesh(new THREE.ConeGeometry(0.048, 0.26, 8), std(0xDC2626));
            tieBody.scale.set(1, 1, 0.35);
            tieBody.position.set(0, 0.42, 0.29);
            bodyG.add(tieBody);
          } else {
            // 여 회사원: 부드럽게 감싸는 플리츠 스커트와 골드 펜던트 목걸이
            const skirt = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.35, 0.24, 18), std(0x1E293B));
            skirt.position.y = 0.24;
            skirt.castShadow = true;
            bodyG.add(skirt);

            const necklace = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.016, 8, 18), std(0xFACC15, { metalness: 0.8 }));
            necklace.rotation.x = Math.PI / 2.2;
            necklace.position.set(0, 0.60, 0.06);
            bodyG.add(necklace);
          }
        },
        buildHair(headG, parts) {
          if (!isFemale) {
            // 단정한 블랙 포마드 헤어
            const hairBase = new THREE.Mesh(new THREE.SphereGeometry(0.405, 20, 16), std(0x1F2937, { roughness: 0.8 }));
            hairBase.position.set(0, 0.03, -0.02);
            headG.add(hairBase);

            const bangs = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 10), std(0x1F2937, { roughness: 0.8 }));
            bangs.scale.set(1.5, 0.5, 0.6);
            bangs.position.set(0.04, 0.24, 0.28);
            bangs.rotation.z = -0.15;
            headG.add(bangs);
          } else {
            // 부드러운 밤색 단발 펌 & 둥근 컬
            const hairBase = new THREE.Mesh(new THREE.SphereGeometry(0.405, 20, 16), std(0x3E2723, { roughness: 0.8 }));
            hairBase.position.set(0, 0.02, -0.02);
            headG.add(hairBase);

            [-0.24, 0.24].forEach(hx => {
              const curl = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 10), std(0x3E2723, { roughness: 0.8 }));
              curl.scale.set(0.7, 1.4, 0.7);
              curl.position.set(hx, -0.08, 0.05);
              headG.add(curl);
            });
          }
        },
        buildProps(armL, armR, bodyG, parts) {
          if (!isFemale) {
            // 둥근 모서리의 고급 브리프케이스 (가죽 캡슐 형태 + 골드 원형 버클 + 아치형 손잡이)
            const bcG = new THREE.Group();
            bcG.position.set(0.02, -0.36, 0);

            const bcBody = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.26, 16), std(0x3E2723, { roughness: 0.5 }));
            bcBody.rotation.z = Math.PI / 2;
            bcG.add(bcBody);

            [-0.13, 0.13].forEach(cx => {
              const cap = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10), std(0x3E2723, { roughness: 0.5 }));
              cap.position.x = cx;
              bcG.add(cap);
            });

            const bcHandle = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.012, 6, 12, Math.PI), std(0x1F2937));
            bcHandle.rotation.x = Math.PI;
            bcHandle.position.y = 0.10;
            bcG.add(bcHandle);

            const bcLock = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 8), std(0xFACC15, { metalness: 0.8 }));
            bcLock.position.set(0, 0, 0.09);
            bcG.add(bcLock);

            armR.add(bcG);
          } else {
            // 여성용 둥근 볼링백 / 핸드백 (와인 레드 유선형 백 + 골드 아치 링)
            const hbG = new THREE.Group();
            hbG.position.set(0.04, -0.34, 0.02);

            const hbBody = new THREE.Mesh(new THREE.SphereGeometry(0.12, 14, 12), std(0x9F1239, { roughness: 0.5 }));
            hbBody.scale.set(0.8, 0.95, 1.25);
            hbG.add(hbBody);

            const hbStrap = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.012, 6, 14, Math.PI), std(0xFACC15, { metalness: 0.8 }));
            hbStrap.rotation.x = Math.PI;
            hbStrap.position.set(0, 0.10, 0);
            hbG.add(hbStrap);

            armR.add(hbG);
          }
        }
      });
    }

    // (2) 등교하는 남/여 고등학생 (단정한 교복 블레이저, 곡선형 백팩, 둥근 리본/타이)
    function createHighSchoolStudent(isGirl) {
      const blazerColor = 0x0F172A;
      const bottomColor = isGirl ? 0x1E293B : 0x334155;
      const shoeColor = 0x1F2937;

      return buildChibiHuman({
        scale: 1.45,
        skinColor: 0xFFDFC4,
        clothesColor: blazerColor,
        shoeColor,
        torsoMat: std(blazerColor, { roughness: 0.6 }),
        bottomMat: std(bottomColor, { roughness: 0.6 }),
        sleeveMat: std(blazerColor, { roughness: 0.6 }),
        buildOutfit(bodyG, rig, parts) {
          // 화이트 셔츠 깃
          const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 0.12, 12), std(0xFFFFFF));
          collar.position.set(0, 0.60, 0.05);
          bodyG.add(collar);

          if (!isGirl) {
            // 남학생: 파란색 넥타이
            const tieKnot = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), std(0x2563EB));
            tieKnot.position.set(0, 0.56, 0.28);
            bodyG.add(tieKnot);

            const tieBody = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.24, 8), std(0x2563EB));
            tieBody.scale.set(1, 1, 0.35);
            tieBody.position.set(0, 0.43, 0.29);
            bodyG.add(tieBody);
          } else {
            // 여학생: 둥근 빨간 리본 & 교복 치마
            const ribCenter = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), std(0xEF4444));
            ribCenter.position.set(0, 0.55, 0.28);
            bodyG.add(ribCenter);

            [-0.05, 0.05].forEach(rx => {
              const wing = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), std(0xEF4444));
              wing.scale.set(1.4, 0.8, 0.5);
              wing.position.set(rx, 0.55, 0.27);
              wing.rotation.z = rx > 0 ? -0.3 : 0.3;
              bodyG.add(wing);
            });

            const skirt = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.35, 0.24, 18), std(0x1E293B));
            skirt.position.y = 0.24;
            skirt.castShadow = true;
            bodyG.add(skirt);
          }

          // 등 뒤에 멘 둥근 캡슐 학생 백팩
          const bpColor = isGirl ? 0xEC4899 : 0x1E293B;
          const bpG = new THREE.Group();
          bpG.position.set(0, 0.40, -0.26);

          const bpBody = new THREE.Mesh(new THREE.SphereGeometry(0.20, 14, 12), std(bpColor, { roughness: 0.6 }));
          bpBody.scale.set(1.1, 1.35, 0.75);
          bpBody.castShadow = true;
          bpG.add(bpBody);

          const bpPocket = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 8), std(bpColor, { roughness: 0.6 }));
          bpPocket.scale.set(1.0, 0.8, 0.5);
          bpPocket.position.set(0, -0.06, -0.10);
          bpG.add(bpPocket);

          bodyG.add(bpG);
        },
        buildHair(headG, parts) {
          if (!isGirl) {
            // 둥근 숏컷 블랙 헤어
            const hairBase = new THREE.Mesh(new THREE.SphereGeometry(0.405, 20, 16), std(0x111827, { roughness: 0.8 }));
            hairBase.position.set(0, 0.02, -0.02);

            const bangs = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 10), std(0x111827, { roughness: 0.8 }));
            bangs.scale.set(1.4, 0.5, 0.6);
            bangs.position.set(0, 0.23, 0.28);
            headG.add(bangs);
          } else {
            // 귀여운 트윈테일 헤어와 머리방울
            const hairBase = new THREE.Mesh(new THREE.SphereGeometry(0.405, 20, 16), std(0x451A03, { roughness: 0.8 }));
            hairBase.position.set(0, 0.02, -0.02);
            headG.add(hairBase);

            [-0.26, 0.26].forEach(hx => {
              const tie = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), std(0x3B82F6));
              tie.position.set(hx, 0.08, -0.06);
              headG.add(tie);

              const pigtail = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 8), std(0x451A03, { roughness: 0.8 }));
              pigtail.scale.set(0.65, 1.6, 0.65);
              pigtail.position.set(hx * 1.05, -0.06, -0.08);
              pigtail.rotation.z = hx > 0 ? -0.2 : 0.2;
              headG.add(pigtail);
            });
          }
        }
      });
    }

    // (3) 총총 달리는 동글동글 찹쌀떡 햄스터 (모든 부위가 부드러운 구체/곡선)
    function createHamster(furHex = 0xD99B61) {
      const g = new THREE.Group();
      g.scale.set(1.0, 1.0, 1.0); // 영웅 스케일과 완벽 호환 (0.7배 조절)

      const furMat = std(furHex, { roughness: 0.65 });
      const bellyMat = std(0xFFFBEB, { roughness: 0.65 });
      const pinkMat = std(0xFBCFE8, { roughness: 0.6 });

      const rig = new THREE.Group();
      g.add(rig);

      // 둥글고 통통한 찹쌀떡 몸통
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.40, 24, 20), furMat);
      body.scale.set(1.08, 0.88, 1.25);
      body.position.y = 0.32;
      body.castShadow = true;
      rig.add(body);

      // 포근한 크림색 배
      const belly = new THREE.Mesh(new THREE.SphereGeometry(0.30, 16, 14), bellyMat);

      rig.add(belly);

      // 머리와 빵빵한 볼살
      const headG = new THREE.Group();
      headG.position.set(0, 0.40, 0.32);
      rig.add(headG);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 20, 16), furMat);
      head.castShadow = true;
      headG.add(head);

      const cheekBlush = std(0xFCA5A5, { roughness: 0.8 });
      [-0.16, 0.16].forEach(cx => {
        const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 10), furMat);
        cheek.position.set(cx, -0.06, 0.12);
        headG.add(cheek);

        const blush = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), cheekBlush);
        blush.scale.set(1.2, 0.5, 0.3);
        blush.position.set(cx * 1.15, -0.06, 0.20);
        headG.add(blush);
      });

      // 반짝이는 큰 검은 눈동자
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x0A0A0A });
      const shineMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
      [-0.12, 0.12].forEach(ex => {

        eye.position.set(ex, 0.04, 0.24);

        const s1 = new THREE.Mesh(new THREE.SphereGeometry(0.015, 6, 6), shineMat);

      // 앙증맞은 핑크 코
