<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8ED8FF">
  <title>낱말 탐험섬</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
    @font-face {
      font-family: 'BMJUA';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/BMJUA.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }
    /* 햇살 놀이터: 하늘 배경 + 흰 둥근 판 + 눌리는 젤리 버튼. 글씨는 크게, 그림은 더 크게. */
    :root {
      --sky1: #8ED8FF; --sky2: #D9F3FF; --grass: #7BD36B; --grass2: #5CBF55;
      --sun: #FFC531; --sun-d: #E0A100; --tomato: #FF6F59; --tomato-d: #D9483A;
      --leaf: #46C06A; --leaf-d: #2E9A4F; --sea: #3FA9F5; --sea-d: #1F84CF;
      --grape: #8E6CEF; --grape-d: #6B47D1; --cream: #FFFBF2; --ink: #3B3355; --ink-soft: #7A7394;
      --line: #EDE6D6;
    }
    * { font-family: 'BMJUA', 'Jua', 'BM JUA', 'BaeDalMinJoK JUA', sans-serif; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'BMJUA', 'Jua', 'BM JUA', 'BaeDalMinJoK JUA', sans-serif; color: var(--ink); background: var(--sky2); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; overflow: hidden; }
    button { font-family: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
    button:focus-visible { outline: 4px solid var(--sea); outline-offset: 3px; }
    .hidden { display: none !important; }
    .small { font-family: inherit; font-weight: 400; }

    #app { position: relative; width: 100%; height: 100dvh; overflow: hidden; background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 70%); }
    #gameViewport { position: absolute; inset: 0; }
    #gameViewport > canvas { display: block; touch-action: none; }

    /* 젤리 버튼 */
    .jelly { position: relative; border-radius: 26px; color: #fff; font-size: 26px; padding: 14px 28px; min-height: 64px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: var(--c, var(--sun)); box-shadow: 0 7px 0 var(--d, var(--sun-d)), 0 12px 22px rgba(59, 51, 85, .18); transition: transform .08s, box-shadow .08s; text-shadow: 0 2px 0 rgba(0,0,0,.12); }
    .jelly:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--d, var(--sun-d)), 0 5px 10px rgba(59, 51, 85, .18); }
    .jelly.sun { --c: var(--sun); --d: var(--sun-d); color: #5A3B00; text-shadow: none; }
    .jelly.tomato { --c: var(--tomato); --d: var(--tomato-d); }
    .jelly.leaf { --c: var(--leaf); --d: var(--leaf-d); }
    .jelly.sea { --c: var(--sea); --d: var(--sea-d); }
    .jelly.grape { --c: var(--grape); --d: var(--grape-d); }
    .jelly.white { --c: #fff; --d: #DCD3C0; color: var(--ink); text-shadow: none; }
    .round { width: 64px; height: 64px; padding: 0; border-radius: 50%; font-size: 30px; }
    .jelly svg { width: 34px; height: 34px; flex: none; }
    .round svg { width: 30px; height: 30px; }

    .panel { background: var(--cream); border-radius: 36px; box-shadow: 0 10px 0 #E9DFC8, 0 24px 50px rgba(59, 51, 85, .22); }
    .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
    .overlay.dim { background: rgba(43, 36, 70, .45); }
    .art img, .art svg { width: 100%; height: 100%; display: block; object-fit: contain; }

    /* 하늘 장식 (시작 화면) */
    .cloud { position: absolute; background: #fff; border-radius: 999px; opacity: .9; }
    .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
    .cloud::before { width: 55%; height: 160%; left: 15%; top: -70%; }
    .cloud::after { width: 40%; height: 120%; right: 12%; top: -45%; }
    .hills { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; }

    /* 시작 화면 */
    #charSelectModal { background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 75%); flex-direction: column; justify-content: flex-start; gap: 18px; }
    .logo { display: flex; align-items: center; gap: 14px; margin-top: 6px; z-index: 1; }
    .logo h1 { margin: 0; font-size: clamp(40px, 7vw, 64px); color: #fff; letter-spacing: 2px; -webkit-text-stroke: 3px var(--sea-d); paint-order: stroke fill; text-shadow: 0 6px 0 var(--sea-d); font-weight: 400; }
    .step-title { font-size: 26px; color: var(--ink); display: flex; align-items: center; gap: 10px; }
    .step-title b { width: 40px; height: 40px; border-radius: 50%; background: var(--tomato); color: #fff; display: grid; place-items: center; font-weight: 400; font-size: 22px; }
    .start-card { width: min(980px, 100%); padding: 22px 24px 26px; display: grid; gap: 18px; z-index: 1; }
    .scn-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
    .scn { border-radius: 26px; background: #fff; padding: 10px 6px 12px; display: grid; justify-items: center; gap: 4px; box-shadow: 0 6px 0 #E3DAC6; border: 4px solid transparent; transition: transform .12s; }
    .scn .art { width: 100%; aspect-ratio: 1; max-width: 108px; }
    .scn span { font-size: 21px; }
    .scn[aria-pressed="true"] { border-color: var(--sun); background: #FFF4CF; transform: translateY(-4px) rotate(-1.5deg); box-shadow: 0 10px 0 var(--sun-d); }
    .hero-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .hero-card { border-radius: 30px; background: #fff; padding: 12px 8px 14px; display: grid; justify-items: center; gap: 4px; box-shadow: 0 6px 0 #E3DAC6; border: 5px solid transparent; position: relative; transition: transform .12s; }
    .hero-card .art { width: min(150px, 100%); aspect-ratio: 1; }
    .hero-card span { font-size: clamp(17px, 2.1vw, 24px); color: #232338; font-weight: 700; white-space: nowrap; }
    .hero-card.on { border-color: var(--leaf); background: #EAFBE6; transform: translateY(-5px); box-shadow: 0 11px 0 var(--leaf-d); }
    .hero-name-row { display: flex; align-items: center; justify-content: center; gap: 14px; background: #fff; border-radius: 24px; padding: 10px 20px; box-shadow: 0 5px 0 #E3DAC6; margin-top: -4px; flex-wrap: wrap; }
    .hero-name-row .name-label { display: flex; align-items: center; gap: 8px; font-size: 22px; color: var(--ink); font-weight: 700; }
    .name-input-box { display: flex; align-items: center; gap: 8px; background: #F7F4EC; border: 3px solid var(--line); border-radius: 18px; padding: 6px 14px; transition: border-color .15s, background .15s; }
    .name-input-box:focus-within { border-color: var(--sea); background: #fff; box-shadow: 0 0 0 3px rgba(63,169,245,.2); }
    .role-prefix { font-size: 24px; color: var(--sea-d); font-weight: 700; white-space: nowrap; }
    #heroCustomName { font-family: 'Jua', sans-serif; font-size: 24px; border: none; background: transparent; color: var(--ink); width: 150px; outline: none; }
    #heroCustomName::placeholder { color: #BDB7CA; font-size: 20px; }
    .hero-card.on::after { content: "✔"; position: absolute; top: -12px; right: -10px; width: 44px; height: 44px; border-radius: 50%; background: var(--leaf); color: #fff; display: grid; place-items: center; font-size: 24px; box-shadow: 0 4px 0 var(--leaf-d); }
    .start-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .scn-intro { display: flex; align-items: center; gap: 12px; font-size: 20px; color: var(--ink-soft); min-width: 0; flex: 1 1 300px; }
    .best { font-size: 30px; letter-spacing: 2px; }
    #startBtn { font-size: 34px; padding: 16px 44px; min-height: 80px; }

        /* 좌측 하단 클래식 음악 알림 */
    .music-pill {
      position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: max(18px, env(safe-area-inset-bottom, 0px));
      z-index: 12; background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(8px); border-radius: 999px;
      padding: 7px 16px 7px 10px; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 5px 0 rgba(0,0,0,0.08), 0 10px 20px rgba(0,0,0,0.05); border: 3px solid #EDE6D6;
      max-width: calc(100% - 240px); transition: transform .15s ease, opacity .2s ease;
    }
    .music-pill:hover { transform: translateY(-2px); box-shadow: 0 7px 0 rgba(0,0,0,0.1); }
    .music-icon-box {
      position: relative; width: 38px; height: 38px; border-radius: 50%; background: var(--grape);
      color: #fff; display: grid; place-items: center; font-size: 19px; box-shadow: 0 3px 0 var(--grape-d); flex-shrink: 0;
    }
    .music-bars {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 3px;
      background: var(--grape); border-radius: 50%;
    }
    .music-bars i { width: 3.5px; height: 12px; background: #fff; border-radius: 2px; animation: mbar .6s ease-in-out infinite alternate; }
    .music-bars i:nth-child(2) { animation-delay: .2s; height: 18px; }
    .music-bars i:nth-child(3) { animation-delay: .4s; height: 14px; }
    .music-pill.paused .music-bars { display: none; }
    .music-pill.paused .music-icon-box .music-note { display: block; opacity: .7; }
    .music-pill:not(.paused) .music-icon-box .music-note { display: none; }
    @keyframes mbar { 0% { transform: scaleY(0.3); } 100% { transform: scaleY(1); } }
    .music-info { display: flex; flex-direction: column; min-width: 0; }
    .music-tag { font-size: 12px; color: var(--grape-d); font-weight: 700; line-height: 1.1; font-family: inherit; }
    .music-title { font-size: 18px; color: var(--ink); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
    .music-next-btn {
      background: #F4F1EA; border-radius: 50%; width: 32px; height: 32px; display: grid; place-items: center;
      font-size: 15px; box-shadow: 0 3px 0 #E3DAC6; transition: transform .1s; flex-shrink: 0; margin-left: 2px;
    }
    .music-next-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #E3DAC6; }
    #app:not(.play) #musicPill { display: none !important; }
    @media (max-width: 760px) {
      .music-pill { bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 80px); max-width: 220px; }
      .music-title { max-width: 140px; font-size: 15px; }
    }

    /* 게임 중 HUD */
    .hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); z-index: 10; pointer-events: none; }
    .hud > * { pointer-events: auto; }
    .doors { display: flex; gap: 6px; background: rgba(255,255,255,.92); padding: 10px 14px; border-radius: 999px; box-shadow: 0 5px 0 rgba(0,0,0,.08); }
    .doors i { width: 22px; height: 22px; border-radius: 7px; background: #E6E0F2; display: block; }
    .doors i.on { background: var(--leaf); box-shadow: inset 0 -4px 0 var(--leaf-d); }
    .doors i.next { background: var(--sun); box-shadow: inset 0 -4px 0 var(--sun-d); animation: blink 1s ease-in-out infinite; }
    @keyframes blink { 50% { transform: scale(1.18); } }
    .pill { background: #fff; border-radius: 999px; padding: 6px 18px 6px 8px; display: flex; align-items: center; gap: 8px; font-size: 30px; box-shadow: 0 5px 0 rgba(0,0,0,.08); }
    .pill svg { width: 40px; height: 40px; }
    .hud-right { display: flex; gap: 12px; align-items: center; }
    .notice { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(22px, env(safe-area-inset-bottom, 0px)); z-index: 10; background: rgba(255,255,255,.95); border-radius: 999px; padding: 10px 22px; font-size: 22px; box-shadow: 0 5px 0 rgba(0,0,0,.08); pointer-events: none; max-width: calc(100% - 440px); text-align: center; }
    @media (max-width: 900px) { .notice { bottom: auto; top: calc(max(14px, env(safe-area-inset-top, 0px)) + 78px); max-width: calc(100% - 32px); font-size: 18px; } }
    #minimapWrap { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 10; background: #fff; padding: 8px; border-radius: 22px; box-shadow: 0 6px 0 rgba(0,0,0,.1); }
    #minimap { display: block; width: 168px; height: 136px; border-radius: 14px; }
    #dpad { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 20; display: none; grid-template-columns: repeat(3, 76px); grid-template-rows: repeat(3, 76px); gap: 6px; }
    @media (pointer: coarse) { #dpad { display: grid; } #minimap { width: 126px; height: 102px; } }
    #dpad button { border-radius: 24px; font-size: 32px; touch-action: none; padding: 0; min-height: 0; }
    #dpad .act { font-size: 22px; }

    /* 이야기 말풍선 */
    .story { width: min(820px, 100%); display: flex; align-items: flex-end; gap: 16px; margin-top: auto; }
    .story .who { width: 150px; flex: none; text-align: center; }
    .story .who .art { width: 150px; height: 150px; background: #fff; border-radius: 50%; padding: 12px; box-shadow: 0 8px 0 #E3DAC6; box-sizing: border-box; display: grid; place-items: center; font-size: 84px; }
    .story .who span { display: inline-block; margin-top: 8px; background: var(--grape); color: #fff; border-radius: 999px; padding: 4px 14px; font-size: 18px; }
    .bubble { flex: 1; position: relative; padding: 22px 26px 20px; display: grid; gap: 14px; min-width: 0; }
    .bubble::before { content: ""; position: absolute; left: -22px; bottom: 48px; border: 14px solid transparent; border-right: 22px solid var(--cream); border-left: 0; }
    .bubble p { margin: 0; font-size: 25px; line-height: 1.5; word-break: keep-all; }
    .bubble .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .tag { background: #FFF0C7; color: #8A5A00; border-radius: 999px; padding: 4px 14px; font-size: 18px; }

    /* 퀴즈 */
    .quiz { width: min(860px, 100%); padding: 22px 26px 24px; display: grid; gap: 18px; }
    .quiz-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .doorbadge { display: flex; align-items: center; gap: 10px; font-size: 24px; }
    .doorbadge b { width: 52px; height: 52px; border-radius: 16px; background: var(--grape); color: #fff; display: grid; place-items: center; font-weight: 400; font-size: 26px; box-shadow: 0 5px 0 var(--grape-d); }
    #quizHintTag { display: none; }
    #quizPrompt { margin: 0; font-size: clamp(24px, 3.2vw, 32px); line-height: 1.45; word-break: keep-all; text-align: center; }
    #quizPrompt strong, #quizPrompt b { color: var(--tomato-d); font-weight: 400; }
    #quizPrompt .quote { display: block; margin-top: 10px; background: #fff; border-radius: 22px; padding: 14px 18px; font-size: .86em; color: var(--ink); box-shadow: inset 0 0 0 3px var(--line); }
    #quizOptions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    #quizOptions.one { grid-template-columns: 1fr; }
    .opt { min-height: 92px; font-size: 32px; border-radius: 26px; padding: 12px 18px; }
    .opt.long { font-size: 22px; min-height: 76px; justify-content: flex-start; text-align: left; line-height: 1.35; font-family: inherit; font-weight: 400; }
    .opt .n { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.35); display: grid; place-items: center; font-size: 22px; flex: none; }
    .opt.ox { min-height: 150px; font-size: 92px; line-height: 1; }
    .opt[disabled] { cursor: default; }
    .opt-wrong { filter: grayscale(1); opacity: .45; transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,.15) !important; }
    .opt-right { animation: pop .45s cubic-bezier(.2, 1.8, .4, 1); outline: 6px solid #fff; box-shadow: 0 0 0 12px var(--leaf), 0 7px 0 var(--d) !important; }
    @keyframes pop { 0% { transform: scale(.9); } 100% { transform: scale(1); } }
    .quiz-bottom { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    #quizHintBox { background: #FFF0C7; border-radius: 20px; padding: 12px 18px; font-size: 22px; text-align: center; }
    #quizHintBox b { color: var(--tomato-d); font-weight: 400; letter-spacing: 4px; font-size: 30px; }
    #quizFeedback { text-align: center; font-size: 30px; }
    #quizFeedback .mean { display: block; font-size: 20px; color: var(--ink-soft); margin-top: 4px; font-family: inherit; font-weight: 400; }
    .shake { animation: shake .4s ease-in-out; }
    @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }

    /* 결과 */
    .result { width: min(760px, 100%); padding: 24px 26px 26px; display: grid; gap: 16px; justify-items: center; text-align: center; }
    .result .art { width: 150px; height: 150px; }
    .result h2 { margin: 0; font-size: 44px; font-weight: 400; color: var(--tomato-d); }
    #resultStars { font-size: 70px; letter-spacing: 8px; line-height: 1; }
    #resultStars span { display: inline-block; animation: starin .5s cubic-bezier(.2, 1.8, .4, 1) both; }
    #resultStars span:nth-child(2) { animation-delay: .25s; } #resultStars span:nth-child(3) { animation-delay: .5s; }
    @keyframes starin { from { transform: scale(0) rotate(-40deg); } to { transform: none; } }
    .star-on { color: var(--sun); text-shadow: 0 5px 0 var(--sun-d); } .star-off { color: #E4DDCE; }
    .stats { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .stat { background: #fff; border-radius: 22px; padding: 8px 18px; display: flex; align-items: center; gap: 8px; font-size: 26px; box-shadow: 0 5px 0 #E3DAC6; }
    .stat svg { width: 34px; height: 34px; }
    #reviewWordList { width: 100%; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-height: 190px; overflow-y: auto; padding: 4px; }
    .wordchip { background: #fff; border-radius: 18px; padding: 8px 16px; font-size: 24px; box-shadow: 0 4px 0 #E3DAC6; display: flex; align-items: center; gap: 8px; }
    .wordchip.miss { background: #FFE8E3; box-shadow: 0 4px 0 #F6B9AC; }
    .wordchip button { width: 34px; height: 34px; border-radius: 50%; background: var(--sea); color: #fff; display: grid; place-items: center; }
    .wordchip button svg { width: 18px; height: 18px; }
    #resultSummary { margin: 0; font-size: 20px; color: var(--ink-soft); }
    .btnrow { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

    /* 일시정지 */
    .pause { width: min(520px, 100%); padding: 26px; display: grid; gap: 14px; }
    .pause h2 { margin: 0 0 4px; text-align: center; font-weight: 400; font-size: 38px; }
    .pause .jelly { width: 100%; justify-content: flex-start; padding-left: 24px; }
    .teacher { border-top: 3px dashed var(--line); padding-top: 12px; font-family: inherit; font-size: 16px; color: var(--ink-soft); }
    .teacher summary { cursor: pointer; font-family: 'Jua'; font-size: 18px; color: var(--ink-soft); }
    .teacher .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .teacher .mini { font-family: 'Jua'; font-size: 16px; padding: 10px 14px; border-radius: 14px; background: #fff; box-shadow: 0 4px 0 #E3DAC6; cursor: pointer; }

    #loadingScreen { position: absolute; inset: 0; z-index: 90; background: linear-gradient(180deg, var(--sky1), var(--sky2)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-size: 30px; }
    #loadingScreen .art { width: 160px; height: 160px; animation: bob 1s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-14px); } }

    .toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 100; max-width: calc(100% - 32px); background: #fff; color: var(--ink); font-size: 22px; padding: 12px 24px; border-radius: 999px; box-shadow: 0 6px 0 rgba(0,0,0,.12); }
    .toast.warn { background: #FFE8E3; }

    @media (max-width: 760px) {
      .scn-row { grid-template-columns: repeat(3, 1fr); }
      .hero-card .art { width: 100px; }
      .story { flex-direction: column; align-items: stretch; }
      .story .who { display: flex; align-items: center; gap: 12px; width: auto; }
      .story .who .art { width: 90px; height: 90px; font-size: 50px; }
      .bubble::before { display: none; }
      .opt { font-size: 26px; min-height: 76px; }
      .opt.ox { min-height: 110px; font-size: 70px; }
      .notice { font-size: 17px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

    /* ── 열린 세상 전용 ── */
    .hud-center { display: flex; gap: 10px; align-items: center; }
    .stage-pill { font-size: 22px; padding: 8px 18px; font-weight: bold; background: var(--sea); color: #fff; letter-spacing: 0.5px; }
    .stage-banner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; pointer-events: none; display: flex; align-items: center; justify-content: center; animation: bannerPop 2.4s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards; }
    .stage-banner-box { background: rgba(255, 255, 255, 0.95); border: 6px solid var(--sun); box-shadow: 0 14px 44px rgba(0, 0, 0, 0.32), 0 0 50px rgba(255, 197, 49, 0.45); border-radius: 40px; padding: 24px 64px 28px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; backdrop-filter: blur(8px); }
    .stage-banner-sub { font-size: 24px; color: var(--ink-soft); letter-spacing: 1px; }
    .stage-banner-title { margin: 0; font-size: clamp(48px, 9vw, 84px); color: #FF5722; -webkit-text-stroke: 3px #fff; paint-order: stroke fill; text-shadow: 0 6px 0 rgba(0, 0, 0, 0.15); white-space: nowrap; }
    @keyframes bannerPop { 0% { opacity: 0; transform: translate(-50%, -40%) scale(0.5); } 14% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 24% { transform: translate(-50%, -50%) scale(1); } 78% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -65%) scale(0.85); } }
    .pill.big { font-size: 34px; padding: 6px 22px 6px 10px; }
    #comboBadge { position: absolute; top: calc(max(14px, env(safe-area-inset-top, 0px)) + 74px); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 11; background: var(--tomato); color: #fff; font-size: 26px; padding: 6px 18px; border-radius: 999px; box-shadow: 0 5px 0 var(--tomato-d); transform-origin: right center; }
    #comboBadge.bump { animation: pop .4s cubic-bezier(.2, 1.8, .4, 1); }
    #radarWrap { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 10; background: #fff; padding: 8px; border-radius: 50%; box-shadow: 0 6px 0 rgba(0,0,0,.1); }
    #radar { display: block; width: 150px; height: 150px; border-radius: 50%; }
    @media (pointer: coarse) { #radarWrap { top: calc(max(14px, env(safe-area-inset-top, 0px)) + 130px); bottom: auto; } #radar { width: 116px; height: 116px; } }
    #joyZone { position: absolute; left: 0; bottom: 0; width: 45%; height: 55%; z-index: 15; display: none; touch-action: none; }
    #joyBase { position: absolute; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.45); border: 4px solid rgba(255,255,255,.9); transform: translate(-50%, -50%); left: 120px; bottom: 0; top: auto; pointer-events: none; }
    #joyKnob { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: var(--sea); box-shadow: 0 5px 0 var(--sea-d); }
    #jumpBtn { position: absolute; right: max(24px, env(safe-area-inset-right, 0px)); bottom: max(28px, env(safe-area-inset-bottom, 0px)); z-index: 16; width: 108px; height: 108px; font-size: 30px; display: none; touch-action: none; }
    @media (pointer: coarse) { #joyZone { display: block; } #jumpBtn { display: inline-flex; } .notice { bottom: auto; top: calc(max(14px, env(safe-area-inset-top, 0px)) + 78px); } }

    .mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .mode { flex-direction: column; min-height: 130px; font-size: 32px; border-radius: 30px; gap: 4px; }
    .mode small { font-size: 18px; opacity: .9; font-family: inherit; font-weight: 400; }
    .start-foot { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }

    #resultScore { font-size: 72px; color: var(--sea-d); line-height: 1; }
    .namebox { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .namebox input { font-family: 'Jua'; font-size: 26px; border-radius: 20px; border: 4px solid var(--line); padding: 8px 16px; width: 200px; background: #fff; color: var(--ink); text-align: center; }
    .namebox input:focus { outline: none; border-color: var(--sea); }
    #rankList { width: 100%; max-width: 420px; display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
    #rankList li { display: grid; grid-template-columns: 44px 44px 1fr auto; align-items: center; gap: 8px; background: #fff; border-radius: 16px; padding: 4px 14px 4px 6px; font-size: 22px; box-shadow: 0 3px 0 #E3DAC6; }
    #rankList li.me { background: #FFF4CF; }
    #rankList .rk { width: 36px; height: 36px; border-radius: 50%; background: var(--grape); color: #fff; display: grid; place-items: center; font-size: 18px; }
    #rankList .art { width: 40px; height: 40px; }
    #rankList .sc { color: var(--sea-d); font-variant-numeric: tabular-nums; }

    .book { width: min(900px, 100%); padding: 22px 24px 24px; display: grid; gap: 14px; max-height: 100%; }
    .book h2 { margin: 0; font-weight: 400; font-size: 36px; text-align: center; }
    .book-zone h3 { margin: 4px 0 8px; font-weight: 400; font-size: 24px; display: flex; align-items: center; gap: 8px; }
    .book-zone h3 i { width: 18px; height: 18px; border-radius: 50%; display: inline-block; }
    .book-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .bcard { background: #fff; border-radius: 18px; padding: 8px 10px 8px 16px; font-size: 24px; box-shadow: 0 4px 0 #E3DAC6; display: flex; align-items: center; gap: 8px; }
    .bcard.locked { background: #EFEAF7; color: #B9B0D0; box-shadow: none; }
    .bcard button { width: 36px; height: 36px; border-radius: 50%; background: var(--sea); color: #fff; display: grid; place-items: center; }
    .bcard button svg { width: 18px; height: 18px; }
    #bookScroll { overflow-y: auto; display: grid; gap: 12px; padding-right: 4px; }
    .overlay { z-index: 40; } #startModal, #resultModal { z-index: 50; } #pauseModal, #bookModal { z-index: 60; }
    .toast { bottom: auto !important; top: calc(86px + env(safe-area-inset-top, 0px)); }
    #app:not(.play) .hud, #app:not(.play) #radarWrap, #app:not(.play) #noticeBox, #app:not(.play) #joyZone, #app:not(.play) #jumpBtn, #app:not(.play) #comboBadge { display: none !important; }
    /* 감정표현 */
    #emoteBtn { position: absolute; z-index: 16; right: max(150px, calc(env(safe-area-inset-right, 0px) + 150px)); bottom: max(28px, env(safe-area-inset-bottom, 0px)); width: 84px; height: 84px; font-size: 40px; }
    @media (pointer: fine) { #emoteBtn { right: max(196px, calc(env(safe-area-inset-right, 0px) + 196px)); bottom: max(24px, env(safe-area-inset-bottom, 0px)); } }
    #emoteMenu { position: absolute; z-index: 17; left: 50%; width: max-content; transform: translateX(-50%); bottom: calc(max(28px, env(safe-area-inset-bottom, 0px)) + 104px); display: flex; gap: 10px; background: rgba(255,255,255,.92); padding: 12px; border-radius: 30px; box-shadow: 0 8px 0 rgba(0,0,0,.08); max-width: calc(100% - 32px); flex-wrap: wrap; justify-content: center; }
    #emoteMenu.hidden { display: none !important; }
    .emo { flex-direction: column; width: 88px; min-height: 92px; padding: 6px; font-size: 18px; gap: 0; border-radius: 22px; }
    .emo span { font-size: 40px; line-height: 1.1; }
    #app:not(.play) #emoteBtn, #app:not(.play) #emoteMenu { display: none !important; }
  </style>
</head>
<body>
<div id="app">
  <div id="gameViewport"></div>

  <!-- 게임 중 표시 -->
  <div class="hud" id="hud">
    <button type="button" class="jelly white round" onclick="openPause()" aria-label="멈춤 메뉴">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4.5" height="16" rx="1.5"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.5"/></svg>
    </button>
    <div class="hud-center">
      <div class="pill stage-pill" id="stagePill" aria-label="현재 스테이지"><span id="stagePillText">스테이지 1 / 3</span></div>
      <div class="pill" aria-label="모은 카드"><span class="art" data-art="card" style="width:40px;height:40px"></span><span id="cardText">0 / 10</span></div>
      <div class="pill hidden" id="timerPill" aria-label="남은 시간"><span class="art" data-art="clock" style="width:38px;height:38px"></span><span id="timerText">3:00</span></div>
    </div>
    <div class="hud-right">
      <div class="pill big" aria-label="점수"><span class="art" data-art="star" style="width:42px;height:42px"></span><span id="scoreText">0</span></div>
      <button type="button" class="jelly white round" id="soundBtn" onclick="toggleSound()" aria-label="소리 켜기/끄기"></button>
    </div>
  </div>
  <div id="stageBanner" class="stage-banner hidden" aria-live="polite">
    <div class="stage-banner-box">
      <div class="stage-banner-sub" id="bannerSub">맑은 햇살 아래</div>
      <h1 class="stage-banner-title" id="bannerTitle">게임 스타트</h1>
    </div>
  </div>
  <button type="button" id="emoteBtn" class="jelly grape round" onclick="openEmoteMenu()" aria-label="감정표현">😊</button>
  <div id="emoteMenu" class="hidden" role="menu" aria-label="감정표현 고르기">
    <button type="button" class="jelly white emo" onclick="emote('wave')"><span>👋</span>안녕</button>
    <button type="button" class="jelly white emo" onclick="emote('happy')"><span>😄</span>신나</button>
    <button type="button" class="jelly white emo" onclick="emote('dance')"><span>🎵</span>춤</button>
    <button type="button" class="jelly white emo" onclick="emote('cheer')"><span>🎉</span>만세</button>
    <button type="button" class="jelly white emo" onclick="emote('sad')"><span>😢</span>슬퍼</button>
    <button type="button" class="jelly white emo" onclick="emote('wow')"><span>😮</span>우와</button>
  </div>
    <!-- 좌측 하단 현재 재생 중인 클래식 BGM 알림 -->
  <div id="musicPill" class="music-pill" aria-label="현재 재생 중인 클래식 음악">
    <div class="music-icon-box">
      <span class="music-note">🎵</span>
      <div class="music-bars" id="musicBars"><i></i><i></i><i></i></div>
    </div>
    <div class="music-info">
      <span class="music-tag">초등 교과서 클래식 감상</span>
      <span class="music-title" id="musicTitleText">비발디 - 사계 '봄' 1악장</span>
    </div>
    <button type="button" class="music-next-btn" onclick="nextBgmTrack()" title="다음 클래식 음악 듣기" aria-label="다음 곡">⏭</button>
  </div>
  <div id="comboBadge" class="hidden"></div>
  <div class="notice" id="noticeBox"><span id="noticeText">빛나는 카드를 찾아요!</span></div>
  <div id="radarWrap"><canvas id="radar" width="300" height="300" aria-label="지도"></canvas></div>
  <div id="joyZone" aria-label="움직이기"><div id="joyBase"><div id="joyKnob"></div></div></div>
  <button type="button" id="jumpBtn" class="jelly sun round" aria-label="점프">점프</button>

  <!-- 시작 화면 -->
  <div id="startModal" class="overlay" style="display:flex;flex-direction:column;justify-content:flex-start;gap:18px;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 75%)">
    <div class="cloud" style="width:180px;height:56px;left:6%;top:9%"></div>
    <div class="cloud" style="width:130px;height:42px;right:9%;top:16%"></div>
    <svg class="hills" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true"><path d="M0 120 Q200 40 420 110 T820 90 T1200 100 V200 H0Z" fill="#9BE08A"/><path d="M0 160 Q300 90 600 150 T1200 140 V200 H0Z" fill="#7BD36B"/></svg>
    <div class="logo"><span class="art" data-art="compass" style="width:84px;height:84px"></span><h1>낱말 탐험섬</h1></div>
    <div class="panel start-card">
      <div class="step-title"><b>1</b>누구랑 갈까?</div>
      <div class="hero-row" id="heroRow"></div>
      <div class="hero-name-row">
        <label for="heroCustomName" class="name-label">
          <span class="art" data-art="star" style="width:26px;height:26px"></span>
          <span>이름 직접 정하기:</span>
        </label>
        <div class="name-input-box">
          <span id="heroRolePrefix" class="role-prefix">탐험가</span>
          <input type="text" id="heroCustomName" maxlength="8" placeholder="예: 도로" autocomplete="off" aria-label="캐릭터 이름">
        </div>
      </div>
      <div class="step-title"><b>2</b>어떻게 놀까?</div>
      <div class="mode-row">
        <button type="button" class="jelly leaf mode" onclick="startGame('free')">🧭 천천히 탐험<small>카드 10장 모두 찾기</small></button>
        <button type="button" class="jelly tomato mode" onclick="startGame('timed')">⏱ 3분 도전<small>3분 동안 많이 모으기</small></button>
      </div>
      <div class="start-foot">
                <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button type="button" class="jelly grape" onclick="openBook()" style="font-size:22px">📖 낱말 도감 <span id="bookCount"></span></button>
          <button type="button" class="jelly white" id="homeSoundBtn" onclick="toggleSound()" style="font-size:20px;min-height:56px;padding:10px 18px" aria-label="배경음악 켜기/끄기">🎵 음악 켜기</button>
        </div>
        <span class="small" style="color:var(--ink-soft);font-size:14px">키보드: 방향키·WASD 이동 · 스페이스 점프 · 마우스 끌기 시점 돌리기</span>
      </div>
    </div>
  </div>

  <!-- 문제 -->
  <div id="quizModal" class="overlay dim hidden">
    <div id="quizCard" class="panel quiz" role="dialog" aria-modal="true" aria-labelledby="quizPrompt">
      <div class="quiz-top">
        <div class="doorbadge"><b id="quizZoneDot">?</b><span id="quizZoneName"></span></div>
        <button type="button" class="jelly sea round" id="quizSay" aria-label="문제 듣기"></button>
      </div>
      <p id="quizPrompt"></p>
      <div id="quizOptions"></div>
      <div id="quizHintBox" class="hidden"></div>
      <div id="quizFeedback" class="hidden" aria-live="polite"></div>
      <div class="quiz-bottom">
        <button type="button" class="jelly white" onclick="closeQuiz(true)" style="font-size:20px;min-height:54px">↩ 나중에</button>
        <button type="button" id="quizHintBtn" class="jelly sun" onclick="showHint()" style="font-size:20px;min-height:54px"><span class="art" data-art="bulb" style="width:30px;height:30px"></span>힌트</button>
      </div>
    </div>
  </div>

  <!-- 멈춤 -->
  <div id="pauseModal" class="overlay dim hidden">
    <div class="panel pause" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
      <h2 id="pauseTitle">잠깐 쉬기</h2>
      <button type="button" class="jelly leaf" onclick="closePause()">▶ 계속하기</button>
      <button type="button" class="jelly sea" onclick="startGame(G.mode)">↻ 처음부터 다시</button>
      <button type="button" class="jelly grape" onclick="toTitle()">⌂ 첫 화면</button>
      <button type="button" class="jelly white" onclick="toggleSound()" id="pauseSoundBtn">소리 끄기</button>
    </div>
  </div>

  <!-- 결과 -->
  <div id="resultModal" class="overlay dim hidden">
    <div class="panel result">
      <span class="art" data-art="trophy"></span>
      <h2 id="resultTitle">다 모았어요!</h2>
      <div id="resultScore">0</div>
      <div class="stats">
        <div class="stat"><span class="art" data-art="card" style="width:34px;height:34px"></span><span id="resultCards"></span></div>
        <div class="stat"><span class="art" data-art="clock" style="width:34px;height:34px"></span><span id="resultTime"></span></div>
      </div>
      <form class="namebox" id="rankForm">
        <input id="rankName" maxlength="6" placeholder="내 이름" autocomplete="off" aria-label="순위표에 올릴 이름">
        <button type="submit" class="jelly sun" style="font-size:22px;min-height:56px">🏅 순위 올리기</button>
      </form>
      <ol id="rankList"></ol>
      <div id="reviewWordList"></div>
      <div class="btnrow">
        <button type="button" class="jelly leaf" onclick="startGame(G.mode)">↻ 한 번 더</button>
        <button type="button" class="jelly sea" onclick="toTitle()">⌂ 첫 화면</button>
      </div>
    </div>
  </div>

  <!-- 낱말 도감 -->
  <div id="bookModal" class="overlay dim hidden">
    <div class="panel book">
      <h2>📖 낱말 도감 <span id="bookTotal" style="font-size:24px;color:var(--ink-soft)"></span></h2>
      <div id="bookScroll"></div>
      <div class="btnrow"><button type="button" class="jelly sea" onclick="closeBook()">닫기</button></div>
    </div>
  </div>

  <div id="loadingScreen"><span class="art" data-art="compass"></span>섬을 만드는 중…</div>
</div>

  <script>
    /* ───── 그림: 직접 그린 SVG. assets/<이름>.png 를 넣으면 그 그림으로 바뀜 ───── */
    const ART = {
      star: `<svg viewBox="0 0 64 64"><path d="M32 5l8.3 17 18.7 2.7-13.5 13.2 3.2 18.6L32 47.7 15.3 56.5l3.2-18.6L5 24.7 23.7 22z" fill="#FFC531" stroke="#E0A100" stroke-width="4" stroke-linejoin="round"/><path d="M24 26l5-1" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"/></svg>`,
      bulb: `<svg viewBox="0 0 64 64"><path d="M32 6a19 19 0 0 0-11 34.5V47h22v-6.5A19 19 0 0 0 32 6z" fill="#FFF3B0" stroke="#8A5A00" stroke-width="4"/><rect x="22" y="47" width="20" height="9" rx="4" fill="#8A5A00"/><path d="M26 26a7 7 0 0 1 7-7" stroke="#8A5A00" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`,
      clock: `<svg viewBox="0 0 64 64"><circle cx="32" cy="34" r="24" fill="#fff" stroke="#3FA9F5" stroke-width="6"/><path d="M32 20v15l10 6" stroke="#3B3355" stroke-width="5" stroke-linecap="round" fill="none"/><rect x="26" y="3" width="12" height="8" rx="3" fill="#3FA9F5"/></svg>`,
      speaker: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h4l5 4v-13l-5 4z" fill="currentColor"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/></svg>`,
      mute: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h4l5 4v-13l-5 4z" fill="currentColor"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>`,
      compass: `<svg viewBox="0 0 120 120"><circle cx="60" cy="62" r="50" fill="#FF6F59" stroke="#D9483A" stroke-width="6"/><circle cx="60" cy="62" r="38" fill="#FFFBF2"/><path d="M60 30l10 32-10 32-10-32z" fill="#3FA9F5"/><path d="M60 30l10 32H50z" fill="#FF6F59"/><circle cx="60" cy="62" r="6" fill="#3B3355"/><circle cx="60" cy="10" r="8" fill="#FFC531" stroke="#E0A100" stroke-width="4"/></svg>`,
      trophy: `<svg viewBox="0 0 120 120"><path d="M34 14h52v26a26 26 0 0 1-52 0z" fill="#FFC531" stroke="#E0A100" stroke-width="5"/><path d="M34 22H18a14 14 0 0 0 16 22M86 22h16a14 14 0 0 1-16 22" fill="none" stroke="#E0A100" stroke-width="6"/><rect x="52" y="64" width="16" height="20" fill="#E0A100"/><rect x="34" y="84" width="52" height="16" rx="5" fill="#FF6F59"/><path d="M60 24l4 9 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z" fill="#fff"/></svg>`,
      // 모험 그림
      detective: `<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="56" fill="#FFE7A3"/><circle cx="52" cy="52" r="26" fill="#D9F3FF" stroke="#3B3355" stroke-width="8"/><path d="M71 71l26 26" stroke="#3B3355" stroke-width="12" stroke-linecap="round"/><path d="M40 46a13 13 0 0 1 12-10" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/></svg>`,

        }

          const conv = AC.createConvolver();
          const rate = AC.sampleRate;
          const dur = 1.35;
          const len = Math.floor(rate * dur);
          const buf = AC.createBuffer(2, len, rate);
          const L = buf.getChannelData(0), R = buf.getChannelData(1);
          for (let i = 0; i < len; i++) {
            const t = i / len;
            const decay = Math.exp(-t * 4.0);
            L[i] = (Math.random() * 2 - 1) * decay;
            R[i] = (Math.random() * 2 - 1) * decay;
          }
          conv.buffer = buf;
          const revGain = AC.createGain();
          revGain.gain.value = 0.28;
          conv.connect(revGain);
          revGain.connect(bgmGain);
          acousticReverb = conv;
        } catch(e){}
      }
      if (!pianoWave) {
        try {
          const pR = new Float32Array([0, 0, 0, 0, 0, 0, 0, 0]);
          const pI = new Float32Array([0, 1.0, 0.58, 0.35, 0.20, 0.11, 0.05, 0.025]);
          pianoWave = AC.createPeriodicWave(pR, pI, { disableNormalization: false });

          const cR = new Float32Array([0, 0, 0, 0, 0, 0, 0, 0]);
          const cI = new Float32Array([0, 1.0, 0.72, 0.46, 0.28, 0.16, 0.08, 0.04]);
          celloWave = AC.createPeriodicWave(cR, cI, { disableNormalization: false });
        } catch(e){}
      }
    }

    function playAcousticPiano(freq, startTime, dur, vol = 0.08) {
      if (!AC || !bgmGain) return;
      initAcousticSynth();
      try {
        const filter = AC.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(Math.min(9000, freq * 4.2 + 850), startTime);
        filter.frequency.exponentialRampToValueAtTime(Math.max(150, freq * 1.2), startTime + Math.min(dur, 0.35));
        filter.Q.value = 1.25;

        const noteGain = AC.createGain();
        noteGain.gain.setValueAtTime(0.0001, startTime);
        noteGain.gain.linearRampToValueAtTime(vol, startTime + 0.006);
        noteGain.gain.exponentialRampToValueAtTime(Math.max(0.0001, vol * 0.45), startTime + 0.13);
        noteGain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);

        filter.connect(noteGain);
        noteGain.connect(currentTrackGain || bgmGain);
        if (acousticReverb) noteGain.connect(acousticReverb);

        [-2.2, 2.2].forEach(detune => {
          const osc = AC.createOscillator();
          if (pianoWave) osc.setPeriodicWave(pianoWave);
          else osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, startTime);
          osc.detune.setValueAtTime(detune, startTime);
          osc.connect(filter);
          osc.start(startTime); activeBgmNodes.push(osc); activeBgmNodes.push(osc);
          osc.stop(startTime + dur + 0.05);
        });

        const hammer = AC.createOscillator();
        const hammerG = AC.createGain();
        hammer.type = "sine";
        hammer.frequency.setValueAtTime(freq * 5.2, startTime);
        hammerG.gain.setValueAtTime(vol * 0.22, startTime);
        hammerG.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.02);
        hammer.connect(hammerG);
        hammerG.connect(bgmGain);
        hammer.start(startTime); activeBgmNodes.push(hammer);
        hammer.stop(startTime + 0.025);
      } catch(e){}
    }

    function playAcousticCello(freq, startTime, dur, vol = 0.065) {
      if (!AC || !bgmGain) return;
      initAcousticSynth();
      try {
        const filter = AC.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(Math.min(3200, freq * 2.6 + 320), startTime);
        filter.Q.value = 1.6;

        const noteGain = AC.createGain();
        noteGain.gain.setValueAtTime(0.0001, startTime);
        noteGain.gain.linearRampToValueAtTime(vol, startTime + 0.045);
        noteGain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);

        filter.connect(noteGain);
        noteGain.connect(currentTrackGain || bgmGain);
        if (acousticReverb) noteGain.connect(acousticReverb);

        const osc = AC.createOscillator();
        if (celloWave) osc.setPeriodicWave(celloWave);
        else osc.type = "sawtooth";
        osc.frequency.setValueAtTime(freq, startTime);

        const vibrato = AC.createOscillator();
        const vibGain = AC.createGain();
        vibrato.frequency.setValueAtTime(4.8, startTime);
        vibGain.gain.setValueAtTime(freq * 0.004, startTime);
        vibrato.connect(osc.frequency);
        vibrato.start(startTime); activeBgmNodes.push(vibrato);
        vibrato.stop(startTime + dur + 0.05);

        osc.connect(filter);
        osc.start(startTime); activeBgmNodes.push(osc);
        osc.stop(startTime + dur + 0.05);
      } catch(e){}
    }

      critters.forEach(b => {
        const u = b.userData, a = t * u.sp + u.ph;
        b.position.set(u.cx + Math.cos(a) * u.rad, 1 + Math.sin(a * 2.3) * .4, u.cz + Math.sin(a) * u.rad);
        b.rotation.y = -a;
        const f = Math.sin(t * 22 + u.ph) * .9;
        u.l.rotation.y = f; u.r.rotation.y = -f;
      });
      clouds.forEach(cl => { cl.userData.a += dt * (cl.userData.speed || 0.008); cl.position.x = Math.cos(cl.userData.a) * cl.userData.r; cl.position.z = Math.sin(cl.userData.a) * cl.userData.r; });
      if (sun3DGroup && sun3DGroup.visible) {
        if (sun3DGroup.userData.rayGroup) sun3DGroup.userData.rayGroup.rotation.z += dt * 0.35;
        if (sun3DGroup.userData.corona) {
          sun3DGroup.userData.corona.quaternion.copy(camera.quaternion);
          const s = 1.0 + Math.sin(t * 2.8) * 0.06;
          sun3DGroup.userData.corona.scale.set(s, s, 1);
        }
      }
      if (stage3CarouselRotor && stage3Group && stage3Group.visible) {
        stage3CarouselRotor.rotation.y += dt * 0.45;
      }

    // 카메라와 캐릭터 사이를 가리는 나무·집은 반투명하게
    const ray = new THREE.Raycaster();
    function updateOcclusion() {
      fadeables.forEach(f => f.userData.want = 1);
      const head = new THREE.Vector3(P.pos.x, P.pos.y + 1, P.pos.z);
      const dir = head.clone().sub(camera.position), dist = dir.length();
      ray.set(camera.position, dir.normalize()); ray.far = dist - .6;
      const hits = ray.intersectObjects(fadeables.filter(f => f.visible && (!f.parent || f.parent.visible !== false)).map(f => f.userData.meshes).flat(), false);
      hits.forEach(h => { h.object.userData.owner.userData.want = .25; });
      // 캐릭터 바로 옆 나무도 살짝 비침
      fadeables.forEach(f => {
        const o = f.userData;
        o.cur = (o.cur ?? 1) + (o.want - (o.cur ?? 1)) * .25;
        o.meshes.forEach(m => { m.material.transparent = o.cur < .99; m.material.opacity = o.cur; m.material.depthWrite = o.cur > .9; });
      });
    }
    function makeFadeable(group) {
      const meshes = [];
      group.traverse(o => { if (o.isMesh) { meshes.push(o); o.userData.owner = group; } });
      group.userData.meshes = meshes;
      fadeables.push(group);
    }

    function makeFlagTexture() {
      const c = document.createElement("canvas");
      c.width = 256; c.height = 160;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, 256, 160);
      const cx = 128, cy = 80, r = 38;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-Math.atan2(2, 3));
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI, false);
      ctx.arc(r / 2, 0, r / 2, 0, Math.PI, false);
      ctx.arc(-r / 2, 0, r / 2, Math.PI, 0, false);
      ctx.fillStyle = "#CD2E3A";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, 0, r, Math.PI, 0, false);
      ctx.arc(r / 2, 0, r / 2, 0, Math.PI, true);
      ctx.arc(-r / 2, 0, r / 2, Math.PI, 0, true);
      ctx.fillStyle = "#0047A0";
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = "#000000";
      const drawTrigram = (x, y, ang, bars) => {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(ang);
        bars.forEach((broken, i) => {
          const by = (i - 1) * 8;
          if (broken) {
            ctx.fillRect(-18, by - 2.5, 14, 5);
            ctx.fillRect(4, by - 2.5, 14, 5);
          } else {
            ctx.fillRect(-18, by - 2.5, 36, 5);
          }
        });
        ctx.restore();
      };
      drawTrigram(50, 40, Math.atan2(2, 3), [false, false, false]);
      drawTrigram(206, 120, Math.atan2(2, 3), [true, true, true]);
      drawTrigram(206, 40, -Math.atan2(2, 3), [true, false, true]);
      drawTrigram(50, 120, -Math.atan2(2, 3), [false, true, false]);
      return setSRGB(new THREE.CanvasTexture(c));
    }

    // 캐릭터: 큰 머리 2등신. 발이 y=0. 머리·팔·발이 따로 움직이고 표정이 바뀜
    const HERO_ROLES = { explorer: "탐험가", cyberbot: "로보트", wizard: "마법사" };
    const HERO_SPECIES = { explorer: "고양이", cyberbot: "강아지", wizard: "토끼" };
    const HERO_DEFAULTS = { explorer: "도로", cyberbot: "도로", wizard: "도로" };

    function getHeroFullName(heroType = G.hero, withSpecies = false) {
      const prefix = HERO_ROLES[heroType] || "탐험가";
      const def = HERO_DEFAULTS[heroType] || "도로";
      let custom = (G.customName || "").trim();
      custom = custom.replace(/^(탐험가|로보트|로봇|마법사)\s*/g, "").trim();
      custom = custom.replace(/\s*\([^)]*\)/g, "").trim();
      const name = custom || def;
      const sp = HERO_SPECIES[heroType];
      return (withSpecies && sp) ? `${prefix} ${name} (${sp})` : `${prefix} ${name}`;
    }

        function makeNameSprite(text, heroType) {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 128;
      const x = c.getContext("2d");

      x.font = "bold 38px 'Jua', 'BM JUA', 'BMJUA', sans-serif";
      const metrics = x.measureText(text);
      const w = Math.min(480, Math.max(220, metrics.width + 56));
      const h = 72;
      const left = (512 - w) / 2, top = (128 - h) / 2;

      // 그림자
      x.fillStyle = "rgba(0,0,0,0.18)";
      roundRect(x, left, top + 6, w, h, 36);
      x.fill();

      // 배경 흰색 알약
      x.fillStyle = "#ffffff";
      roundRect(x, left, top, w, h, 36);
      x.fill();

      // 테두리
      const borderColor = { explorer: "#3FA9F5", cyberbot: "#46C06A", wizard: "#8E6CEF" }[heroType] || "#3FA9F5";
      x.lineWidth = 6;
      x.strokeStyle = borderColor;
      x.stroke();

      // 이름 텍스트
      x.font = "bold 38px 'Jua', 'BM JUA', 'BMJUA', sans-serif";
      x.textAlign = "center";
      x.textBaseline = "middle";
      x.fillStyle = "#2D283E";
      x.fillText(text, 256, 64);

      const tex = setSRGB(new THREE.CanvasTexture(c));
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
      sp.scale.set(1.9, 0.475, 1);
      sp.position.set(0, 2.05, 0);
      sp.renderOrder = 998;
      return sp;
    }

    function makeHero(type) {
      const g = new THREE.Group(), U = g.userData;
      U.type = type;
      const rig = new THREE.Group(); g.add(rig); U.rig = rig;

      // Base colors
      const bodyCol = { explorer: 0x38BDF8, cyberbot: 0xCBD5E1, wizard: 0x7C3AED }[type] || 0x38BDF8;
      const furCol = { explorer: 0xD98A48, cyberbot: 0xD6DEE8, wizard: 0xFFFFFF }[type] || 0xD98A48;

      // Body (Shirt / Robot Torso / Robe)
      let body;
      if (type === "wizard") {
        body = new THREE.Mesh(new THREE.CylinderGeometry(.22, .42, .5, 20), std(bodyCol, { roughness: .65 }));
        body.position.y = .36;
      } else if (type === "cyberbot") {
        body = new THREE.Mesh(new THREE.CylinderGeometry(.26, .3, .44, 18), std(bodyCol, { roughness: .4, metalness: .3 }));
        body.position.y = .38;
        // Chest green light
        const light = new THREE.Mesh(new THREE.SphereGeometry(.07, 12, 10), new THREE.MeshStandardMaterial({
          color: lin(0x22C55E), emissive: lin(0x22C55E), emissiveIntensity: .9
        }));
        light.position.set(0, .42, .27);
        rig.add(light);
      } else { // explorer (고양이)
        body = new THREE.Mesh(new THREE.CylinderGeometry(.24, .3, .46, 20), std(bodyCol, { roughness: .6 }));
        body.position.y = .38;
        // Neckerchief collar & knot
        const scarf = new THREE.Mesh(new THREE.CylinderGeometry(.28, .27, .09, 20), std(0x92400E, { roughness: .7 }));
        scarf.position.y = .57; rig.add(scarf);
        const knot = new THREE.Mesh(new THREE.ConeGeometry(.06, .14, 8), std(0x92400E, { roughness: .7 }));
        knot.rotation.x = Math.PI; knot.position.set(0, .49, .28); rig.add(knot);
      }
      rig.add(body); U.body = body;

      // Tails!
      if (type === "explorer") {
        // Cat tail: curved up on the right side

      const head = new THREE.Mesh(new THREE.ConeGeometry(.28, .5, 16), m); head.rotation.x = Math.PI / 2; head.position.z = .45; g.add(head);

    const cardTex = {};
    function cardTexture(zoneKey, gold) {
      const key = gold ? "gold" : zoneKey;
      if (cardTex[key]) return cardTex[key];
      const c = document.createElement("canvas"); c.width = 256; c.height = 340;
      const x = c.getContext("2d"), col = "#FFD214";
      x.fillStyle = col; roundRect(x, 6, 6, 244, 328, 36); x.fill();
      x.fillStyle = "#fff"; roundRect(x, 26, 26, 204, 288, 26); x.fill();
      x.fillStyle = col; x.font = "bold 196px 'Jua', 'BM JUA', 'BMJUA', sans-serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.lineWidth = 5; x.strokeStyle = "#F59E0B"; x.strokeText(gold ? "★" : "?", 128, 182); x.fillText(gold ? "★" : "?", 128, 182);
      //
      return (cardTex[key] = new THREE.CanvasTexture(c));
    }
    function makeCardMesh(zoneKey, gold) {
      const g = new THREE.Group();
      const face = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 1.46), new THREE.MeshBasicMaterial({ map: cardTexture(zoneKey, gold), transparent: true, side: THREE.DoubleSide }));
      face.position.y = 1.3; g.add(face); g.userData.face = face;
      const ring = new THREE.Mesh(new THREE.RingGeometry(.55, .85, 32), new THREE.MeshBasicMaterial({ color: 0xFFD214, transparent: true, opacity: .65, side: THREE.DoubleSide }));
      ring.rotation.x = -Math.PI / 2; ring.position.y = .03; g.add(ring); g.userData.ring = ring;
      return g;
    }
    function freeSpot(zoneKey) {
      const z = ZONES[zoneKey];
      for (let t = 0; t < 150; t++) {
        const a = Math.random() * Math.PI * 2;
        const rMin = zoneKey === "village" ? 9.8 : (zoneKey === "plaza" ? 4.8 : 2.5);
        const rMax = z.r - 2.0;
        const r = rMin + Math.random() * (rMax - rMin);
        const x = z.x + Math.cos(a) * r, zz = z.z + Math.sin(a) * r;

        if (colliders.some(c => Math.hypot(c.x - x, c.z - zz) < c.r + 1.2)) continue;
        if (boxes.some(b => x > b.minx - 1.2 && x < b.maxx + 1.2 && zz > b.minz - 1.2 && zz < b.maxz + 1.2)) continue;
        if (G.cards.some(c => !c.done && c.mesh && c.mesh.position.distanceTo(new THREE.Vector3(x, 0, zz)) < 3.6)) continue;
        return new THREE.Vector3(x, 0, zz);

      }
      const safeAngle = Math.random() * Math.PI * 2;
      const safeR = zoneKey === "village" ? (11 + Math.random() * 7) : (zoneKey === "plaza" ? (6 + Math.random() * 8) : (4 + Math.random() * (z.r - 6)));
      return new THREE.Vector3(z.x + Math.cos(safeAngle) * safeR, 0, z.z + Math.sin(safeAngle) * safeR);
    }

    function updateGrassAndTuftsPalette(stageNum) {
      if (grassMesh && grassMesh.geometry) {
        const geo = grassMesh.geometry;
        const pos = geo.attributes.position;
        const noise = geo.userData.noiseVals;
        const colAttr = geo.attributes.color;
        if (noise && colAttr) {
          const grassPalettes = {
            1: { A: lin(0x2E7D32), B: lin(0x43A047), C: lin(0x1B5E20) },
            2: { A: lin(0x2E7D32), B: lin(0x43A047), C: lin(0x1B5E20) },
            3: { A: lin(0x65A30D), B: lin(0x84CC16), C: lin(0x4D7C0F) }
          };
          const pal = grassPalettes[stageNum] || grassPalettes[1];
          const tmp = new THREE.Color();
          for (let i = 0; i < pos.count; i++) {
            const n = noise[i];
            tmp.copy(pal.A).lerp(n > 0 ? pal.B : pal.C, Math.min(1, Math.abs(n) * 0.55));
            colAttr.setXYZ(i, tmp.r, tmp.g, tmp.b);
          }
          colAttr.needsUpdate = true;
        }
      }

      if (tuftsMesh) {
        const tuftPalettes = {

    function setStageVisuals(stageNum) {

    function advanceStage(stageNum) {

      setStageVisuals(stageNum);

      }));

      const zk = shuffle(["forest", "village", "plaza"])[0];

      const w = shuffle(ZONES[zk].words).find(x => !used.has(x.word));

    /* ───────────── 문제 만들기 ───────────── */
    function makeQuestion(card) {
      const w = card.word, pool = ZONES[card.zone].words, others = pool.filter(x => x !== w);
      const pick = (field, n) => shuffle([...new Set(others.map(x => x[field]).filter(v => v && v !== w[field]))]).slice(0, n);
      const opts = (right, wrongs) => shuffle([{ label: right, ok: true }, ...wrongs.map(v => ({ label: v, ok: false }))]);
      const Q = "<span class='quote'>";
      let types = ZONES[card.zone].malmoi ? ["nk2std", "std2nk", "pic", "en", "ox"] : ["def", "blank", "mean", "rel", "ox", "app", "ant"];
      if (!w.ant) types = types.filter(t => t !== "ant");
      types = shuffle(types.filter(t => t !== card.lastType));
      const t = types[0]; card.lastType = t;
      const q = { hint: chosung(w.word), word: w.word, mean: ZONES[card.zone].malmoi ? `북한말 '${w.nk}', 영어 '${w.en}'` : w.meaning };
      switch (t) {
        case "nk2std": return { ...q, prompt: `북한에서는 <b>${esc(w.nk)}</b>!<br>우리는 뭐라고 할까?`, options: opts(w.word, pick("word", 3)) };
        case "std2nk": q.hint = chosung(w.nk); return { ...q, prompt: `<b>${esc(w.word)}</b>${batchim(w.word) ? "을" : "를"}<br>북한에서는 뭐라고 할까?`, options: opts(w.nk, pick("nk", 3)) };
        case "pic": return { ...q, prompt: `이 그림은 무엇일까?<span style="display:block;font-size:2.4em;line-height:1.2">${w.pic}</span>`, options: opts(w.word, pick("word", 3)) };
        case "en": return { ...q, prompt: `영어로 <b>${esc(w.en)}</b>!<br>우리말로 뭘까?`, options: opts(w.word, pick("word", 3)) };
        case "ox": {
          if (ZONES[card.zone].malmoi) {
            const truth = Math.random() < .5, shown = truth ? w.nk : pick("nk", 1)[0] || w.nk;
            return { ...q, prompt: `맞는 말일까?${Q}<b>${esc(w.word)}</b>의 북한말은 <b>${esc(shown)}</b></span>`, ox: true, options: [{ label: "O", ok: shown === w.nk, say: "맞아요" }, { label: "X", ok: shown !== w.nk, say: "틀려요" }] };
          }
          const truth = Math.random() < .5;
          return { ...q, prompt: `맞는 말일까?${Q}${truth ? `<b>${esc(w.word)}</b> : ${esc(w.meaning)}` : esc(w.mis)}</span>`, ox: true, options: [{ label: "O", ok: truth, say: "맞아요" }, { label: "X", ok: !truth, say: "틀려요" }] };
        }
        case "def": return { ...q, prompt: `뜻에 맞는 낱말은?${Q}${esc(w.meaning)}</span>`, options: opts(w.word, pick("word", 3)) };
        case "blank": return { ...q, prompt: `빈칸에 들어갈 낱말은?${Q}${esc(w.sentence)}</span>`, options: opts(w.word, pick("word", 3)) };
        case "mean": return { ...q, prompt: `<b>${esc(w.word)}</b>, 무슨 뜻일까?`, options: opts(w.meaning, pick("meaning", 2)) };
        case "rel": q.hint = chosung(w.rel); return { ...q, prompt: `<b>${esc(w.word)}</b>의 짝꿍 낱말은?`, options: opts(w.rel, pick("rel", 3)) };
        case "ant": q.hint = chosung(w.ant); return { ...q, prompt: `<b>${esc(w.word)}</b>의 반대말은?`, options: opts(w.ant, [...pick("ant", 2), ...pick("rel", 1)]) };
        case "app": return { ...q, prompt: `이야기를 읽고 골라요${Q}${esc(w.app)}</span>`, options: opts(w.word, pick("word", 3)) };
      }
    }

    const OPT_COLORS = ["sea", "tomato", "leaf", "grape"];
    function openQuiz(card) {
      G.activeCard = card; G.attempts = 0; G.hintUsed = false; G.locked = false; G.paused = true;
      input.jx = input.jy = 0;
      const q = card.q = makeQuestion(card);
      $("quizZoneDot").textContent = card.gold ? "★" : "?";

    function showHint(free) {
      if (!G.activeCard) return;
      if (!free) G.hintUsed = true;
      $("quizHintBox").innerHTML = `💡 정답 첫소리 <b>${esc(G.activeCard.q.hint)}</b>`;
      $("quizHintBox").classList.remove("hidden");
      $("quizHintBtn").disabled = true; $("quizHintBtn").style.opacity = .4;
    }
    function closeQuiz(later) {
      hide("quizModal");
      if (G.activeCard) G.activeCard.cool = performance.now() + (later ? 2500 : 1200);
      G.activeCard = null; G.paused = false;
      if (later) notice("준비되면 다시 카드로 가요!");
    }
    function answer(ok, btn) {
      if (G.locked) return;
      const card = G.activeCard, fb = $("quizFeedback");
      fb.classList.remove("hidden");
      if (ok) {
        G.locked = true; sfx("right");
        btn.classList.add("opt-right");
        $("quizOptions").querySelectorAll("button").forEach(b => b.disabled = true);
        const first = G.attempts === 0;
        if (first) G.combo++; else G.combo = 0;
        const base = first ? (G.hintUsed ? 60 : 100) : 40;
        const mult = (card.gold ? 3 : 1) * (G.combo >= 3 ? 2 : 1);
        const pts = base * mult;
        G.score += pts; G.got++; G.stageGot++;
        if (!first || G.hintUsed) G.missed.add(card.word.word);
        G.learned.push({ word: card.word.word, zone: card.zone, mean: card.q.mean });
        fb.style.color = "var(--leaf-d)";
        fb.innerHTML = `딩동댕! +${pts}${mult > 1 ? ` <span class="star-on">×${mult}</span>` : ""}<span class="mean">${esc(card.word.word)} : ${esc(card.q.mean)}</span>`;
        updateHud(true);
        setTimeout(() => { collect(card); closeQuiz(false); }, 1300);
      } else {
        G.attempts++; G.combo = 0; sfx("wrong");
        btn.classList.add("opt-wrong"); btn.disabled = true;
        fb.style.color = "var(--tomato-d)";
        if (G.attempts >= 2 && !card.gold) {
          // 두 번 틀리면 카드가 도망감 → 다른 곳에서 다시 찾기
          G.locked = true;
          fb.textContent = "앗, 카드가 도망갔어요! 다시 찾아봐요";
          G.missed.add(card.word.word);
          setTimeout(() => { card.mesh.position.copy(freeSpot(card.zone)); closeQuiz(false); emote("sad"); notice(`${ZONES[card.zone].name}에서 다시 찾아요!`); }, 1300);
        } else {
          fb.textContent = "다시 골라 볼까?";
          showHint(true);
        }
        updateHud();
        $("quizCard").classList.add("shake"); setTimeout(() => $("quizCard").classList.remove("shake"), 400);
      }
    }
    function collect(card) {
      card.done = true; sfx("get"); if (G.soundOn) { initBgmEngine(); if (!isBgmPlaying) playTrack(-1); }
      const p = card.mesh.position.clone();
      burst(p.clone().add(new THREE.Vector3(0, 1.3, 0)), card.gold ? 0xFFC531 : ZONES[card.zone].hex);
      card.flying = 0;
      // 낱말 도감에 저장
      const book = load().book || {};
      book[card.word.word] = (book[card.word.word] || 0) + 1;
      save({ book });
      emote(card.gold ? "cheer" : G.combo >= 3 ? "dance" : "happy");
      if (G.stageGot >= 10) {
        if (G.stage < 3) {
          setTimeout(() => advanceStage(G.stage + 1), 1200);
        } else {
          setTimeout(() => endGame(true), 1600);
        }
      }
      else notice(G.combo >= 3 ? `${G.combo}연속! 점수 2배!` : "다음 카드를 찾아요!");
    }
    function burst(at, color) {
      for (let i = 0; i < 32; i++) {
        const m = new THREE.Mesh(new THREE.OctahedronGeometry(.12, 0), new THREE.MeshBasicMaterial({ color: i % 3 ? color : 0xFFFFFF }));
        m.position.copy(at); m.userData.v = new THREE.Vector3((Math.random() - .5) * 6, 3 + Math.random() * 4, (Math.random() - .5) * 6); m.userData.life = .9;
        scene.add(m); fx.push(m);
      }
    }

    /* ───────────── HUD ───────────── */
    function updateHud(bump) {
      $("scoreText").textContent = G.score;
      $("cardText").textContent = `${G.stageGot} / 10`;
      const sp = $("stagePillText");
      if (sp) sp.textContent = `스테이지 ${G.stage} / 3`;
      const cb = $("comboBadge");
      if (G.combo >= 2) { cb.textContent = G.combo >= 3 ? `${G.combo}연속 · 점수 2배!` : `${G.combo}연속!`; cb.classList.remove("hidden"); if (bump) { cb.classList.remove("bump"); void cb.offsetWidth; cb.classList.add("bump"); } }
      else cb.classList.add("hidden");
      if (bump) $("scoreText").animate([{ transform: "scale(1.5)" }, { transform: "scale(1)" }], { duration: 400 });
    }
    function drawRadar() {
      const cv = $("radar"), x = cv.getContext("2d"), S = cv.width, k = (S / 2 - 8) / ISLAND_R, c = S / 2;
      x.clearRect(0, 0, S, S);
      x.fillStyle = "#5EC4F5"; x.fillRect(0, 0, S, S);
      x.fillStyle = "#8FD975"; x.beginPath(); x.arc(c, c, ISLAND_R * k, 0, Math.PI * 2); x.fill();
      Object.values(ZONES).forEach(z => { x.fillStyle = z.color + "66"; x.beginPath(); x.arc(c + z.x * k, c + z.z * k, z.r * k, 0, Math.PI * 2); x.fill(); });
      G.cards.forEach(cd => {
        if (cd.done) return;
        const px = c + cd.mesh.position.x * k, pz = c + cd.mesh.position.z * k;
        x.fillStyle = cd.gold ? "#FFC531" : "#fff"; x.strokeStyle = cd.gold ? "#E0A100" : ZONES[cd.zone].color; x.lineWidth = 5;
        x.beginPath(); x.arc(px, pz, cd.gold ? 11 : 8, 0, Math.PI * 2); x.fill(); x.stroke();
      });
      // 나 (보는 방향 삼각형)
      x.save(); x.translate(c + P.pos.x * k, c + P.pos.z * k); x.rotate(-P.face + Math.PI);
      x.fillStyle = "#FF6F59"; x.strokeStyle = "#fff"; x.lineWidth = 4;
      x.beginPath(); x.moveTo(0, -14); x.lineTo(10, 10); x.lineTo(-10, 10); x.closePath(); x.fill(); x.stroke(); x.restore();
    }

    /* ───────────── 조작 ───────────── */
    window.addEventListener("keydown", e => {
      if (isOpen("quizModal")) { const n = parseInt(e.key, 10); const bs = [...$("quizOptions").children]; if (n >= 1 && n <= bs.length && !bs[n - 1].disabled) bs[n - 1].click(); return; }
      if (e.code === "Escape" && G.playing) { isOpen("pauseModal") ? closePause() : openPause(); return; }
      if (e.target && e.target.tagName === "INPUT") return;

    // 왼쪽 엄지 조이스틱: 누른 곳에 나타남
    (function joystick() {
      const zone = $("joyZone"), base = $("joyBase"), knob = $("joyKnob");
      let id = null, cx = 0, cy = 0;
      const R = 56;
      const place = (x, y) => { const r = zone.getBoundingClientRect(); base.style.left = (x - r.left) + "px"; base.style.top = (y - r.top) + "px"; base.style.bottom = "auto"; };
      const reset = () => { id = null; input.jx = input.jy = 0; knob.style.transform = ""; base.style.left = "120px"; base.style.top = "auto"; base.style.bottom = "0"; base.style.transform = "translate(-50%, -60%)"; };
      zone.addEventListener("pointerdown", e => { e.preventDefault(); id = e.pointerId; zone.setPointerCapture(id); cx = e.clientX; cy = e.clientY; base.style.transform = "translate(-50%, -50%)"; place(cx, cy); });
      zone.addEventListener("pointermove", e => {
        if (e.pointerId !== id) return;
        let dx = e.clientX - cx, dy = e.clientY - cy; const d = Math.hypot(dx, dy);
        if (d > R) { dx *= R / d; dy *= R / d; }
        knob.style.transform = `translate(${dx}px, ${dy}px)`;
        input.jx = dx / R; input.jy = -dy / R;
      });
      ["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => zone.addEventListener(ev, e => { if (e.pointerId === id) reset(); }));
      reset();
    })();
    $("jumpBtn").addEventListener("pointerdown", e => { e.preventDefault(); P.jumpQueued = true; });

    // 화면 끌어서 시점 돌리기 (마우스·손가락)
    let isPointerDragging = false;
    (function dragCamera() {
      let id = null, lx = 0, ly = 0;
      const el = $("gameViewport");
      el.addEventListener("pointerdown", e => { id = e.pointerId; lx = e.clientX; ly = e.clientY; isPointerDragging = true; el.setPointerCapture(id); });
      el.addEventListener("pointermove", e => {
        if (e.pointerId !== id) return;
        camYaw -= (e.clientX - lx) * .008; camPitch = Math.max(.2, Math.min(1.1, camPitch + (e.clientY - ly) * .004));
        lx = e.clientX; ly = e.clientY;
      });
      ["pointerup", "pointercancel"].forEach(ev => el.addEventListener(ev, () => { id = null; isPointerDragging = false; }));
      el.addEventListener("wheel", e => { camDist = Math.max(5, Math.min(15, camDist + e.deltaY * .01)); }, { passive: true });
    })();

    /* ───────────── 움직임과 충돌 ───────────── */
    function groundAt(x, z, y) {
      let g = 0;

    }
    function collide(p) {
      for (const c of colliders) {

        const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz), min = c.r + .38;
        if (d < min && d > 0.0001) { p.x = c.x + dx / d * min; p.z = c.z + dz / d * min; }

        if (p.y >= b.top - .45) continue;

            const opts = [[b.minx - .38 - p.x, 0], [b.maxx + .38 - p.x, 0], [0, b.minz - .38 - p.z], [0, b.maxz + .38 - p.z]].sort((a, c) => Math.hypot(...a) - Math.hypot(...c));
            p.x += opts[0][0]; p.z += opts[0][1];

      }
      const r = Math.hypot(p.x, p.z);
      if (r > ISLAND_R - 1) { p.x *= (ISLAND_R - 1) / r; p.z *= (ISLAND_R - 1) / r; }
    }

    function updatePlayer(dt) {
      let ix = input.jx, iy = input.jy;
      const k = input.keys;
      if (k.KeyW || k.ArrowUp) iy += 1; if (k.KeyS || k.ArrowDown) iy -= 1;
      if (k.KeyA || k.ArrowLeft) ix -= 1; if (k.KeyD || k.ArrowRight) ix += 1;

      if (len > 1) { ix /= len; iy /= len; }
      const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
      const mx = fx * iy + rx * ix, mz = fz * iy + rz * ix;
      const dLake = Math.hypot(P.pos.x - ZONES.village.x, P.pos.z - ZONES.village.z); const dPlaza = Math.hypot(P.pos.x - ZONES.plaza.x, P.pos.z - ZONES.plaza.z); const inFountain = (G.stage === 1) && dPlaza < 3.4;
      P.inWater = (dLake < 8.2 && (G.stage === 1 || G.stage === 3)) || inFountain;
      const speed = P.inWater ? 4.8 : 6.5;
      P.moving = Math.hypot(mx, mz) > .08;
      P.pos.x += mx * speed * dt; P.pos.z += mz * speed * dt;
      if (P.moving) {
        const target = Math.atan2(mx, mz);
        let d = target - P.face; d = Math.atan2(Math.sin(d), Math.cos(d));
        P.face += d * Math.min(1, dt * 12);
      }
      if (P.inWater) {
        if (P.jumpQueued) { P.vy = 7.5; sfx("jump"); waterRipple(P.pos); puff(P.pos, 4); }
        P.jumpQueued = false;
        if (P.vy > 0) { P.vy -= 22 * dt; P.pos.y += P.vy * dt; P.onGround = false; }
        else { P.pos.y = (inFountain ? 0.48 : -0.28) + Math.sin(clock.elapsedTime * 3.5) * 0.04; P.vy = 0; P.onGround = true; }
        collide(P.pos);
        waterTimer += dt;
        if (P.moving && waterTimer > 0.2) { waterTimer = 0; waterRipple(P.pos); }
      } else {
        if (P.jumpQueued && P.onGround) { P.vy = 8.6; P.onGround = false; sfx("jump"); }
      P.jumpQueued = false;
      P.vy -= 22 * dt;
      P.pos.y += P.vy * dt;
      collide(P.pos);
      const g = groundAt(P.pos.x, P.pos.z, P.pos.y);
      if (P.pos.y <= g) { P.pos.y = g; P.vy = 0; P.onGround = true; } else P.onGround = P.pos.y - g < .02;

      // 착지하면 몸이 찌그러졌다 펴지고 먼지가 남
      if (P.onGround && !P.wasGround && P.lastVy < -5) { hero.userData.squash = .22; puff(P.pos, 5); }
      P.wasGround = P.onGround; P.lastVy = P.vy;
      dustTimer += dt;
      if (P.moving && P.onGround && dustTimer > .2) { dustTimer = 0; puff(P.pos, 1); }
      }
      animateHero(dt);
    }

    /* ───────────── 캐릭터 동작과 감정표현 ───────────── */
    const EMOTES = {
      wave: { emoji: "👋", face: "happy", dur: 2.2, label: "안녕" },
      happy: { emoji: "😄", face: "happy", dur: 1.8, label: "신나" },
      dance: { emoji: "🎵", face: "happy", dur: 3.2, label: "춤" },
      cheer: { emoji: "🎉", face: "happy", dur: 1.7, label: "만세" },
      sad: { emoji: "😢", face: "sad", dur: 2.2, label: "슬퍼" },
      wow: { emoji: "😮", face: "oh", dur: 1.7, label: "우와" }
    };
    let bubble = null;
    function bubbleSprite(emoji) {
      const c = document.createElement("canvas"); c.width = c.height = 256;
      const x = c.getContext("2d");
      x.fillStyle = "#fff"; roundRect(x, 20, 16, 216, 190, 60); x.fill();
      x.beginPath(); x.moveTo(108, 200); x.lineTo(128, 244); x.lineTo(150, 200); x.fill();
      x.font = "130px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText(emoji, 128, 116);
      const tex = setSRGB(new THREE.CanvasTexture(c));
      if (!bubble) { bubble = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true })); bubble.scale.set(1.1, 1.1, 1); bubble.renderOrder = 999; scene.add(bubble); }
      else { bubble.material.map.dispose(); bubble.material.map = tex; bubble.material.needsUpdate = true; }
      bubble.visible = true; bubble.userData.t = 0;
    }
    function emote(type) {
      if (!hero || !EMOTES[type]) return;
      const E = EMOTES[type];
      hero.userData.emote = { type, t: 0 };
      setFace(hero, E.face);
      bubbleSprite(E.emoji);
      if (type === "cheer") burst(P.pos.clone().add(new THREE.Vector3(0, 1.6, 0)), 0xFFC531);
      if (type === "sad") sfx("escape"); else sfx("tap");
      closeEmoteMenu();
    }
    function animateHero(dt) {
      const U = hero.userData, t = clock.elapsedTime;
      hero.position.copy(P.pos); hero.rotation.y = P.face;
      const walk = P.moving && P.onGround && !P.inWater, ph = t * 12;
      let rigY = walk ? Math.abs(Math.sin(ph)) * .07 : Math.sin(t * 2.2) * .012;
      let rigRot = 0, rigZ = walk ? Math.sin(ph) * .05 : 0, headX = 0, headZ = 0;
      let lx = walk ? Math.sin(ph) * .7 : 0, rx = walk ? -Math.sin(ph) * .7 : 0, lz = -.25, rz = .25;
      if (!P.onGround && !P.inWater) { lz = -1.1; rz = 1.1; }
      U.feet.forEach((f, i) => { f.position.z = .04 + (walk ? Math.sin(ph + i * Math.PI) * .12 : 0); f.position.y = .07 + (walk ? Math.max(0, Math.sin(ph + i * Math.PI)) * .06 : 0); });
      if (P.inWater) {
        const swim = P.moving, sph = t * 10;
        if (swim) {
          U.rig.rotation.x = Math.PI * 0.35; headX = -0.42;
          lx = Math.sin(sph) * 1.3 - 0.3; rx = -Math.sin(sph) * 1.3 - 0.3; lz = -0.65; rz = 0.65;
          U.feet[0].position.z = -0.22 + Math.sin(sph) * 0.14; U.feet[1].position.z = -0.22 - Math.sin(sph) * 0.14;
          U.feet[0].position.y = 0.12 + Math.cos(sph) * 0.08; U.feet[1].position.y = 0.12 - Math.cos(sph) * 0.08;
        } else {
          U.rig.rotation.x = 0.08; headX = 0;
          lx = Math.sin(t * 3.5) * 0.35; rx = -Math.sin(t * 3.5) * 0.35;
          lz = -0.75 - Math.sin(t * 3.5) * 0.15; rz = 0.75 + Math.sin(t * 3.5) * 0.15;
          U.feet[0].position.y = 0.05 + Math.sin(t * 3.5) * 0.05; U.feet[1].position.y = 0.05 - Math.sin(t * 3.5) * 0.05;
        }
      } else {
        U.rig.rotation.x = 0;
      }
      const e = U.emote;
      if (e) {
        e.t += dt; const k = e.t;
        if (e.type === "wave") { rz = 2.6 + Math.sin(k * 14) * .35; headZ = .12; }
        if (e.type === "happy") { rigY += Math.abs(Math.sin(k * 9)) * .35; lz = -2.4; rz = 2.4; }
        if (e.type === "dance") { rigRot = Math.sin(k * 6) * .7; rigY += Math.abs(Math.sin(k * 12)) * .1; lz = -1.2 - Math.sin(k * 12) * .9; rz = 1.2 + Math.sin(k * 12) * .9; headZ = Math.sin(k * 6) * .22; }
        if (e.type === "cheer") { const u = Math.min(k / .8, 1); rigY += Math.sin(u * Math.PI) * 1.1; rigRot = u * Math.PI * 2; lz = -2.7; rz = 2.7; }
        if (e.type === "sad") { headX = .38; lz = -.08; rz = .08; rigY -= .03; }
        if (e.type === "wow") { rigY += k < .3 ? Math.sin(k / .3 * Math.PI) * .3 : 0; lz = -1.7; rz = 1.7; headX = -.15; }
        if (k > EMOTES[e.type].dur) { U.emote = null; setFace(hero, "smile"); if (bubble) bubble.visible = false; }
      }
      U.squash = Math.max(0, (U.squash || 0) - dt * 1.2);
      const sq = Math.sin(U.squash / .22 * Math.PI) * U.squash;
      U.rig.scale.set(1 + sq * .6, 1 - sq * 1.2, 1 + sq * .6);
      U.rig.position.y = rigY; U.rig.rotation.y = rigRot; U.rig.rotation.z = rigZ;
      U.arms[0].rotation.set(lx, 0, lz); U.arms[1].rotation.set(rx, 0, rz);
      U.head.rotation.set(headX, 0, headZ);
      if (U.tip) U.tip.material.emissiveIntensity = Math.sin(t * 4) > 0 ? .9 : .2;
      if (U.tail) {

        }
      }

    }
    function waterRipple(at) {
      const geo = new THREE.RingGeometry(0.18, 0.28, 24);

      const r = new THREE.Mesh(geo, mat);
      r.rotation.x = -Math.PI / 2;
      r.position.set(at.x, 0.06, at.z);
