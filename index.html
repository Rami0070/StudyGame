      nose.position.set(0, -0.01, 0.28);
      headG.add(nose);

      // 둥근 귓바퀴
      const ears = [-0.18, 0.18].map(ex => {
        const ear = new THREE.Group();
        ear.position.set(ex, 0.22, -0.02);
        const outer = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 8), furMat);
        outer.scale.set(1, 1, 0.45);
        ear.add(outer);
        const inner = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), pinkMat);
        inner.scale.set(1, 1, 0.35);
        inner.position.z = 0.02;
        ear.add(inner);
        headG.add(ear);
        return ear;
      });

      // 앞발이 쥐고 있는 해바라기씨
      const seed = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), std(0x451A03, { roughness: 0.7 }));
      seed.scale.set(0.65, 1.3, 0.5);
      seed.rotation.x = 0.4;
      seed.position.set(0, 0.26, 0.56);
      rig.add(seed);

      // 앙증맞은 4개의 핑크 발
      const paws = [
        [-0.12, 0.42], [0.12, 0.42],
        [-0.16, -0.22], [0.16, -0.22]
      ].map(([px, pz]) => {
        const paw = new THREE.Mesh(new THREE.SphereGeometry(0.065, 10, 8), pinkMat);
        paw.position.set(px, 0.06, pz);
        paw.scale.set(1, 0.65, 1.2);
        paw.castShadow = true;
        rig.add(paw);
        return paw;
      });

      // 둥근 솜뭉치 꼬리
      const tail = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), bellyMat);
      tail.position.set(0, 0.28, -0.46);
      rig.add(tail);

      return {
        mesh: g,
        anim(dt, t, walker) {
          const ph = t * 24.0;
          paws[0].position.z = 0.42 + Math.sin(ph) * 0.08;
          paws[1].position.z = 0.42 - Math.sin(ph) * 0.08;
          paws[2].position.z = -0.22 - Math.sin(ph) * 0.08;
          paws[3].position.z = -0.22 + Math.sin(ph) * 0.08;

          rig.position.y = Math.abs(Math.sin(ph)) * 0.05;
          rig.rotation.z = Math.sin(ph * 0.5) * 0.07;
          headG.rotation.y = Math.sin(t * 7) * 0.12;
          nose.position.y = -0.01 + Math.sin(t * 18) * 0.015;
          ears[0].rotation.z = Math.sin(t * 12) * 0.15;
          ears[1].rotation.z = -Math.sin(t * 12) * 0.15;
        }
      };
    }

    // (4) 개성 있는 외형을 지닌 6명의 귀여운 치비 아동 (부드러운 곡선 헤어/모자/의상)
    function createRunningChild(cfg) {
      const childScale = 0.98; // 주인공과 호환되는 귀여운 치비 어린이 비율 (0.7배 조절)
      const skinColor = cfg.skin || 0xFFDFC4;
      const shirtColor = cfg.shirtColor || 0xFACC15;
      const bottomColor = cfg.bottomColor || 0x1D4ED8;
      const shoeColor = cfg.shoeColor || 0xDC2626;

      let hairDynamic = null;

      return buildChibiHuman({
        scale: childScale,
        skinColor,
        clothesColor: shirtColor,
        shoeColor,
        torsoMat: std(shirtColor, { roughness: 0.6 }),
        bottomMat: std(bottomColor, { roughness: 0.6 }),
        sleeveMat: std(shirtColor, { roughness: 0.6 }),
        buildOutfit(bodyG, rig, parts) {
          if (cfg.bottomType === 'skirt') {
            const skirt = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.36, 0.22, 18), std(bottomColor, { roughness: 0.6 }));
            skirt.position.y = 0.22;
            skirt.castShadow = true;
            bodyG.add(skirt);
          } else if (cfg.bottomType === 'overalls') {
            [-0.08, 0.08].forEach(sx => {
              const strap = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.38, 8), std(bottomColor));
              strap.position.set(sx, 0.40, 0.04);
              bodyG.add(strap);

              const btn = new THREE.Mesh(new THREE.SphereGeometry(0.028, 8, 8), std(0xFDE047));
              btn.position.set(sx, 0.32, 0.28);
              bodyG.add(btn);
            });
          }
        },
        buildHair(headG, parts) {
          const hairMat = std(cfg.hairColor || 0x1F2937, { roughness: 0.8 });

          if (cfg.hairStyle === 'backwardCap') {
            // 뒤집어쓴 둥근 캡모자 (부드러운 구체 돔 + 뒤통수의 둥근 챙 곡면)
            const cap = new THREE.Mesh(new THREE.SphereGeometry(0.405, 20, 16, 0, Math.PI * 2, 0, Math.PI / 2), std(0xDC2626));
            cap.position.set(0, 0.04, 0);
            headG.add(cap);

            const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.04, 20, 1, false, Math.PI * 0.7, Math.PI * 0.6), std(0xDC2626));
            brim.position.set(0, 0.04, -0.12);
            brim.rotation.x = -0.15;
            headG.add(brim);

          } else if (cfg.hairStyle === 'pigtails') {
            // 양갈래 둥근 방울 머리
            const hairBase = new THREE.Mesh(new THREE.SphereGeometry(0.405, 20, 16), hairMat);
            hairBase.position.set(0, 0.02, -0.02);
            headG.add(hairBase);

            const pigtails = [-0.28, 0.28].map(px => {
              const pg = new THREE.Group();
              pg.position.set(px, 0.12, -0.10);

              const tie = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), std(0xEC4899));
              pg.add(tie);

              const bun = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 10), hairMat);
              bun.scale.set(0.9, 1.4, 0.9);
              bun.position.set(px > 0 ? 0.06 : -0.06, -0.10, 0);
              pg.add(bun);

              headG.add(pg);
              return pg;
            });

            hairDynamic = (t) => {
              pigtails[0].rotation.z = Math.sin(t * 14) * 0.3;
              pigtails[1].rotation.z = -Math.sin(t * 14) * 0.3;
            };

          } else if (cfg.hairStyle === 'messyCurls') {
            // 몽실몽실 귀여운 곱슬머리 구체 클러스터
            const hairBase = new THREE.Mesh(new THREE.SphereGeometry(0.405, 20, 16), hairMat);
            hairBase.position.set(0, 0.02, -0.02);
            headG.add(hairBase);

            for (let i = 0; i < 7; i++) {
              const curl = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), hairMat);
              const a = (i / 7) * Math.PI * 1.5 - 0.7;
              curl.position.set(Math.sin(a) * 0.32, 0.28, Math.cos(a) * 0.22);
              headG.add(curl);
            }

          } else if (cfg.hairStyle === 'bobHeadband') {
            // 단발머리와 산뜻한 머리띠
            const hairBase = new THREE.Mesh(new THREE.SphereGeometry(0.405, 20, 16), hairMat);
            hairBase.position.set(0, 0.02, -0.02);
            headG.add(hairBase);

            const hband = new THREE.Mesh(new THREE.TorusGeometry(0.39, 0.035, 8, 20, Math.PI), std(0xFACC15));
            hband.rotation.x = -Math.PI / 2 + 0.2;
            hband.position.set(0, 0.12, 0.04);
            headG.add(hband);

          } else if (cfg.hairStyle === 'visorCap') {
            // 스포티한 썬캡 바이저
            const hband = new THREE.Mesh(new THREE.TorusGeometry(0.39, 0.045, 8, 20), std(0x0284C7));
            hband.rotation.x = Math.PI / 2;
            hband.position.set(0, 0.08, 0);
            headG.add(hband);

            const visor = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.04, 20, 1, false, -Math.PI * 0.3, Math.PI * 0.6), std(0x0284C7));
            visor.position.set(0, 0.10, 0.12);
            visor.rotation.x = 0.2;
            headG.add(visor);

          } else if (cfg.hairStyle === 'ponytail') {
            // 높게 묶은 곡선 포니테일
            const hairBase = new THREE.Mesh(new THREE.SphereGeometry(0.405, 20, 16), hairMat);
            hairBase.position.set(0, 0.02, -0.02);
            headG.add(hairBase);

            const ptG = new THREE.Group();
            ptG.position.set(0, 0.28, -0.32);

            const rib = new THREE.Mesh(new THREE.SphereGeometry(0.065, 8, 8), std(0xEF4444));
            ptG.add(rib);

            const tail = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 10), hairMat);
            tail.scale.set(0.8, 1.8, 0.8);
            tail.position.set(0, -0.16, -0.08);
            tail.rotation.x = -0.5;
            ptG.add(tail);

            headG.add(ptG);

            hairDynamic = (t) => {
              ptG.rotation.y = Math.sin(t * 14) * 0.4;
              ptG.rotation.x = Math.sin(t * 18) * 0.2;
            };
          }
        },
        buildProps(armL, armR, bodyG, parts) {
          if (cfg.accessory === 'paperPlane') {
            // 손에 쥔 부드러운 종이비행기
            const plane = new THREE.Mesh(new THREE.ConeGeometry(0.10, 0.30, 3), std(0x38BDF8));
            plane.scale.set(1.4, 0.25, 1.2);
            plane.rotation.x = Math.PI / 2;
            plane.position.set(0.04, -0.34, 0.16);
            armR.add(plane);
          } else if (cfg.accessory === 'starPouch') {
            // 귀여운 별모양 크로스백 (옥타헤드론 둥근 별 + 크로스 끈)
            const starPouch = new THREE.Mesh(new THREE.OctahedronGeometry(0.09, 1), std(0xFBBF24));
            starPouch.scale.set(1, 1, 0.5);
            starPouch.position.set(0.18, 0.28, 0.24);
            bodyG.add(starPouch);

            const strap = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.016, 6, 20), std(0xFDE047));
            strap.rotation.y = 0.5;
            strap.rotation.x = 0.85;
            strap.position.set(0, 0.45, 0);
            bodyG.add(strap);
          }
        },
        customAnim(dt, t, walker, parts) {
          if (hairDynamic) hairDynamic(t);
        }
      });
    }

    // (5) 장바구니를 든 주부 (전통 오벌 라탄 바구니 & 풍성한 식재료 / 현대적 에코 토트백)
    function createHomemaker(type = 0) {
      const skinColor = 0xFFDFC4;
      const cardiganColor = type === 0 ? 0xEA580C : 0xE2E8F0;
      const skirtColor = type === 0 ? 0x334155 : 0xDB2777;
      const shoeColor = 0x57534E;

      return buildChibiHuman({
        scale: 1.05,
        skinColor,
        clothesColor: cardiganColor,
        shoeColor,
        torsoMat: std(cardiganColor, { roughness: 0.6 }),
        bottomMat: std(skirtColor, { roughness: 0.6 }),
        sleeveMat: std(cardiganColor, { roughness: 0.6 }),
        buildOutfit(bodyG, rig, parts) {
          // 플레어 롱스커트
          const skirt = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.36, 0.30, 18), std(skirtColor, { roughness: 0.65 }));
          skirt.position.y = 0.24;
          skirt.castShadow = true;
          bodyG.add(skirt);

        buildHair(headG, parts) {

          hairBase.position.set(0, 0.02, -0.02);

          if (type === 0) {
            // 올림머리 번
            const bun = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 10), hairMat);
            bun.position.set(0, 0.28, -0.24);
            headG.add(bun);
          } else {
            // 골드 헤어핀을 꽂은 웨이브 단발
            const clip = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), std(0xF59E0B, { metalness: 0.8 }));

        buildProps(armL, armR, bodyG, parts) {
          if (type === 0) {
            // 오벌 라탄 장바구니 & 식재료 (바게트, 채소, 당근, 사과)
            const bskG = new THREE.Group();
            bskG.position.set(0.06, -0.32, 0.06);

            const bsk = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.13, 0.22, 18), std(0xB45309, { roughness: 0.8 }));
            bsk.scale.set(1.25, 1, 0.85);
            bsk.castShadow = true;
            bskG.add(bsk);

            const handle = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.016, 6, 16, Math.PI), std(0x78350F));
            handle.rotation.x = Math.PI;
            handle.position.y = 0.12;
            bskG.add(handle);

            // 프랑스 바게트빵
            const bagt = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.38, 10), std(0xD97706));
            bagt.rotation.z = 0.35;
            bagt.position.set(-0.02, 0.18, -0.04);
            bskG.add(bagt);
            const bagtTip = new THREE.Mesh(new THREE.SphereGeometry(0.038, 8, 8), std(0xD97706));
            bagtTip.position.set(-0.08, 0.32, -0.04);
            bskG.add(bagtTip);

            // 주황 당근
            const crt = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.20, 8), std(0xEA580C));
            crt.position.set(-0.05, 0.14, 0.05);
            bskG.add(crt);

            // 싱싱한 대파/채소
            const leek = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.28, 8), std(0x16A34A));
            leek.rotation.z = -0.25;
            leek.position.set(0.05, 0.16, 0.05);
            bskG.add(leek);

            // 빨간 사과
            const apl = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), std(0xDC2626));
            apl.position.set(0.04, 0.13, -0.05);
            bskG.add(apl);

            armR.add(bskG);
          } else {
            // 친환경 에코 토트백
            const toteG = new THREE.Group();
            toteG.position.set(0.06, -0.32, 0.04);

            const tote = new THREE.Mesh(new THREE.SphereGeometry(0.18, 14, 12), std(0x10B981, { roughness: 0.6 }));
            tote.scale.set(0.75, 1.2, 0.95);
            tote.castShadow = true;
            toteG.add(tote);

            const strap = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.016, 6, 16, Math.PI), std(0x065F46));
            strap.rotation.x = Math.PI;
            strap.position.y = 0.18;
            toteG.add(strap);

            const milk = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.18, 8), std(0x38BDF8));
            milk.position.set(0, 0.15, 0);
            toteG.add(milk);

            armR.add(toteG);
          }
        }
      });
    }

    // (6) 자전거를 탄 치비 마스코트 (스케일 1.45, 부드러운 튜빙 자전거, 회전 바퀴 & 페달링, 뱅킹)
    function createBicycleRider(bikeColorHex = 0x0284C7, riderType = 0) {
      const g = new THREE.Group();
      g.scale.set(1.05, 1.05, 1.05); // 영웅과 완벽 일치하는 크기! (0.7배 조절)

      const frameMat = std(bikeColorHex, { metalness: 0.35, roughness: 0.45 });
      const tireMat = std(0x18181B, { roughness: 0.9 });
      const spokeMat = std(0xCBD5E1, { metalness: 0.8, roughness: 0.2 });

      // 둥근 휠 세트 (YZ 평면 정렬 및 X축 기준 자연스러운 전진 회전)
      const makeWheel = () => {
        const wg = new THREE.Group();
        const planeG = new THREE.Group();
        planeG.rotation.y = Math.PI / 2; // 자전거 진행 방향(YZ 평면)으로 휠 정렬
        wg.add(planeG);

        const tire = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.04, 12, 28), tireMat);
        tire.castShadow = true;
        planeG.add(tire);

        const rim = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.016, 8, 28), spokeMat);
        planeG.add(rim);

        for (let i = 0; i < 4; i++) {
          const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.64, 6), spokeMat);
          sp.rotation.z = (i * Math.PI) / 4;
          planeG.add(sp);
        }
        const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.08, 10), spokeMat);
        hub.rotation.x = Math.PI / 2;
        planeG.add(hub);
        return wg;
      };

      const wheelF = makeWheel(); wheelF.position.set(0, 0.36, 0.54); g.add(wheelF);
      const wheelR = makeWheel(); wheelR.position.set(0, 0.36, -0.54); g.add(wheelR);

      // 매끄러운 원통형 프레임 튜빙
      const tubeMat = frameMat;
      const makeTube = (len, rotX, px, py, pz) => {
        const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, len, 10), tubeMat);
        tube.rotation.x = rotX;
        tube.position.set(px, py, pz);
        tube.castShadow = true;
        g.add(tube);
        return tube;
      };
      makeTube(0.42, 0.14, 0, 0.56, -0.09);
      makeTube(0.66, -0.82, 0, 0.59, 0.18);
      makeTube(0.53, -1.42, 0, 0.78, 0.16);
      makeTube(0.48, -1.57, 0, 0.36, -0.30);
      makeTube(0.58, -0.62, 0, 0.56, -0.33);
      makeTube(0.48, 0.28, 0, 0.59, 0.48);

      // 스템 & 아치형 부드러운 핸들바
      const hbStem = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.14, 8), spokeMat);
      hbStem.position.set(0, 0.88, 0.42); g.add(hbStem);

      const hbBar = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.02, 8, 16, Math.PI * 0.7), std(0x374151));
      hbBar.rotation.x = Math.PI / 2 + 0.2;
      hbBar.position.set(0, 0.94, 0.46);
      g.add(hbBar);

      // 통학/생활형 자전거 앞 바구니
      if (riderType === 1) {
        const basket = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.15, 0.16, 16), std(0xCBD5E1, { metalness: 0.6 }));
        basket.scale.set(1.2, 1, 0.85);
        basket.position.set(0, 0.88, 0.60);
        g.add(basket);
      }

      // 유선형 안장 (사각 박스가 아닌 둥근 가죽 안장)
      const saddle = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 10), std(0x111827));
      saddle.scale.set(0.75, 0.35, 1.4);
      saddle.position.set(0, 0.76, -0.12);
      saddle.castShadow = true;
      g.add(saddle);

      // 회전하는 크랭크 & 페달 & 치비 발
      const crankG = new THREE.Group();
      crankG.position.set(0, 0.36, -0.06);

      const crankAxle = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.22, 8), spokeMat);
      crankAxle.rotation.z = Math.PI / 2;
      crankG.add(crankAxle);

      // 좌우 크랭크 암 & 페달
      const pedalParts = [-1, 1].map(s => {
        const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.16, 8), spokeMat);
        arm.position.set(0.11 * s, 0.08 * s, 0);
        crankG.add(arm);

        const pedalG = new THREE.Group();
        pedalG.position.set(0.13 * s, 0.16 * s, 0);

        const pedal = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), std(0x18181B));
        pedal.scale.set(1.2, 0.4, 0.8);
        pedalG.add(pedal);

        // 페달에 얹힌 귀여운 치비 신발
        const riderShoe = new THREE.Mesh(new THREE.SphereGeometry(0.065, 10, 8), std(0x18181B));
        riderShoe.scale.set(0.9, 0.65, 1.25);
        riderShoe.position.set(0, 0.05, 0.02);
        pedalG.add(riderShoe);

        crankG.add(pedalG);
        return { arm, pedalG, s };
      });
      g.add(crankG);

      // 안장에 탄 귀여운 치비 라이더 (영웅 비율)
      const cyclist = new THREE.Group();
      cyclist.position.set(0, 0.74, -0.10);

      const skinMat = std(0xFFDFC4, { roughness: 0.98, metalness: 0.0 });
      const jerseyColor = riderType === 0 ? 0xFACC15 : 0x10B981;
      const jerseyMat = std(jerseyColor);

      // 통통한 유선형 저지 상체 (앞으로 가볍게 기울임)
      const cTorso = new THREE.Mesh(new THREE.CylinderGeometry(0.20, 0.26, 0.40, 18), jerseyMat);
      cTorso.rotation.x = 0.32;
      cTorso.position.set(0, 0.24, 0.08);
      cTorso.castShadow = true;
      cyclist.add(cTorso);

      const cBottomCap = new THREE.Mesh(new THREE.SphereGeometry(0.26, 16, 10), std(0x1E293B));
      cBottomCap.scale.set(1, 0.65, 1);
      cBottomCap.position.set(0, 0.12, 0.02);
      cyclist.add(cBottomCap);

      // 대두 치비 머리
      const cHeadG = new THREE.Group();
      cHeadG.position.set(0, 0.52, 0.18);
      cyclist.add(cHeadG);

      const cHead = new THREE.Mesh(new THREE.SphereGeometry(0.35, 24, 20), skinMat);
      cHead.castShadow = true;
      cHeadG.add(cHead);

      // 반짝이는 눈 & 볼
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111827 });
      const shineMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
      [-0.11, 0.11].forEach(ex => {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.04, 10, 10), eyeMat);
        eye.scale.set(1, 1.25, 0.6);
        eye.position.set(ex, 0.02, 0.32);
        cHeadG.add(eye);

        const shine = new THREE.Mesh(new THREE.SphereGeometry(0.014, 6, 6), shineMat);
        shine.position.set(ex + 0.012, 0.04, 0.34);
        cHeadG.add(shine);

        const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), std(0xFCA5A5, { roughness: 0.98, metalness: 0.0 }));
        cheek.scale.set(1.2, 0.5, 0.4);
        cheek.position.set(ex * 1.3, -0.07, 0.30);
        cHeadG.add(cheek);
      });

      // 유선형 헬멧
      const helmetColor = riderType === 0 ? 0x2563EB : 0x38BDF8;
      const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.365, 20, 16), std(helmetColor, { roughness: 0.4 }));
      helmet.scale.set(0.96, 0.85, 1.22);
      helmet.position.set(0, 0.10, -0.02);
      cHeadG.add(helmet);

      // 핸들바를 잡은 귀여운 둥근 양팔
      [-0.24, 0.24].forEach(ax => {
        const armG = new THREE.Group();
        armG.position.set(ax, 0.36, 0.14);

        const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.06, 0.32, 10), jerseyMat);
        sleeve.rotation.x = 0.85;
        sleeve.rotation.y = ax > 0 ? -0.2 : 0.2;
        sleeve.position.set(0, -0.10, 0.12);
        armG.add(sleeve);

        const hand = new THREE.Mesh(new THREE.SphereGeometry(0.065, 8, 8), skinMat);
        hand.position.set(ax > 0 ? -0.03 : 0.03, -0.22, 0.28);
        armG.add(hand);

        cyclist.add(armG);
      });

      g.add(cyclist);

      let prevRotY = g.rotation.y;

      return {
        mesh: g,
        anim(dt, t, walker) {
          const rollDist = walker.speed * dt;
          const rollAngle = rollDist / 0.36;
          wheelF.rotation.x += rollAngle;
          wheelR.rotation.x += rollAngle;
          crankG.rotation.x += rollAngle;

          // 페달 수평 유지 회전 (라이더 발이 페달 위에서 항상 자연스럽게 유지됨)
          pedalParts[0].pedalG.rotation.x = -crankG.rotation.x;
          pedalParts[1].pedalG.rotation.x = -crankG.rotation.x;

          // 회전 시 바이크 뱅킹(기울어짐)
          let diffY = g.rotation.y - prevRotY;
          while (diffY < -Math.PI) diffY += Math.PI * 2;
          while (diffY > Math.PI) diffY -= Math.PI * 2;
          prevRotY = g.rotation.y;
          const targetRoll = -diffY / (dt + 0.001) * 0.08;
          g.rotation.z += (THREE.MathUtils.clamp(targetRoll, -0.28, 0.28) - g.rotation.z) * Math.min(1, dt * 6);
        }
      };
    }

    function createClockTexture(size = 256) {
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const ctx = c.getContext("2d");
      const half = size / 2;
      const rad = half - 10;

      // 외곽 황금 테두리
      ctx.fillStyle = "#F59E0B";
      ctx.beginPath();
      ctx.arc(half, half, half - 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#D97706";
      ctx.beginPath();
      ctx.arc(half, half, half - 6, 0, Math.PI * 2);
      ctx.fill();

      // 문자반 (크림 아이보리)
      ctx.fillStyle = "#FFFBEB";
      ctx.beginPath();
      ctx.arc(half, half, rad, 0, Math.PI * 2);
      ctx.fill();

      // 분 및 시 눈금
      ctx.strokeStyle = "#1E293B";
      ctx.fillStyle = "#1E293B";
      for (let i = 0; i < 60; i++) {
        const angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
        const isMajor = i % 5 === 0;
        const inner = rad - (isMajor ? 18 : 8);
        const outer = rad - 4;
        ctx.lineWidth = isMajor ? 5 : 2;
        ctx.beginPath();
        ctx.moveTo(half + Math.cos(angle) * inner, half + Math.sin(angle) * inner);
        ctx.lineTo(half + Math.cos(angle) * outer, half + Math.sin(angle) * outer);
        ctx.stroke();
      }

      // 로마 숫자 표시 (XII, III, VI, IX)
      const numerals = ["XII", "III", "VI", "IX"];
      ctx.font = `bold ${Math.round(size * 0.11)}px system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      [0, 3, 6, 9].forEach((h, idx) => {
        const angle = (h / 12) * Math.PI * 2 - Math.PI / 2;
        const numR = rad - 32;
        ctx.fillText(numerals[idx], half + Math.cos(angle) * numR, half + Math.sin(angle) * numR);
      });

      // 시계 바늘 (10시 10분 배치)
      // 시침
      const hAngle = (10 / 12 + 10 / 720) * Math.PI * 2 - Math.PI / 2;
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.strokeStyle = "#0F172A";
      ctx.beginPath();
      ctx.moveTo(half, half);
      ctx.lineTo(half + Math.cos(hAngle) * (rad * 0.52), half + Math.sin(hAngle) * (rad * 0.52));
      ctx.stroke();

      // 분침
      const mAngle = (10 / 60) * Math.PI * 2 - Math.PI / 2;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(half, half);
      ctx.lineTo(half + Math.cos(mAngle) * (rad * 0.76), half + Math.sin(mAngle) * (rad * 0.76));
      ctx.stroke();

      // 중심 황금 캡
      ctx.fillStyle = "#F59E0B";
      ctx.beginPath();
      ctx.arc(half, half, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#78350F";
      ctx.lineWidth = 2;
      ctx.stroke();

      return setSRGB(new THREE.CanvasTexture(c));
    }

      const villageHouses = [

      const flagPaletteCols = [

      // 점프 놀이터: X자 형태 대칭 단차 발판 (중앙 정점 + 4개 대각선 방향 오르막/내리막 총 13개)

      // ──────── 4. 스테이지 1 애니메이션 사물, 동물, 인물 배치 ────────

      const makeBunny = (bx, bz, furHex, rotY = 0, hopOffset = 0) => {

        head.position.set(0, 0.38, 0.22); head.castShadow = true; bg.add(head);

          bg.add(eg);
          return eg;

        const tail = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), std(0xFFFFFF));

        stage1Animators.push((dt, t) => {
          const cycle = (t * 2.8 + hopOffset) % (Math.PI * 2);
          const hop = cycle < Math.PI ? Math.sin(cycle) : 0;
          bg.position.y = hop * 0.35;
          bg.rotation.x = hop > 0.01 ? -Math.cos(cycle) * 0.2 : 0;
          ears[0].rotation.x = -0.1 + (hop > 0.01 ? 0.3 : 0);
          ears[1].rotation.x = -0.1 + (hop > 0.01 ? 0.3 : 0);
        });
      };
      makeBunny(V.x - 7.5, V.z + 1.5, 0xFFFFFF, 0.8, 0);     // 흰 토끼

    function buildStage2(V, Z, K) {

      // ──────── 1. 학교 캠퍼스 본관 & 체육관 & 야외 수돗가 (진한 원색 팔레트) ────────

      const clockCanvas = document.createElement("canvas");

    function buildStage3(V, Z, K) {

      // ──────── 1. 놀이터 호수 & 귀여운 오리배 3척 & 무지개 분수 (스테이지 3 밝은 색감 반영) ────────

      // ──────── 4. 스테이지 3 애니메이션 사물, 동물, 장난감 배치 ────────
      // (1) 두둥실 흔들리는 풍선 다발
      const makeBalloonCluster = (bx, bz, offset = 0) => {
        const bg = new THREE.Group();

    function buildVillageLake(V) {
      const lakeShore = new THREE.Mesh(new THREE.CircleGeometry(9.4, 48), stdPalette(0xF0DFC0, 0xFFF3D6, 0x475569));
      lakeShore.rotation.x = -Math.PI / 2; lakeShore.position.set(V.x, 0.02, V.z);
      lakeShore.receiveShadow = true; scene.add(lakeShore);

      const lakeWater = new THREE.Mesh(new THREE.CircleGeometry(8.4, 48), stdPalette(0x00B4D8, 0x90E0EF, 0x1E293B, {
        roughness: .12, metalness: .15, transparent: true, opacity: .88
      }));
      lakeWater.rotation.x = -Math.PI / 2; lakeWater.position.set(V.x, 0.04, V.z);
      lakeWater.receiveShadow = true; scene.add(lakeWater);
      villageLakeMesh = lakeWater;

      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2 + Math.random() * 0.15;
        const r = 8.6 + Math.random() * 0.7;
        const stone = new THREE.Mesh(new THREE.DodecahedronGeometry(0.28 + Math.random() * 0.2, 0), std(0xCBD5E1));
        stone.position.set(V.x + Math.cos(a) * r, 0.15, V.z + Math.sin(a) * r);
        stone.rotation.set(Math.random(), Math.random(), 0);
        stone.castShadow = true; scene.add(stone);
      }

      for (let i = 0; i < 7; i++) {
        const a = Math.random() * Math.PI * 2, r = 2.0 + Math.random() * 4.6;
        const lily = new THREE.Mesh(new THREE.CircleGeometry(0.6 + Math.random() * 0.3, 16), stdPalette(0x16A34A, 0x86EFAC, 0x374151, { roughness: 0.6 }));
        lily.rotation.x = -Math.PI / 2; lily.position.set(V.x + Math.cos(a) * r, 0.05, V.z + Math.sin(a) * r);
        scene.add(lily);
        if (i % 2 === 0) {
          const flower = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), stdPalette(0xEC4899, 0xF9A8D4, 0x9CA3AF));
          flower.position.set(lily.position.x, 0.14, lily.position.z);
          scene.add(flower);
        }
      }

      const dock = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.16, 4.2), stdPalette(0x9B6B3D, 0xC4A482, 0x3E3E46));
      dock.position.set(V.x, 0.1, V.z + 7.5);
      dock.castShadow = true; dock.receiveShadow = true; scene.add(dock);
      [-1.2, 1.2].forEach(dx => {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.8, 8), stdPalette(0x78350F, 0xA27B5C, 0x2D2D34));
        post.position.set(V.x + dx, 0.4, V.z + 5.6);
        post.castShadow = true; scene.add(post);
      });

      const villageHouses = [
        { dx: -14, dz: -5, roof: { s1: 0xEF4444, s2: 0xFCA5A5, s3: 0x4B5563 } },
        { dx: -12, dz: 9,  roof: { s1: 0x2563EB, s2: 0x93C5FD, s3: 0x52525B } },
        { dx: 0,   dz: -15, roof: { s1: 0x7C3AED, s2: 0xC4B5FD, s3: 0x3F3F46 } },
        { dx: 13,  dz: -8, roof: { s1: 0x16A34A, s2: 0x86EFAC, s3: 0x4B5563 } },
        { dx: 14,  dz: 7,  roof: { s1: 0xFACC15, s2: 0xFDE047, s3: 0x71717A } },
        { dx: 7,   dz: 14, roof: { s1: 0xDC2626, s2: 0xFCA5A5, s3: 0x374151 } },
        { dx: -7,  dz: 14, roof: { s1: 0x0284C7, s2: 0x7DD3FC, s3: 0x52525B } }
      ];
      villageHouses.forEach(h => addHouse(V.x + h.dx, V.z + h.dz, h.roof));
    }

    function addHouse(x, z, roof) {
      const h = new THREE.Group();
      const wall = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.4, 3.2), stdPalette(0xFFFBF2, 0xFFF8EE, 0x94A3B8)); wall.position.y = 1.2; wall.castShadow = true; wall.receiveShadow = true; h.add(wall);
      const r = new THREE.Mesh(new THREE.ConeGeometry(2.7, 1.8, 4), stdPalette(roof.s1, roof.s2, roof.s3)); r.position.y = 3.3; r.rotation.y = Math.PI / 4; r.castShadow = true; h.add(r);
      const door = new THREE.Mesh(new THREE.BoxGeometry(.9, 1.4, .1), stdPalette(0x9B6B3D, 0xC4A482, 0x3E3E46)); door.position.set(0, .7, 1.62); h.add(door);
      const win = new THREE.Mesh(new THREE.BoxGeometry(.8, .7, .1), stdPalette(0x9BD8FF, 0xBAE6FD, 0x64748B, { roughness: .3 })); win.position.set(1, 1.6, 1.62); h.add(win);
      const chim = new THREE.Mesh(new THREE.BoxGeometry(.45, .9, .45), stdPalette(0xC9822A, 0xE2A166, 0x52525B)); chim.position.set(.8, 3.6, -.6); chim.castShadow = true; h.add(chim);
      h.position.set(x, 0, z); h.lookAt(ZONES.village.x, 0, ZONES.village.z); scene.add(h);
      makeFadeable(h);
      boxes.push({ minx: x - 1.6, maxx: x + 1.6, minz: z - 1.6, maxz: z + 1.6, top: 9 });
    }
    function addPlatform(x, z, size, top, color) {
      const p = new THREE.Mesh(new THREE.BoxGeometry(size, .5, size), stdPalette(color.s1, color.s2, color.s3, { roughness: .6 }));
      p.position.set(x, top - .25, z); p.castShadow = true; p.receiveShadow = true; scene.add(p);
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(.15, .15, top - .5, 8), stdPalette(0xFFFFFF, 0xFFFAF0, 0x94A3B8)); leg.position.set(x, (top - .5) / 2, z); scene.add(leg);
      boxes.push({ minx: x - size / 2, maxx: x + size / 2, minz: z - size / 2, maxz: z + size / 2, top });
    }

    // 캐릭터: 큰 머리 2등신. 발이 y=0. 머리·팔·발이 따로 움직이고 표정이 바뀜
    const HERO_ROLES = { explorer: "탐험가", cyberbot: "로보트", wizard: "마법사" };
    const HERO_SPECIES = { explorer: "고양이", cyberbot: "강아지", wizard: "토끼" };
    const HERO_DEFAULTS = { explorer: "도로", cyberbot: "도로", wizard: "도로" };

    function getHeroFullName(heroType = G.hero, withSpecies = false) {
      const prefix = HERO_ROLES[heroType] || "탐험가";
      const def = HERO_DEFAULTS[heroType] || "도로";
      let custom = (heroType === G.hero ? (G.customName || "").trim() : "");
      custom = custom.replace(/^(탐험가|로보트|로봇|마법사)\s*/g, "").trim();
      custom = custom.replace(/\s*\([^)]*\)/g, "").trim();
      const name = custom || def;
      const sp = HERO_SPECIES[heroType];
      return (withSpecies && sp) ? `${prefix} ${name} (${sp})` : `${prefix} ${name}`;
    }

        function makeNameSprite(text, heroType) {
      const c = document.createElement("canvas");
      c.width = 1024; c.height = 256;
      const x = c.getContext("2d");

      x.font = "bold 76px 'Jua', 'BM JUA', 'BMJUA', sans-serif";
      const metrics = x.measureText(text);
      const w = Math.min(960, Math.max(440, metrics.width + 112));
      const h = 144;
      const left = (1024 - w) / 2, top = (256 - h) / 2;

      // 그림자
      x.fillStyle = "rgba(0,0,0,0.22)";
      roundRect(x, left, top + 12, w, h, 72);
      x.fill();

      // 배경 흰색 알약
      x.fillStyle = "#ffffff";
      roundRect(x, left, top, w, h, 72);
      x.fill();

      // 테두리
      const borderColor = { explorer: "#3FA9F5", cyberbot: "#46C06A", wizard: "#8E6CEF" }[heroType] || "#3FA9F5";
      x.lineWidth = 12;
      x.strokeStyle = borderColor;
      x.stroke();

      // 이름 텍스트 (글자 크기 2배)
      x.font = "bold 76px 'Jua', 'BM JUA', 'BMJUA', sans-serif";
      x.textAlign = "center";
      x.textBaseline = "middle";
      x.fillStyle = "#2D283E";
      x.fillText(text, 512, 128);

      const tex = setSRGB(new THREE.CanvasTexture(c));
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
      // 캐릭터 크기가 1.05배(기존 1.5배의 0.7배)로 조절되었으므로 이름표 인게임 2배 표시 유지:
      sp.scale.set(1.9 * 2 / 1.05, 0.475 * 2 / 1.05, 1);
      sp.position.set(0, 2.15, 0);
      sp.renderOrder = 998;
      return sp;
    }

    function makeHero(type) {
      const g = new THREE.Group(), U = g.userData;
      U.type = type;
      g.scale.set(1.05, 1.05, 1.05); // 기존 1.5배에서 0.7배로 축소 (1.5 * 0.7 = 1.05배)
      const rig = new THREE.Group(); g.add(rig); U.rig = rig;

      // Base colors (너무 밝게 번지지 않도록 채도와 명암을 차분하고 풍부하게 톤다운)
      const bodyCol = {
        explorer: 0x0284C7,  // 너무 밝던 하늘색(0x38BDF8) -> 차분하고 선명한 딥 스카이 블루(0x0284C7)
        cyberbot: 0x64748B,  // 거의 흰색으로 보이던 0xCBD5E1 -> 세련된 슬레이트 티타늄(0x64748B)
        wizard:   0x5B21B6   // 0x7C3AED -> 깊이 있는 미드나잇 바이올렛(0x5B21B6)
      }[type] || 0x0284C7;

      const furCol = {
        explorer: 0xB45309,  // 쨍하던 주황(0xD98A48) -> 따뜻하고 부드러운 진저 앰버(0xB45309)
        cyberbot: 0x94A3B8,  // 너무 밝던 은색(0xD6DEE8) -> 깔끔하고 차분한 라이트 메탈 그레이(0x94A3B8)
        wizard:   0xD8D4CB   // 하얗게 날아가던 순백(0xFFFFFF) -> 부드러운 오트밀 크림(0xD8D4CB)
      }[type] || 0xB45309;

      // Body (Shirt / Robot Torso / Robe)
      let body;
      if (type === "wizard") {
        body = new THREE.Mesh(new THREE.CylinderGeometry(.22, .42, .5, 20), std(bodyCol, { roughness: .65 }));
        body.position.y = .36;
      } else if (type === "cyberbot") {
        body = new THREE.Mesh(new THREE.CylinderGeometry(.26, .3, .44, 18), std(bodyCol, { roughness: .4, metalness: .3 }));
        body.position.y = .38;
        // Chest green light
        const light = new THREE.Mesh(new THREE.SphereGeometry(.07, 12, 10), new THREE.MeshStandardMaterial({
          color: lin(0x16A34A), emissive: lin(0x16A34A), emissiveIntensity: .6
        }));
        light.position.set(0, .42, .27);
        rig.add(light);
      } else { // explorer (고양이)
        body = new THREE.Mesh(new THREE.CylinderGeometry(.24, .3, .46, 20), std(bodyCol, { roughness: .6 }));
        body.position.y = .38;
        // Neckerchief collar & knot
        const scarf = new THREE.Mesh(new THREE.CylinderGeometry(.28, .27, .09, 20), std(0x78350F, { roughness: .7 }));
        scarf.position.y = .57; rig.add(scarf);
        const knot = new THREE.Mesh(new THREE.ConeGeometry(.06, .14, 8), std(0x78350F, { roughness: .7 }));
        knot.rotation.x = Math.PI; knot.position.set(0, .49, .28); rig.add(knot);
      }
      rig.add(body); U.body = body;

      // Tails! (끊어짐 없이 부드럽게 이어진 튜브 곡선)
      if (type === "explorer") {
        // Cat tail: 부드러운 곡선(TubeGeometry)으로 매끄럽게 위로 감아올라가는 꼬리
        const tailGroup = new THREE.Group();
        tailGroup.position.set(0, .26, -.21);

        const baseJoint = new THREE.Mesh(new THREE.SphereGeometry(.052, 10, 8), std(furCol, { roughness: .7 }));
        tailGroup.add(baseJoint);

        const curvePoints = [
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(.04, .06, -.14),
          new THREE.Vector3(.10, .19, -.20),
          new THREE.Vector3(.14, .33, -.15),
          new THREE.Vector3(.12, .44, -.06)
        ];
        const catCurve = new THREE.CatmullRomCurve3(curvePoints);
        const tubeGeo = new THREE.TubeGeometry(catCurve, 20, .046, 10, false);
        const tubeMesh = new THREE.Mesh(tubeGeo, std(furCol, { roughness: .7 }));
        tailGroup.add(tubeMesh);

        const tip = new THREE.Mesh(new THREE.SphereGeometry(.046, 10, 8), std(furCol, { roughness: .7 }));
        tip.position.copy(curvePoints[4]);
        tailGroup.add(tip);

        rig.add(tailGroup);
        U.tail = tailGroup;
      } else if (type === "cyberbot") {
        // Puppy tail: 본체에 부드럽게 이어진 곡선 꼬리
        const tailGroup = new THREE.Group();
        tailGroup.position.set(0, .28, -.23);

        const baseJoint = new THREE.Mesh(new THREE.SphereGeometry(.055, 10, 8), std(0x475569, { roughness: .5, metalness: .3 }));
        tailGroup.add(baseJoint);

        const curvePoints = [
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(.02, .06, -.10),
          new THREE.Vector3(.04, .16, -.19),
          new THREE.Vector3(.05, .28, -.16),
          new THREE.Vector3(.04, .36, -.10)
        ];
        const dogCurve = new THREE.CatmullRomCurve3(curvePoints);
        const tubeGeo = new THREE.TubeGeometry(dogCurve, 16, .05, 10, false);
        const tubeMesh = new THREE.Mesh(tubeGeo, std(0x475569, { roughness: .5, metalness: .3 }));
        tailGroup.add(tubeMesh);

        const tTip = new THREE.Mesh(new THREE.SphereGeometry(.05, 10, 8), std(0x475569, { roughness: .5, metalness: .3 }));
        tTip.position.copy(curvePoints[4]);
        tailGroup.add(tTip);

        rig.add(tailGroup);
        U.tail = tailGroup;
      } else { // wizard (토끼)
        // Fluffy bunny cotton-ball tail
        const tail = new THREE.Mesh(new THREE.SphereGeometry(.12, 14, 12), std(0xD8D4CB, { roughness: .85 }));
        tail.position.set(-.06, .22, -.26);
        tail.scale.set(1.1, 1, 1.1);
        rig.add(tail);
        U.tail = tail;
      }

      // Feet / Paws
      const footCol = type === "cyberbot" ? 0x475569 : (type === "wizard" ? 0xD8D4CB : 0xB45309);
      U.feet = [-1, 1].map(s => {
        const f = new THREE.Mesh(new THREE.SphereGeometry(.1, 10, 8), std(footCol, { roughness: .6 }));
        f.position.set(.13 * s, .07, .04);
        f.scale.set(1, .7, 1.3);
        rig.add(f);
        return f;
      });

      // Arms / Paws (어깨가 몸통에 자연스럽게 매립되는 볼관절 + 어깨 캡 구조로 팔 회전 시 허공 분리 방지)
      const handCol = type === "cyberbot" ? 0x475569 : furCol;
      U.arms = [-1, 1].map(s => {
        const armMat = std(bodyCol, { roughness: .6, metalness: type === "cyberbot" ? .25 : 0 });

        // 몸통 측면 어깨 소켓 (몸통과 팔 사이의 틈새를 매끄럽게 채워주는 관절 받침대)
        const shoulderCap = new THREE.Mesh(new THREE.SphereGeometry(.088, 12, 10), armMat);
        shoulderCap.position.set(.22 * s, .52, 0);
        shoulderCap.scale.set(1.1, 0.95, 0.95);
        rig.add(shoulderCap);

        const pivot = new THREE.Group();
        pivot.position.set(.24 * s, .52, 0);

        // 어깨 구형 볼관절 (회전 중심점에 위치하여 팔이 어떤 각도로 스윙해도 허공에 뜨지 않음)
        const shoulder = new THREE.Mesh(new THREE.SphereGeometry(.082, 14, 12), armMat);
        shoulder.castShadow = true;
        pivot.add(shoulder);

        const arm = new THREE.Mesh(new THREE.CylinderGeometry(.065, .07, .28, 10), armMat);
        arm.position.y = -.14;
        arm.castShadow = true;
        pivot.add(arm);

        const hand = new THREE.Mesh(new THREE.SphereGeometry(.085, 12, 10), std(handCol, { roughness: .6 }));
        hand.position.y = -.30;
        hand.castShadow = true;
        pivot.add(hand);

        pivot.rotation.z = .25 * s;
        rig.add(pivot);
        return pivot;
      });

      // Head
      const headG = new THREE.Group();
      headG.position.y = .92;
      rig.add(headG);
      U.head = headG;

      // Base Head Mesh
      let head;
      if (type === "cyberbot") {
        head = new THREE.Mesh(new THREE.SphereGeometry(.41, 28, 22), std(furCol, { roughness: .4, metalness: .25 }));
        head.scale.set(1.08, 0.96, 1.0);
      } else {
        head = new THREE.Mesh(new THREE.SphereGeometry(.41, 28, 22), std(furCol, { roughness: .7 }));
      }
      headG.add(head);

      // Specific Head Accessories:
      if (type === "explorer") {
        // CAT EARS: 2 pointy triangles with pink insides
        [-1, 1].forEach(s => {
          const earG = new THREE.Group();
          earG.position.set(.24 * s, .35, 0);
          earG.rotation.z = -.35 * s;
          earG.rotation.x = -.1;
          const outer = new THREE.Mesh(new THREE.ConeGeometry(.13, .26, 4), std(furCol, { roughness: .7 }));
          outer.rotation.y = Math.PI / 4;
          const inner = new THREE.Mesh(new THREE.ConeGeometry(.09, .2, 4), std(0xEF7272, { roughness: .7 }));
          inner.rotation.y = Math.PI / 4;
          inner.position.set(0, -.02, .03);
          earG.add(outer, inner);
          headG.add(earG);
        });

        // SAFARI HAT
        const brim = new THREE.Mesh(new THREE.CylinderGeometry(.52, .52, .04, 24), std(0x9A601B, { roughness: .7 }));
        brim.position.set(0, .32, -.04); brim.rotation.x = .06; headG.add(brim);
        const cap = new THREE.Mesh(new THREE.CylinderGeometry(.32, .38, .22, 24), std(0xB45309, { roughness: .7 }));
        cap.position.set(0, .44, -.04); headG.add(cap);
        const band = new THREE.Mesh(new THREE.CylinderGeometry(.385, .385, .06, 24), std(0x582B09, { roughness: .7 }));
        band.position.set(0, .37, -.04); headG.add(band);
        // Yellow badge on front
        const badge = new THREE.Mesh(new THREE.CylinderGeometry(.07, .07, .03, 16), new THREE.MeshStandardMaterial({
          color: lin(0xFBBF24), emissive: lin(0xD97706), emissiveIntensity: .3, roughness: .4
        }));
        badge.rotation.x = Math.PI / 2; badge.position.set(0, .39, .36); headG.add(badge);

        // Cream Muzzle Snout patch
        const muzzle = new THREE.Mesh(new THREE.SphereGeometry(.14, 14, 10), std(0xE6CDB4, { roughness: .7 }));
        muzzle.position.set(0, -.07, .36); muzzle.scale.set(1.3, .8, .7); headG.add(muzzle);
        // Cat Nose
        const nose = new THREE.Mesh(new THREE.ConeGeometry(.035, .04, 3), std(0x78350F));
        nose.rotation.z = Math.PI; nose.position.set(0, -.03, .44); headG.add(nose);

      } else if (type === "cyberbot") {
        // FLOPPY PUPPY EARS (hanging down on both sides, 부드러운 곡선)
        [-1, 1].forEach(s => {
          const earG = new THREE.Group();
          earG.position.set(.36 * s, .14, .04);
          const ear = new THREE.Mesh(new THREE.CylinderGeometry(.06, .08, .32, 12), std(0x475569, { roughness: .5, metalness: .2 }));
          ear.position.set(.02 * s, -.12, 0);
          ear.rotation.z = .15 * s;
          ear.rotation.y = -.1 * s;
          earG.add(ear);
          const earTip = new THREE.Mesh(new THREE.SphereGeometry(.08, 10, 8), std(0x475569, { roughness: .5, metalness: .2 }));
          earTip.position.set(.02 * s, -.28, 0);
          earG.add(earTip);
          headG.add(earG);
        });

        // ANTENNA on top
        const ant = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, .22, 8), std(0x64748B, { roughness: .4, metalness: .4 }));
        ant.position.y = .38; headG.add(ant);
        const tip = new THREE.Mesh(new THREE.SphereGeometry(.085, 14, 10), new THREE.MeshStandardMaterial({
          color: lin(0xDC2626), emissive: lin(0xDC2626), emissiveIntensity: .5
        }));
        tip.position.y = .52; headG.add(tip); U.tip = tip;

        // VISOR (부드럽게 얼굴을 감싸는 곡선 바이저)
        const visor = new THREE.Mesh(new THREE.CylinderGeometry(.42, .42, .18, 20, 1, false, Math.PI * 0.28, Math.PI * 0.44), std(0x1E293B, { roughness: .4 }));
        visor.rotation.y = -Math.PI / 2; visor.position.set(0, .05, .05); headG.add(visor);

        // Muzzle Patch & Nose (부드러운 타원 구형)
        const muzzle = new THREE.Mesh(new THREE.SphereGeometry(.14, 14, 10), std(0xCBD5E1, { roughness: .6 }));
        muzzle.position.set(0, -.13, .33); muzzle.scale.set(1.3, .75, .7); headG.add(muzzle);
        const nose = new THREE.Mesh(new THREE.SphereGeometry(.04, 8, 8), std(0x1E293B));
        nose.position.set(0, -.09, .38); headG.add(nose);

      } else { // wizard (토끼)
        // LONG BUNNY EARS sticking up!
        [-1, 1].forEach(s => {
          const earG = new THREE.Group();
          earG.position.set(.17 * s, .36, -.08);
          earG.rotation.z = -.16 * s;
          earG.rotation.x = -.12;
          const outer = new THREE.Mesh(new THREE.SphereGeometry(.1, 14, 12), std(0xD8D4CB, { roughness: .75 }));
          outer.scale.set(.8, 3.2, .45); outer.position.y = .22;
          const inner = new THREE.Mesh(new THREE.SphereGeometry(.07, 12, 10), std(0xF472B6, { roughness: .7 }));
          inner.scale.set(.7, 2.7, .35); inner.position.set(0, .2, .03);
          earG.add(outer, inner);
          headG.add(earG);

    // ──────── 스테이지 2 & 3 동료 영웅 시스템 (캐릭터 선택창의 다른 두 영웅) ────────
    function createCompanionHero(role) {
      const g = makeHero(role);
      const U = g.userData;
      return {
        mesh: g,
        anim(dt, t, walker) {
          const ph = walker.phase;
          // 발 걷기 애니메이션
          if (U.feet && U.feet.length >= 2) {
            U.feet[0].position.z = .04 + Math.sin(ph) * .12;
            U.feet[0].position.y = .07 + Math.max(0, Math.sin(ph)) * .06;
            U.feet[1].position.z = .04 - Math.sin(ph) * .12;
            U.feet[1].position.y = .07 + Math.max(0, -Math.sin(ph)) * .06;
          }
          // 앞뒤 팔 스윙 (몸통에 완전히 결합된 어깨 볼관절로 자연스러운 회전)
          if (U.arms && U.arms.length >= 2) {
            U.arms[0].rotation.set(Math.sin(ph) * .65, 0, -.22);
            U.arms[1].rotation.set(-Math.sin(ph) * .65, 0, .22);
          }
          // 통통 튀는 몸통 리그
          if (U.rig) {
            U.rig.position.y = Math.abs(Math.sin(ph)) * .07;
            U.rig.rotation.z = Math.sin(ph) * .035;
          }
          // 고개 갸우뚱
          if (U.head) {
            U.head.rotation.set(0, 0, Math.sin(ph * 0.5) * .08);
          }
          // 꼬리 흔들기
          if (U.tail) {
            if (role === "explorer") {
              U.tail.rotation.z = Math.sin(t * 3.5) * .22;
              U.tail.rotation.y = Math.cos(t * 2.5) * .18;
            } else if (role === "cyberbot") {
              U.tail.rotation.y = Math.sin(t * 14.0) * .35;
              U.tail.rotation.z = Math.cos(t * 14.0) * .15;
            } else if (role === "wizard") {
              U.tail.position.y = .22 + Math.abs(Math.sin(ph)) * .04;
            }
          }
          // 머리 위 이름표 바운스
          if (U.nameSprite && U.rig) {
            U.nameSprite.position.y = 2.15 + U.rig.position.y * .4;
          }
        }
      };
    }

    /* ───────────── 카드 디자인 및 생성 ───────────── */
    const cardTexCache = {};
    function cardTexture(diff) {
      if (cardTexCache[diff]) return cardTexCache[diff];
      const cfg = DIFF_CONFIG[diff] || DIFF_CONFIG.mid;
      const c = document.createElement("canvas");
      c.width = 320; c.height = 440;
      const x = c.getContext("2d");

      // 1. 카드 외곽 테두리 (난이도 색상: 상=빨간색, 중=초록색, 하=노란색)
      x.fillStyle = cfg.color;
      roundRect(x, 6, 6, 308, 428, 38);
      x.fill();
      x.strokeStyle = cfg.borderDark;
      x.lineWidth = 7;
      x.stroke();

      // 2. 카드 본체 (선명하고 진한 노란색 그라데이션)
      const grad = x.createLinearGradient(0, 24, 0, 416);
      grad.addColorStop(0, "#FFD000");    // 상단 선명하고 환한 골든 옐로우
      grad.addColorStop(0.45, "#FFB700"); // 중앙 농도 높은 진한 노란색
      grad.addColorStop(1, "#FFA000");    // 하단 묵직하고 따뜻한 앰버 옐로우
      x.fillStyle = grad;
      roundRect(x, 24, 24, 272, 392, 28);
      x.fill();

      // 내부 은은한 광택 테두리
      x.strokeStyle = "#FFF3B0";
      x.lineWidth = 4;
      x.stroke();

      // 3. 중앙 물음표 (?) - 카드 중심에 크고 선명한 화이트 심볼과 그림자
      x.font = "bold 196px 'Jua', 'Noto Sans KR', sans-serif";
      x.textAlign = "center";
      x.textBaseline = "middle";
      x.strokeStyle = "#D97706";
      x.lineWidth = 15;
      x.strokeText("?", 160, 220);
      x.fillStyle = "#FFFFFF";
      x.fillText("?", 160, 220);

      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return (cardTexCache[diff] = tex);
    }

    function freeSpot(zoneKey) {
      const z = ZONES[zoneKey] || ZONES.center || { x: 0, z: 0, r: 16, rMin: 4, rMax: 16 };
      const rMin = z.rMin || (zoneKey === "village" ? 9.8 : (zoneKey === "plaza" ? 4.8 : 3.0));
      const rMax = z.rMax || (z.r - 2.0);
      for (let t = 0; t < 200; t++) {
        const a = Math.random() * Math.PI * 2;
        const r = rMin + Math.random() * (rMax - rMin);
        const x = z.x + Math.cos(a) * r, zz = z.z + Math.sin(a) * r;

        if (Math.hypot(x - 0, zz - 4) < 3.2) continue;
        if (colliders.some(c => Math.hypot(c.x - x, c.z - zz) < c.r + 1.3)) continue;
        if (boxes.some(b => x > b.minx - 1.3 && x < b.maxx + 1.3 && zz > b.minz - 1.3 && zz < b.maxz + 1.3)) continue;
        if (G.cards.some(c => !c.done && c.mesh && c.mesh.position.distanceTo(new THREE.Vector3(x, 0, zz)) < 5.2)) continue;
        return new THREE.Vector3(x, 0, zz);
      }
      const safeAngle = Math.random() * Math.PI * 2;
      const safeR = (rMin + rMax) * 0.5;
      return new THREE.Vector3(z.x + Math.cos(safeAngle) * safeR, 0, z.z + Math.sin(safeAngle) * safeR);
    }

    function updateGrassAndTuftsPalette(stageNum) {
      if (grassMesh && grassMesh.geometry) {
        const geo = grassMesh.geometry;
        const pos = geo.attributes.position;
        const noise = geo.userData.noiseVals;
        const colAttr = geo.attributes.color;
        if (noise && colAttr) {
          const grassPalettes = {
            1: { A: lin(0x1B5E20), B: lin(0x2E7D32), C: lin(0x0E3813) },
            2: { A: lin(0x1B5E20), B: lin(0x2E7D32), C: lin(0x0E3813) },
            3: { A: lin(0x5E6928), B: lin(0x768335), C: lin(0x48521F) }
          };
          const pal = grassPalettes[stageNum] || grassPalettes[1];
          const tmp = new THREE.Color();
          for (let i = 0; i < pos.count; i++) {
            const n = noise[i];
            tmp.copy(pal.A).lerp(n > 0 ? pal.B : pal.C, Math.min(1, Math.abs(n) * 0.55));
            colAttr.setXYZ(i, tmp.r, tmp.g, tmp.b);
          }
          colAttr.needsUpdate = true;
        }
      }

      if (tuftsMesh) {
        const tuftPalettes = {
          1: [0x1B5E20, 0x2E7D32, 0x388E3C, 0x14532D].map(lin),
          2: [0x1B5E20, 0x2E7D32, 0x388E3C, 0x14532D].map(lin),
          3: [0x48521F, 0x5E6928, 0x768335, 0x8A9842].map(lin)
        };
        const tuftCols = tuftPalettes[stageNum] || tuftPalettes[1];
        for (let i = 0; i < 1200; i++) {
          tuftsMesh.setColorAt(i, tuftCols[i % 4]);
        }
        if (tuftsMesh.instanceColor) {
          tuftsMesh.instanceColor.needsUpdate = true;
        }
      }
    }

      pinSpotlight.intensity = 3.4;
      pinSpotlight.position.set(P.pos.x + 1.2, P.pos.y + 11.5, P.pos.z + 1.2);
      pinTarget.position.set(P.pos.x, P.pos.y + 0.35, P.pos.z);
      pinSpotlight.target.updateMatrixWorld();

      if (pinLightPool) {
        pinLightPool.visible = true;
        pinLightPool.position.set(P.pos.x, 0.035, P.pos.z);
        pinLightPool.material.opacity = 0.38 + Math.sin(t * 3.0) * 0.05;
      }
      if (pinLightBeam) {
        pinLightBeam.visible = true;
        pinLightBeam.position.set(P.pos.x, P.pos.y, P.pos.z);
        pinLightBeam.rotation.x = -1.2 / 11.5 * 0.5;
        pinLightBeam.rotation.z = 1.2 / 11.5 * 0.5;
        pinLightBeam.material.opacity = 0.12 + Math.sin(t * 2.5) * 0.02;
      }
    }

    function setStageVisuals(stageNum) {
      const cfg = STAGES[stageNum] || STAGES[1];
      if (sky && sky.material && sky.material.uniforms) {
        sky.material.uniforms.top.value = lin(cfg.skyTop);
        sky.material.uniforms.mid.value = lin(cfg.skyMid);
        sky.material.uniforms.bottom.value = lin(cfg.skyBottom);
        sky.material.uniforms.sunPos.value.set(...cfg.sunPos).normalize();
        if (sky.material.uniforms.sunGlowCol) {
          sky.material.uniforms.sunGlowCol.value.copy(lin(cfg.sunGlowCol));
          sky.material.uniforms.sunGlowPower.value = cfg.sunGlowPower;
        }
      }
      if (sun) {
        sun.color.copy(lin(cfg.sunColor));
        sun.intensity = cfg.sunIntensity;
        sun.position.set(...cfg.sunPos);
      }
      if (ambientLight) {
        ambientLight.color.copy(lin(cfg.ambientColor || 0xFFFFFF));
        ambientLight.intensity = cfg.ambientIntensity ?? 0.65;
      }
      if (hemiLight) {
        hemiLight.color.copy(lin(cfg.hemiSky));
        hemiLight.groundColor.copy(lin(cfg.hemiGround));
        hemiLight.intensity = cfg.hemiIntensity;
      }
      if (scene && scene.fog) {
        scene.fog.color.copy(lin(cfg.fogColor));
        scene.fog.near = cfg.fogNear;
        scene.fog.far = cfg.fogFar;
      }
      if (renderer) {
        renderer.setClearColor(lin(cfg.fogColor));
      }
      if (moonGroup) moonGroup.visible = !!cfg.hasMoon;
      if (starsGroup) starsGroup.visible = !!cfg.hasStars;
      if (sun3DGroup) sun3DGroup.visible = !!cfg.hasSun3D;

      if (stage1Group) stage1Group.visible = (stageNum === 1);
      if (stage2Group) stage2Group.visible = (stageNum === 2);
      if (stage3Group) stage3Group.visible = (stageNum === 3);

      colliders.length = 0;
      colliders.push(...commonColliders);
      boxes.length = 0;
      boxes.push(...commonBoxes);
      if (stageNum === 1) {
        colliders.push(...stage1Colliders);
        boxes.push(...stage1Boxes);
      } else if (stageNum === 2) {
        colliders.push(...stage2Colliders);
        boxes.push(...stage2Boxes);
      } else if (stageNum === 3) {
        colliders.push(...stage3Colliders);
        boxes.push(...stage3Boxes);
      }
      if (cloudMat) {
        cloudMat.color.copy(lin(cfg.cloudColor));
        cloudMat.opacity = cfg.cloudOpacity ?? 1.0;
        cloudMat.transparent = cloudMat.opacity < 1.0;
      }
      const appEl = $("app");
      applyStagePalette(stageNum);
      updatePinSpotlight(clock ? clock.elapsedTime : 0);
      if (appEl && cfg.appBg) {
        appEl.style.background = cfg.appBg;
      }
    }

    function advanceStage(stageNum) {
      if (stageNum > 3) {
        endGame(true);
        return;
      }
      G.stage = stageNum;
      G.stageGot = 0;
      setStageVisuals(stageNum);
      // ?ㅽ뀒?댁?媛 蹂???뚮쭏??罹먮┃?곌? 以묒븰 愿묒옣?먯꽌 ?뺣㈃??蹂대ŉ ?쒖옉
      P.pos.set(0, 0, 3.2);
      P.vy = 0;
      P.face = Math.PI;
      camYaw = 0;
      camPitch = 0.5;
      const stageName = `스테이지 ${stageNum}`;
      const stageSubtitle = stageNum === 1
        ? "10장의 카드를 모두 찾아 모아보세요! (난이도 하)"
        : (stageNum === 2 ? "학교와 운동장 탐험! (난이도 하/중 15장 중 10장 목표)" : "아름다운 노을빛 아래 신나는 놀이터 탐험! (난이도 상/중/하 15장 중 10장 목표)");
      showStageBanner(stageName, stageSubtitle);
      sfx("get");
      updateHud();
      spawnCards();
      notice(`${stageName} 시작! ${stageNum === 1 ? "난이도 [하] 10장의 카드를 모두 모아보세요!" : (stageNum === 2 ? "난이도 [하/중] 15장의 카드 중 10장을 모아보세요!" : "난이도 [상/중/하] 15장의 카드 중 10장을 모아보세요!")}`);
    }

    function spawnSingleNewCard() {
      const regionsList = ["forest", "village", "plaza", "park", "center"];
      const regKey = regionsList[Math.floor(Math.random() * regionsList.length)];
      const learnedSet = new Set(G.learned.map(l => l.word));

      let diff = "mid";
      let pool = WORDS_MID;
      if (G.stage === 2) {
        diff = Math.random() < 0.5 ? "low" : "mid";
        pool = diff === "low" ? WORDS_LOW : WORDS_MID;
      } else if (G.stage === 3) {
        const r = Math.random();
        if (r < 0.34) { diff = "high"; pool = WORDS_HIGH; }
        else if (r < 0.67) { diff = "mid"; pool = WORDS_MID; }
        else { diff = "low"; pool = WORDS_LOW; }
      } else {
        diff = "low"; pool = WORDS_LOW;
      }

      const unlearned = pool.filter(w => !learnedSet.has(w.word));
      const candidatePool = unlearned.length > 0 ? unlearned : pool;
      const word = candidatePool[Math.floor(Math.random() * candidatePool.length)];

      const isGold = Math.random() < (1 / 3); // 1/3 확률로 황금문제카드 생성

      const card = {
        region: regKey,
        zone: regKey,
        word: word,
        diff: diff,
        gold: isGold,
        done: false,
        cool: 0,
        lastType: null
      };
      card.mesh = makeCardMesh(diff); // 겉면으로는 구분 불가능 (일반 카드 외형 유지)
      card.mesh.position.copy(freeSpot(regKey));
      G.cards.push(card);
      scene.add(card.mesh);
      return card;
    }

    function spawnCards() {
      G.cards.forEach(c => scene.remove(c.mesh));
      G.cards = [];

      const regionsList = ["forest", "village", "plaza", "park", "center"];
      const learnedSet = new Set(G.learned.map(l => l.word));

      // 중복 최소화 단어 선택 함수
      const selectWords = (pool, count) => {
        const unlearned = pool.filter(w => !learnedSet.has(w.word));
        const list = unlearned.length >= count ? unlearned : pool;
        return shuffle(list).slice(0, count);
      };

      if (G.stage === 1) {
        // 스테이지 1: 총 10장 (5개 구역에 각 2장씩 고루 분산) - 모두 난이도 [하], 1/3 황금카드
        const lowWords = selectWords(WORDS_LOW, 10);
        const cardItems = shuffle(lowWords.map(w => ({ diff: "low", word: w })));

        // 5개 구역마다 2장씩 균등 배치
        regionsList.forEach((regKey, rIdx) => {
          const regionCards = cardItems.slice(rIdx * 2, rIdx * 2 + 2);
          regionCards.forEach((item, cIdx) => {
            const cardIdx = rIdx * 2 + cIdx;
            const card = {
              region: regKey,
              zone: regKey,
              word: item.word,
              diff: item.diff,
              gold: (cardIdx % 3 === 0), // 1/3 비율로 황금문제카드 설정
              done: false,
              cool: 0,
              lastType: null
            };
            card.mesh = makeCardMesh(item.diff);
            card.mesh.position.copy(freeSpot(regKey));
            G.cards.push(card);
            scene.add(card.mesh);
          });
        });
      } else if (G.stage === 2) {
        // 스테이지 2: 총 15장 (5개 구역 당 3장씩) - 난이도 [하] / [중] 구성, 1/3 황금카드 (5장)
        const lowWords = selectWords(WORDS_LOW, 8);
        const midWords = selectWords(WORDS_MID, 7);
        const cardItems = shuffle([
          ...lowWords.map(w => ({ diff: "low", word: w })),
          ...midWords.map(w => ({ diff: "mid", word: w }))
        ]);

        // 5개 구역마다 3장씩 균등 배치
        regionsList.forEach((regKey, rIdx) => {
          const regionCards = cardItems.slice(rIdx * 3, rIdx * 3 + 3);
          regionCards.forEach((item, cIdx) => {
            const cardIdx = rIdx * 3 + cIdx;
            const card = {
              region: regKey,
              zone: regKey,
              word: item.word,
              diff: item.diff,
              gold: (cardIdx % 3 === 0), // 1/3 비율로 황금문제카드 설정
              done: false,
              cool: 0,
              lastType: null
            };
            card.mesh = makeCardMesh(item.diff);
            card.mesh.position.copy(freeSpot(regKey));
            G.cards.push(card);
            scene.add(card.mesh);
          });
        });
      } else {
        // 스테이지 3: 총 15장 (5개 구역에 상/중/하 각 5장씩 총 15장) - 난이도 [상] / [중] / [하], 1/3 황금카드 (5장)
        const highWords = selectWords(WORDS_HIGH, 5);
        const midWords = selectWords(WORDS_MID, 5);
        const lowWords = selectWords(WORDS_LOW, 5);

        let cardCount = 0;
        // 각 구역마다 상 1장, 중 1장, 하 1장을 고루 분산 배치
        regionsList.forEach((regKey, idx) => {
          const regionDiffItems = [
            { diff: "high", word: highWords[idx] },
            { diff: "mid", word: midWords[idx] },
            { diff: "low", word: lowWords[idx] }
          ];

          shuffle(regionDiffItems).forEach(item => {
            const card = {
              region: regKey,
              zone: regKey,
              word: item.word,
              diff: item.diff,
              gold: (cardCount % 3 === 0), // 1/3 비율로 황금문제카드 설정
              done: false,
              cool: 0,
              lastType: null
            };
            cardCount++;
            card.mesh = makeCardMesh(item.diff);
            card.mesh.position.copy(freeSpot(regKey));
            G.cards.push(card);
            scene.add(card.mesh);
          });
        });
      }

      G.stageGoal = 10; // 스테이지 통과 목표: 10장
    }

    /* ───────────── 난이도별 문제 만들기 (상 / 중 / 하) ───────────── */
    function makeQuestion(card) {
      const w = card.word;
      const diff = card.diff || "mid";
      const allWords = ALL_VOCAB;
      const others = allWords.filter(x => x.word !== w.word);
      const pick = (field, n) => shuffle([...new Set(others.map(x => x[field]).filter(v => v && v !== w[field]))]).slice(0, n);
      const opts = (right, wrongs) => shuffle([{ label: right, ok: true }, ...wrongs.map(v => ({ label: v, ok: false }))]);
      const Q = "<span class='quote'>";

      // 난이도에 따른 출제 문제 유형
      let allowedTypes;
      if (diff === "low") {
        // 하: 직관적 그림 퀴즈, 쉬운 OX, 기본 뜻, 외래어 매칭
        allowedTypes = ["pic", "ox", "def", "en"];
        if (!w.pic) allowedTypes = allowedTypes.filter(t => t !== "pic");
        if (!w.en) allowedTypes = allowedTypes.filter(t => t !== "en");
      } else if (diff === "mid") {
        // 중: 빈칸 채우기, 낱말 사전 뜻, 짝꿍 낱말, 남북한말
        allowedTypes = ["blank", "mean", "rel", "nk2std", "std2nk"];
        if (!w.sentence) allowedTypes = allowedTypes.filter(t => t !== "blank");
        if (!w.rel) allowedTypes = allowedTypes.filter(t => t !== "rel");
        if (!w.nk) allowedTypes = allowedTypes.filter(t => t !== "nk2std" && t !== "std2nk");
      } else {
        // 상: 심화 상황 추론 적용, 반대말(반의어), 고난도 교과 개념 정의
        allowedTypes = ["app", "ant", "def_adv"];
        if (!w.app) allowedTypes = allowedTypes.filter(t => t !== "app");
        if (!w.ant) allowedTypes = allowedTypes.filter(t => t !== "ant");
      }
      if (!allowedTypes.length) allowedTypes = ["def"];

      const types = shuffle(allowedTypes.filter(t => t !== card.lastType));
      const t = types[0] || allowedTypes[0];
      card.lastType = t;

      const q = {
        hint: chosung(w.word),
        word: w.word,
        diff: diff,
        mean: w.meaning || (w.nk ? `북한말 '${w.nk}', 영어 '${w.en}'` : "")
      };

      switch (t) {
        // [하 난이도 유형]
        case "pic":
          return {
            ...q,
            prompt: `이 그림을 나타내는 낱말은 무엇일까요?<span style="display:block;font-size:2.6em;line-height:1.2;margin:10px 0">${w.pic}</span>`,
            options: opts(w.word, pick("word", 2)) // 3지선다
          };
        case "ox": {
          const truth = Math.random() < 0.5;
          const shownMeaning = truth ? w.meaning : (w.mis || (pick("meaning", 1)[0] || "전혀 다른 엉뚱한 뜻입니다."));
          return {
            ...q,
            prompt: `맞는 설명일까요? O, X를 골라보세요!${Q}<b>${esc(w.word)}</b> : ${esc(shownMeaning)}</span>`,
            ox: true,
            options: [
              { label: "O", ok: truth, say: "맞아요" },
              { label: "X", ok: !truth, say: "틀려요" }
            ]
          };
        }
        case "en":
          return {
            ...q,
            prompt: `영어로 <b>${esc(w.en)}</b>!<br>우리말로 무엇일까요?`,
            options: opts(w.word, pick("word", 2))
          };
        case "def":
          return {
            ...q,
            prompt: `다음 설명에 꼭 알맞은 낱말은?${Q}${esc(w.meaning)}</span>`,
            options: opts(w.word, pick("word", 2)) // 3지선다
          };

        // [중 난이도 유형]
        case "blank":
          return {
            ...q,
            prompt: `문장의 빈칸에 들어갈 알맞은 낱말은?${Q}${esc(w.sentence)}</span>`,
            options: opts(w.word, pick("word", 3)) // 4지선다
          };
        case "mean":
          return {
            ...q,
            prompt: `<b>${esc(w.word)}</b>의 뜻으로 가장 알맞은 것은?`,
            options: opts(w.meaning, pick("meaning", 3))
          };
        case "rel":
          q.hint = chosung(w.rel);
          return {
            ...q,
            prompt: `<b>${esc(w.word)}</b>와 가장 깊이 관련된 짝꿍 낱말은?`,
            options: opts(w.rel, pick("rel", 3))
          };
        case "nk2std":
          return {
            ...q,
            prompt: `북한에서는 <b>'${esc(w.nk)}'</b>이라고 해요.<br>우리는 뭐라고 부를까요?`,
            options: opts(w.word, pick("word", 3))
          };
        case "std2nk":
          q.hint = chosung(w.nk);
          return {
            ...q,
            prompt: `<b>'${esc(w.word)}'</b>${batchim(w.word) ? "을" : "를"}<br>북한에서는 뭐라고 부를까요?`,
            options: opts(w.nk, pick("nk", 3))
          };

        // [상 난이도 유형]
        case "app":
          return {
            ...q,
            prompt: `상황 이야기를 읽고 알맞은 낱말을 찾아보세요!${Q}${esc(w.app)}</span>`,
            options: opts(w.word, pick("word", 3)) // 4지선다 고난도 추론
          };
        case "ant":
          q.hint = chosung(w.ant);
          return {
            ...q,
            prompt: `<b>${esc(w.word)}</b>의 뜻과 반대되는 반의어(반대말)는?`,
            options: opts(w.ant, [...pick("ant", 2), ...pick("rel", 1)])
          };
        case "def_adv":
        default:
          return {
            ...q,
            prompt: `교과 개념 뜻풀이에 꼭 맞는 심화 낱말은?${Q}${esc(w.meaning)}</span>`,
            options: opts(w.word, pick("word", 3))
          };
      }
    }

    const OPT_COLORS = ["sea", "tomato", "leaf", "grape"];
    function openQuiz(card) {
      G.activeCard = card; G.attempts = 0; G.hintUsed = false; G.locked = false; G.paused = true;
      input.jx = input.jy = 0;
      const q = card.q = makeQuestion(card);
      const diffCfg = DIFF_CONFIG[card.diff] || DIFF_CONFIG.mid;

      // 臾몄젣移대뱶 醫뚯륫 ?곷떒 諛곗? (?⑷툑臾몄젣移대뱶 vs ?쇰컲臾몄젣移대뱶 ?쒖떆)
      const typeBadge = $("quizCardTypeBadge");
      if (typeBadge) {
        if (card.gold) {
          typeBadge.innerHTML = `<span class="badge-gold">???⑷툑 臾몄젣 (?먯닔 2諛?)</span>`;
        } else {
          typeBadge.innerHTML = `<span class="badge-normal">?쇰컲 臾몄젣</span>`;
        }
      }

      $("quizPrompt").innerHTML = q.prompt;
      const box = $("quizOptions"); box.innerHTML = ""; box.className = "";
      q.options.forEach((o, i) => {
        const b = document.createElement("button"); b.type = "button";
        const long = !q.ox && o.label.length > 9;
        if (long) box.classList.add("one");
        b.className = "jelly opt " + (q.ox ? `ox ${o.label === "O" ? "sea" : "tomato"}` : OPT_COLORS[i % 4]) + (long ? " long" : "");
        b.innerHTML = q.ox ? o.label : `<span class="n">${i + 1}</span><span>${esc(o.label)}</span>`;
        b.dataset.ok = o.ok ? "1" : "";
        b.dataset.say = o.say || o.label;
        b.onclick = () => answer(o.ok, b);
        box.appendChild(b);
      });
      $("quizHintBox").classList.add("hidden");
      $("quizFeedback").classList.add("hidden");
      const qb = document.querySelector(".quiz-bottom");
      if (qb) qb.classList.remove("hidden");
      $("quizHintBtn").disabled = false; $("quizHintBtn").style.opacity = 1;
      $("quizSay").innerHTML = ART.speaker;
      $("quizSay").onclick = () => say($("quizPrompt").innerText + ". " + [...box.children].map((b, i) => `${i + 1}踰? ${b.dataset.say}`).join(". "));
      show("quizModal");
      sfx("tap");
    }
    function showHint(free) {
      if (!G.activeCard) return;
      if (!free) G.hintUsed = true;
      $("quizHintBox").innerHTML = `?뮕 ?뺣떟 泥レ냼由?<b>${esc(G.activeCard.q.hint)}</b>`;
      $("quizHintBox").classList.remove("hidden");
      $("quizHintBtn").disabled = true; $("quizHintBtn").style.opacity = .4;
    }
    function closeQuiz(later) {
      hide("quizModal");
      G.activeCard = null; G.paused = false;
      if (later) notice("以鍮꾨릺硫??ㅼ떆 移대뱶濡?媛??");
    }
    function answer(ok, btn) {
      if (G.locked) return;
      const card = G.activeCard, fb = $("quizFeedback");
      fb.classList.remove("hidden");
      if (ok) {
        G.locked = true; sfx("right");
        btn.classList.add("opt-right");
        $("quizOptions").querySelectorAll("button").forEach(b => b.disabled = true);
        // ?뺣떟 ??遺덊븘?뷀븳 ?섎떒 踰꾪듉???④꺼 移대뱶 ?믪씠 蹂??諛??ㅽ겕濡ㅻ컮 ?앹꽦 諛⑹?
        const qb = document.querySelector(".quiz-bottom");
        if (qb) qb.classList.add("hidden");
        $("quizHintBox").classList.add("hidden");
        const first = G.attempts === 0;
        if (first) G.combo++; else G.combo = 0;

        const isGold = !!card.gold;
        const goldMult = isGold ? 2 : 1;
        const diffCfg = DIFF_CONFIG[card.diff] || DIFF_CONFIG.mid;
        const base = first ? (G.hintUsed ? Math.round(diffCfg.basePts * 0.6) : diffCfg.basePts) : Math.round(diffCfg.basePts * 0.4);
        const comboMult = (G.combo >= 3 ? 2 : 1);
        const pts = base * comboMult * goldMult;
        G.score += pts; G.got++; G.stageGot++;
        if (!first || G.hintUsed) G.missed.add(card.word.word);
        G.learned.push({ word: card.word.word, zone: card.zone, diff: card.diff, mean: card.q.mean });
        fb.style.color = isGold ? "#D97706" : "var(--leaf-d)";
        fb.innerHTML = `?⑸룞?? ${isGold ? "<b style=\"color:#F59E0B\">?⑦솴湲?蹂대꼫??2諛?</b> " : ""}+${pts}${comboMult > 1 ? ` <span class=\"star-on\">횞${comboMult}</span>` : ""}<span class=\"mean\">${esc(card.word.word)} : ${esc(card.q.mean)}</span>`;
        updateHud(true);
        setTimeout(() => { collect(card); closeQuiz(false); }, 1300);
      } else {
        G.attempts++; G.combo = 0; sfx("wrong");
        btn.classList.add("opt-wrong"); btn.disabled = true;
        fb.style.color = "var(--tomato-d)";
