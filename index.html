      if (U.tail) {
        if (U.type === "explorer") {
          U.tail.rotation.z = Math.sin(t * 3) * .18;
          U.tail.rotation.y = Math.cos(t * 2) * .15;
        } else if (U.type === "cyberbot") {
          U.tail.rotation.y = Math.sin(t * (walk ? 18 : 10)) * .35;
          U.tail.rotation.z = Math.cos(t * (walk ? 18 : 10)) * .12;
        } else if (U.type === "wizard") {
          U.tail.position.y = .22 + (walk ? Math.abs(Math.sin(ph)) * .04 : 0);
        }
      }
      if (U.nameSprite) U.nameSprite.position.y = 2.15 + rigY * .4;
      if (bubble && bubble.visible) bubble.position.set(P.pos.x, P.pos.y + 3.4 + rigY * 1.5, P.pos.z);
    }
    function waterRipple(at) {
      const geo = new THREE.RingGeometry(0.18, 0.28, 24);
      const mat = new THREE.MeshBasicMaterial({ color: 0xA5F3FC, transparent: true, opacity: 0.85, side: THREE.DoubleSide });
      const r = new THREE.Mesh(geo, mat);
      r.rotation.x = -Math.PI / 2;
      r.position.set(at.x, 0.06, at.z);
      r.userData = { life: 0.65, maxLife: 0.65, ripple: true };
      scene.add(r);
      fx.push(r);
    }
    function puff(at, n) {
      for (let i = 0; i < n; i++) {
        const m = new THREE.Mesh(new THREE.SphereGeometry(.12, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .8 }));
        m.position.set(at.x + (Math.random() - .5) * .4, at.y + .08, at.z + (Math.random() - .5) * .4);
        m.userData = { v: new THREE.Vector3((Math.random() - .5) * 1.2, .8, (Math.random() - .5) * 1.2), life: .5, puff: true };
        scene.add(m); fx.push(m);
      }
    }
    function openEmoteMenu() { const m = $("emoteMenu"); m.classList.toggle("hidden"); }
    function closeEmoteMenu() { $("emoteMenu").classList.add("hidden"); }

    function updateCamera(dt) {
      if (P.moving && !isPointerDragging) {
        const forwardDot = (-Math.sin(camYaw)) * Math.sin(P.face) + (-Math.cos(camYaw)) * Math.cos(P.face);
        // 전진/측면 이동 중일 때만 부드럽게 카메라가 캐릭터 뒤를 따라오고, 후진(뒤로가기) 중에는 카메라를 돌리지 않아 뱅글뱅글 도는 버그 방지
        if (forwardDot > 0.15) {
          const desiredYaw = P.face + Math.PI;
          let diff = desiredYaw - camYaw;
          diff = Math.atan2(Math.sin(diff), Math.cos(diff));
          camYaw += diff * Math.min(1, dt * 2.8);
        }
      }
      const tgt = new THREE.Vector3(P.pos.x, P.pos.y + 1.1, P.pos.z);
      const want = new THREE.Vector3(
        tgt.x + Math.sin(camYaw) * Math.cos(camPitch) * camDist,
        tgt.y + Math.sin(camPitch) * camDist,
        tgt.z + Math.cos(camYaw) * Math.cos(camPitch) * camDist);
      camera.position.lerp(want, Math.min(1, dt * 8));
      camera.lookAt(tgt);
      if (sky) sky.position.copy(camera.position);
      if (starsGroup && starsGroup.visible) starsGroup.position.copy(camera.position);

      const cfg = STAGES[G.stage] || STAGES[1];
      sun.position.set(P.pos.x + cfg.sunPos[0] * 0.7, cfg.sunPos[1], P.pos.z + cfg.sunPos[2] * 0.7);
      sun.target.position.set(P.pos.x, 0, P.pos.z);
    }

    function updateCards(dt, t) {
      let near = null, nd = 1e9;
      G.cards.forEach((c, i) => {
        const m = c.mesh;
        if (c.done) {
          if (c.flying !== undefined && m.visible) { c.flying += dt; m.position.y += dt * 6; m.scale.setScalar(Math.max(.01, 1 - c.flying * 1.6)); if (c.flying > .6) m.visible = false; }
          return;
        }
        m.userData.face.rotation.y += dt * 1.6;
        m.userData.face.position.y = 1.3 + Math.sin(t * 2.4 + i) * .15;
        m.userData.ring.scale.setScalar(1 + Math.sin(t * 3 + i) * .12);
        const dx = m.position.x - P.pos.x, dz = m.position.z - P.pos.z, d = Math.hypot(dx, dz);
        if (d < nd) { nd = d; near = c; }
        if (G.playing && !G.paused && d < 1.5 && Math.abs(P.pos.y - m.position.y) < 1.6 && performance.now() > c.cool) openQuiz(c);
      });
      // 가장 가까운 카드 쪽 화살표
      arrow.visible = false;
      // 바닥 길안내: 내 발밑에서 가장 가까운 카드까지 흘러가는 점선
      const showGuide = near && nd > 2.2 && G.playing;
      const STEP = .9, OFF = (t * 2.2) % STEP;
      const dx = near ? near.mesh.position.x - P.pos.x : 0, dz = near ? near.mesh.position.z - P.pos.z : 0;
      guideDots.forEach((d, i) => {
        const along = .9 + i * STEP + OFF;
        if (!showGuide || along > nd - .9) { d.visible = false; return; }
        const u = along / nd;
        d.visible = true;
        d.position.set(P.pos.x + dx * u, .06, P.pos.z + dz * u);
        d.material.opacity = Math.min(1, (nd - .9 - along) / 1.5, along / 1.6) * .9;
        // 문제를 찾아가는 점선은 항상 깨끗한 흰선(White)으로만 표시
        d.material.color.copy(GUIDE_COL);
      });
    }

    function updateFx(dt) {
      for (let i = fx.length - 1; i >= 0; i--) {
        const m = fx[i]; m.userData.life -= dt;
        if (m.userData.ripple) { m.scale.addScalar(dt * 3.5); m.material.opacity = Math.max(0, (m.userData.life / m.userData.maxLife) * 0.85); } else if (m.userData.puff) {
          m.position.addScaledVector(m.userData.v, dt);
          m.scale.setScalar(1 + (.5 - m.userData.life) * 3);
          m.material.opacity = Math.max(0, m.userData.life * 1.5);
        } else {
          m.userData.v.y -= 12 * dt; m.position.addScaledVector(m.userData.v, dt); m.rotation.x += dt * 8;
          m.scale.setScalar(Math.max(.01, m.userData.life));
        }
        if (m.userData.life <= 0) { scene.remove(m); fx.splice(i, 1); }
      }
    }

    let radarTick = 0;
    function loop() {
      requestAnimationFrame(loop);
      const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
      if (G.playing && !G.paused) {
        updatePlayer(dt);
        G.time += dt;
        if (G.mode === "timed") {
          const left = Math.max(0, TIME_LIMIT - G.time);
          $("timerText").textContent = fmt(left);
          if (left <= 0) endGame(false);
        }
      }
      else if (hero) animateHero(dt);
      updateWorld(t, dt);
      updatePinSpotlight(t);
      updateCards(dt, t);
      updateFx(dt);
      updateCamera(dt);
      if (G.playing) updateOcclusion();
      if ((radarTick += dt) > .1) { radarTick = 0; if (G.playing) drawRadar(); }
      renderer.render(scene, camera);
    }

    /* ───────────── 화면 흐름 ───────────── */
    function updateRolePrefixUI() {
      const prefixEl = $("heroRolePrefix");
      const inputEl = $("heroCustomName");
      if (prefixEl) prefixEl.textContent = HERO_ROLES[G.hero] || "탐험가";
      if (inputEl) inputEl.placeholder = `예: ${HERO_DEFAULTS[G.hero] || "도로"}`;
    }

    function initHeroNameInput() {
      const input = $("heroCustomName");
      if (!input || input.dataset.bound) return;
      input.dataset.bound = "1";
      input.value = G.customName || "";
      updateRolePrefixUI();
      input.addEventListener("input", e => {
        let val = e.target.value;
        const clean = val.replace(/^(탐험가|로보트|로봇|마법사)\s*/g, "").replace(/\s*\([^)]*\)/g, "").trim();
        G.customName = clean;
        save({ customHeroName: clean });
        renderHeroes();
        if (hero) { scene.remove(hero); hero = makeHero(G.hero); scene.add(hero); }
        refreshStageCompanions();
      });
    }
    function renderHeroes() {
      const heroTypes = ["explorer", "cyberbot", "wizard"];
      $("heroRow").innerHTML = heroTypes.map(id => {
        const fullName = getHeroFullName(id, true);
        return `
          <button type="button" class="hero-card ${G.hero === id ? "on" : ""}" data-hero="${id}" aria-pressed="${G.hero === id}">
            <span class="art">${art(id)}</span><span>${fullName}</span></button>`;
      }).join("");

      $("heroRow").querySelectorAll("[data-hero]").forEach(b => b.onclick = () => {
        G.hero = b.dataset.hero;
        save({ hero: G.hero });
        sfx("tap");
        updateRolePrefixUI();
        renderHeroes();
        if (hero) { scene.remove(hero); hero = makeHero(G.hero); scene.add(hero); }
        refreshStageCompanions();
      });
      updateRolePrefixUI();
    }
    function showTitle() {
      G.customName = (load().customHeroName || "").replace(/^(탐험가|로보트|로봇|마법사)\s*/g, "").replace(/\s*\([^)]*\)/g, "").trim();
      initHeroNameInput();
      setStageVisuals(1);
      renderHeroes();
      const n = Object.keys(load().book || {}).length;
      $("bookCount").textContent = `${n} / ${ALL_VOCAB.length}`;
      show("startModal");
    }
    function startGame(mode) {
      ["startModal", "resultModal", "pauseModal", "quizModal", "bookModal"].forEach(hide);
      G.mode = mode; G.score = 0; G.combo = 0; G.got = 0; G.stage = 1; G.stageGot = 0; G.total = 30; G.time = 0; G.missed = new Set(); G.learned = []; G.saved = false;
      scene.remove(hero); hero = makeHero(G.hero); scene.add(hero);
      refreshStageCompanions();
      P.pos.set(0, 0, 4); P.vy = 0; P.face = Math.PI; camYaw = 0; camPitch = .5;
      setStageVisuals(1);
      spawnCards();
      $("timerPill").classList.toggle("hidden", mode !== "timed");
      $("timerText").textContent = fmt(TIME_LIMIT);
      updateHud();
      G.playing = true; G.paused = false;
      $("app").classList.add("play");
      showStageBanner("게임 스타트!", "10장의 카드를 찾아 모두 모아보세요!");
      notice("바닥의 반짝이 길을 따라가요!");
      sfx("get");
    }
    function openPause() { if (!G.playing || isOpen("quizModal")) return; G.paused = true; syncSound(); show("pauseModal"); }
    function closePause() { hide("pauseModal"); G.paused = false; }
    function toTitle() { G.playing = false; G.paused = true; $("app").classList.remove("play"); ["pauseModal", "resultModal", "quizModal"].forEach(hide); showTitle(); }

    function endGame(all) {
      if (!G.playing) return;
      G.playing = false; G.paused = true;
      hide("quizModal"); sfx("end");
      $("resultTitle").textContent = all ? (G.stage >= 3 && G.stageGot >= 10 ? "3개 스테이지 모두 클리어!" : "다 모았어요!") : "시간 끝!";
      $("resultScore").textContent = G.score;
      $("resultCards").textContent = `${G.got} / ${G.total} (${G.stage}개 스테이지)`;
      $("resultTime").textContent = fmt(G.mode === "timed" ? Math.min(G.time, TIME_LIMIT) : G.time);
      $("rankName").value = load().lastName || getHeroFullName();
      $("rankForm").classList.toggle("hidden", G.score <= 0);
      renderRanks(null);
      const list = $("reviewWordList"); list.innerHTML = "";
      G.learned.forEach(l => {
        const chip = document.createElement("div");
        chip.className = "wordchip" + (G.missed.has(l.word) ? " miss" : "");
        chip.innerHTML = `<span>${esc(l.word)}</span><button type="button" aria-label="${esc(l.word)} 뜻 듣기">${ART.speaker}</button>`;
        chip.querySelector("button").onclick = () => say(`${l.word}. ${l.mean}`);
        list.appendChild(chip);
      });
      show("resultModal");
    }
    function renderRanks(myId) {
      const ranks = (load().ranks || {})[G.mode] || [];
      $("rankList").innerHTML = ranks.length ? ranks.map((r, i) => `<li class="${r.id === myId ? "me" : ""}"><span class="rk">${i + 1}</span><span class="art">${art(r.hero)}</span><span>${esc(r.name)}</span><span class="sc">${r.score}</span></li>`).join("")
        : `<li style="grid-template-columns:1fr;text-align:center;color:var(--ink-soft)">${G.mode === "timed" ? "3분 도전" : "천천히 탐험"} 순위가 아직 없어요</li>`;
    }
    $("rankForm").addEventListener("submit", e => {
      e.preventDefault();
      if (G.saved) return;
      const name = $("rankName").value.trim() || getHeroFullName();
      const s = load(), ranks = s.ranks || {}, list = ranks[G.mode] || [];
      const me = { id: Date.now(), name, score: G.score, hero: G.hero };
      list.push(me); list.sort((a, b) => b.score - a.score);
      ranks[G.mode] = list.slice(0, 5);
      save({ ranks, lastName: name });
      G.saved = true; $("rankForm").classList.add("hidden");
      renderRanks(me.id);
      toast(ranks[G.mode].some(r => r.id === me.id) ? "순위표에 올랐어요!" : "아쉽게 5등 안에 못 들었어요");
    });

    function openBook() {
      const book = load().book || {};
      const groups = [
        ["하", "난이도 하 (기초 어휘 18선)", WORDS_LOW, "#FFD600"],
        ["중", "난이도 중 (교과 어휘 18선)", WORDS_MID, "#00C853"],
        ["상", "난이도 상 (심화 어휘 18선)", WORDS_HIGH, "#FF253A"]
      ];
      let n = 0;
      $("bookScroll").innerHTML = groups.map(([diffName, title, words, color]) => `
        <div class="book-zone"><h3><i style="background:${color}"></i>${title}</h3><div class="book-grid">
        ${words.map(w => { const has = book[w.word]; if (has) n++; return has
          ? `<div class="bcard"><span>${w.pic ? w.pic + " " : ""}${esc(w.word)}</span><button type="button" data-say="${esc(w.word + ". " + (w.meaning || ("북한말 " + w.nk)))}" aria-label="${esc(w.word)} 듣기">${ART.speaker}</button></div>`
          : `<div class="bcard locked">?</div>`; }).join("")}</div></div>`).join("");
      $("bookTotal").textContent = `${n} / ${ALL_VOCAB.length}`;
      $("bookScroll").querySelectorAll("[data-say]").forEach(b => b.onclick = () => say(b.dataset.say));
      show("bookModal");
    }
    function closeBook() { hide("bookModal"); }

    document.addEventListener("visibilitychange", () => { if (document.hidden && G.playing && !G.paused) openPause(); });

    function refreshZoneSigns() {
      zoneSignBoards.forEach(({ frontBoard, backBoard, board, z }) => {
        const tex = textTexture(z.name, z.color, "#fff");
        if (frontBoard && frontBoard.material) {
          frontBoard.material.map = tex;
          frontBoard.material.needsUpdate = true;
        }
        if (backBoard && backBoard.material) {
          backBoard.material.map = tex;
          backBoard.material.needsUpdate = true;
        }
        if (board && board.material && board !== frontBoard) {
          board.material.map = tex;
          board.material.needsUpdate = true;
        }
      });
    }

    /* ───────────── 시작 ───────────── */
    async function boot() {
      try {
        await Promise.all([
          document.fonts.load("80px 'BMJUA'", "과학 숲 생활 마을 문제풀이 광장 점프 놀이터"),
          document.fonts.load("80px 'Jua'", "과학 숲 생활 마을 문제풀이 광장 점프 놀이터"),
          document.fonts.ready
        ]);
      } catch (e) {}
      try {
        initThree();
        document.fonts.ready.then(() => refreshZoneSigns());
        syncSound();
        showTitle();
        loop();
        setTimeout(() => $("loadingScreen").remove(), 200);
      } catch (err) {
        console.error(err);
        $("loadingScreen").innerHTML = "3D 화면을 열지 못했어요.<br><span class='small' style='font-size:16px'>인터넷 연결을 확인하고 새로고침해 주세요.</span>";
      }
    }
    boot();
  </script>

</body>
